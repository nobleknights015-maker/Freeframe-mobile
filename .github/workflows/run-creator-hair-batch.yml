name: Plushbound Creator Hair Batch

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/creator_hair_batch_trigger.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plushbound-creator-hair-batch
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      styles: ${{ steps.plan.outputs.styles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - id: plan
        name: Validate bounded hair wave
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('modal_worker/creator_hair_batch_trigger.json').read_text())
          assert d['schema']=='plushbound.creator_hair_batch_trigger.v1'
          styles=[int(x) for x in d['style_indices']]
          assert len(styles)==len(set(styles))
          assert all(1 <= x <= 96 for x in styles)
          assert not ({1,21,57,65} & set(styles)), 'accepted canary/archetype IDs may not be bulk-regenerated'
          assert len(styles) <= 24
          assert int(d['style_count'])==len(styles)
          assert int(d['max_paid_renders'])==len(styles)*5
          assert int(d['max_paid_extractions'])==len(styles)*4
          assert int(d['max_parallel'])==2
          assert d['requires_archetype_gate'] is True
          assert d['catalog_wide_launch_authorized'] is False
          assert int(d['launch_nonce']) >= 1
          enabled = d['enabled'] is True
          print(f"enabled={'true' if enabled else 'false'}")
          print('styles='+json.dumps(styles, separators=(',',':')))
          PY

  produce:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        style_index: ${{ fromJSON(needs.preflight.outputs.styles) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID missing' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET missing' >&2; exit 1; }
      - name: Install bounded production dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'numpy>=2,<3' 'pillow>=10.4,<12'
      - name: Compile paired hair batch runner
        run: python -m compileall -q modal_worker/creator_hair_batch.py modal_worker/creator_hair_splitter.py modal_worker/creator_hair_style_catalog.py
      - name: Produce one exact paired hairstyle
        shell: bash
        run: |
          set -euo pipefail
          STYLE='${{ matrix.style_index }}'
          LOG="creator-hair-batch-${STYLE}.log"
          sleep $((STYLE % 2 * 10))
          for attempt in 1 2 3 4; do
            set +e
            PYTHONPATH=. modal run modal_worker/creator_hair_batch.py --style-index "$STYLE" >"$LOG.tmp" 2>&1
            code=$?
            set -e
            cat "$LOG.tmp" >> "$LOG"
            if [ "$code" -eq 0 ]; then
              rm -f "$LOG.tmp"
              exit 0
            fi
            # Only retry the explicit app-creation throttle, which occurs before paid
            # generation starts. Generic RESOURCE_EXHAUSTED failures are intentionally
            # not retried because they may happen after paid work has already occurred.
            if ! grep -Fq 'App create rate limit exceeded' "$LOG.tmp"; then
              echo 'Non-prelaunch failure; refusing automatic paid retry.' | tee -a "$LOG"
              rm -f "$LOG.tmp"
              exit "$code"
            fi
            rm -f "$LOG.tmp"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Verify exact paired evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          style=int('${{ matrix.style_index }}')
          root=Path(f'creator-hair-batch-output/style-{style:03d}')
          report=json.loads((root/'report.json').read_text())
          assert report['schema']=='plushbound.creator_hair_batch.v1'
          assert report['style_index']==style
          assert report['paid_render_count']==5
          assert report['paid_extraction_count']==4
          assert report['alpha_validation']['disjoint'] is True
          assert report['alpha_validation']['lossless_union'] is True
          assert report['catalog_wide_launch_authorized'] is False
          for name in (f'creator-hair-source-{style:03d}.png', f'creator-front-hair-{style:03d}.png', f'creator-back-hair-{style:03d}.png'):
            with Image.open(root/name) as im:
              im.load(); assert im.size==(144,192); assert 'A' in im.getbands()
          print(f'creator hair style {style:03d} evidence verified')
          PY
      - name: Upload paired hairstyle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-hair-batch-${{ matrix.style_index }}-${{ github.run_id }}
          path: |
            creator-hair-batch-${{ matrix.style_index }}.log
            creator-hair-batch-output/style-*/
          if-no-files-found: error
          retention-days: 14
