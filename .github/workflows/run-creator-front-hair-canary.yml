name: Plushbound Creator Front Hair Canary

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/creator_front_hair_canary_trigger.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plushbound-creator-front-hair-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID missing' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET missing' >&2; exit 1; }
      - name: Install bounded canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Validate front-hair trigger
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('modal_worker/creator_front_hair_canary_trigger.json').read_text())
          assert d['schema']=='plushbound.creator_front_hair_canary_trigger.v1'
          assert d['enabled'] is True
          assert d['logical_id']=='creator/front-hair/001'
          assert d['dimensions']=='144x192'
          assert d['layout']=='3x4-48px'
          assert int(d['max_paid_renders'])==5
          assert int(d['max_paid_extractions'])==4
          assert d['catalog_wide_launch_authorized'] is False
          print('front-hair trigger bounded: 1 logical asset / <=5 renders / <=4 extractions')
          PY
      - name: Compile front-hair canary
        run: python -m compileall -q modal_worker/creator_front_hair_canary.py
      - name: Run one creator front-hair canary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "front-hair canary attempt $attempt"
            set +e
            PYTHONPATH=. modal run modal_worker/creator_front_hair_canary.py 2>&1 | tee creator-front-hair-canary.log
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eq 'App create rate limit exceeded|Status\.RESOURCE_EXHAUSTED' creator-front-hair-canary.log; then
              echo 'Non-throttle failure; refusing automatic paid retry.' >&2
              exit "$rc"
            fi
            sleep $(( attempt * 20 ))
          done
          echo 'Creator front-hair canary exhausted throttle retries.' >&2
          exit 1
      - name: Require exact front-hair evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report=json.loads(Path('creator-front-hair-001-report.json').read_text())
          assert report['schema']=='plushbound.creator_front_hair_canary.v1'
          assert report['logical_id']=='creator/front-hair/001'
          assert report['status']=='generated_pending_visual_review'
          assert report['paid_render_count']==5
          assert report['paid_extraction_count']==4
          assert report['source_direction_count']==4
          assert report['extraction_backend']=='deployed_birefnet'
          assert len(report['extraction'])==4
          assert report['validation']['passed'] is True
          assert report['catalog_wide_launch_authorized'] is False
          with Image.open('creator-front-hair-001.png') as im:
              im.load()
              assert im.format=='PNG'
              assert im.size==(144,192), im.size
              assert im.mode=='RGBA', im.mode
              alpha=im.getchannel('A')
              for row in range(4):
                  for col in range(3):
                      bbox=alpha.crop((col*48,row*48,(col+1)*48,(row+1)*48)).getbbox()
                      assert bbox is not None, (row,col)
                      assert bbox[3] <= 30, (row,col,bbox)
          print('creator/front-hair/001 machine evidence verified: 4 directional overlays / exact 144x192 RGBA')
          PY
      - name: Upload creator front-hair canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-front-hair-canary-${{ github.run_id }}
          path: |
            creator-front-hair-canary.log
            creator-front-hair-001.png
            creator-front-hair-001-reference.png
            creator-front-hair-001-report.json
            creator-front-hair-001-sources/
          if-no-files-found: error
          retention-days: 14
