name: Plushbound World Asset Pipeline V2 Run Guard

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_asset_pipeline_v2_run_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-asset-pipeline-v2-run-guard
  cancel-in-progress: false

jobs:
  validate-trigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zero-spend validation dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'

      - name: Validate trigger, freeze, planner and runner declaration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import build_rows
          from modal_worker.world_asset_pipeline_v2_runner import declaration_validation

          trigger = json.loads(Path('modal_worker/world_asset_pipeline_v2_run_trigger.json').read_text())
          freeze = json.loads(Path('modal_worker/world_asset_pipeline_v2_freeze.json').read_text())
          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          assert trigger['schema'] == 'plushbound.world_asset_pipeline_v2_run_trigger.v1'
          assert trigger['mode'] == 'selected_ids_one_region'
          assert trigger['generation_attempts_per_requested_id_cap'] == 1
          assert trigger['one_region_only'] is True
          assert trigger['accepted_ids_must_be_excluded'] is True
          assert trigger['manual_visual_qa_required'] is True
          assert trigger['compile_authorized'] is False
          assert trigger['catalog_wide_launch_authorized'] is False
          assert trigger['runtime_import_proof'] is False
          declaration = declaration_validation()
          assert declaration['status'] == 'PASS_ZERO_GPU_SINGLE_RUNNER_DECLARATION'

          if trigger['enabled']:
              region = trigger['region']
              ids = trigger['requested_source_ids']
              assert isinstance(region, str) and region
              assert isinstance(ids, list) and 1 <= len(ids) <= 8 and len(ids) == len(set(ids))
              rows, plan = build_rows(region, ids)
              assert [row['asset_id'] for row in rows] == ids
              assert not set(ids).intersection(plan['accepted_ids_excluded'])
              if freeze['production_frozen'] or state['production_frozen']:
                  raise RuntimeError('V2 run trigger enabled while production freeze is active')
              raise RuntimeError('V2 activation guard has no generation capability; production executor is intentionally not installed yet')

          assert freeze['production_frozen'] is True
          assert freeze['paid_remote_execution_allowed'] is False
          assert state['production_frozen'] is True
          assert state['paid_execution_enabled'] is False
          print('WORLD_ASSET_V2_RUN_GUARD=PASS_DISABLED_ZERO_SPEND')
          PY

      - name: Record zero-spend guard result
        run: |
          printf '%s\n' '{"schema":"plushbound.world_asset_pipeline_v2_run_guard.v1","status":"PASS_DISABLED_ZERO_SPEND","provider_calls":0,"gpu_calls":0,"generation_calls":0,"production_executor_installed":false,"catalog_wide_launch_authorized":false,"runtime_import_proof":false}' > world-asset-v2-run-guard.json

      - name: Upload run-guard evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-asset-v2-run-guard-${{ github.run_id }}
          path: world-asset-v2-run-guard.json
          if-no-files-found: error
          retention-days: 14
