name: Test WORLD_TILE_ASSET_V1 Production CLI

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/world_tile_production_cli.py'
      - 'modal_worker/a5_tilesheet_compiler.py'
      - 'modal_worker/world_tile_package_exporter.py'
      - 'modal_worker/world_editor_tile_ingest_gate.py'
      - 'tests/test_world_tile_production_cli.py'
      - '.github/workflows/test-world-tile-production-cli.yml'
  pull_request:
    paths:
      - 'modal_worker/world_tile_production_cli.py'
      - 'modal_worker/a5_tilesheet_compiler.py'
      - 'modal_worker/world_tile_package_exporter.py'
      - 'modal_worker/world_editor_tile_ingest_gate.py'
      - 'tests/test_world_tile_production_cli.py'

jobs:
  production-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic dependency only
        run: python -m pip install Pillow
      - name: Run end-to-end production CLI regression suite
        run: python -m unittest tests.test_world_tile_production_cli -v
      - name: Verify production CLI contains no generator, GPU, resize, crop, or resample path
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('modal_worker/world_tile_production_cli.py').read_text().lower()
          forbidden = ['import modal', '.resize(', '.crop(', 'resample=', 'generator_used = true', 'gpu_used = true']
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f'forbidden production CLI behavior found: {found}')
          PY
      - name: Verify CLI binds compile, export, and final package validation
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('modal_worker/world_tile_production_cli.py').read_text()
          required = ['compile_world_tile_sheet', 'export_world_tile_package', 'validate_exported_package']
          missing = [name for name in required if name not in text]
          if missing:
              raise SystemExit(f'production CLI missing required stage(s): {missing}')
          PY
