name: Plushbound World Maps Final Bounded Canary

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_map_final_canary_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-map-final-paid-canary
  cancel-in-progress: false

jobs:
  bounded-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run deterministic no-spend gate at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/world_map_final_preflight.py > world-map-preflight-current-head.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('world-map-preflight-current-head.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND'
          assert r['production_skipped'] is True
          assert r['generation_calls'] == 0
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Validate bounded paid trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/world_map_final_canary_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.world_map_final_canary_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'bounded_final_canary'
          assert t['asset_cap'] == 8
          assert t['preflight_run_id'] == 40619587708
          assert t['preflight_conclusion'] == 'success'
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['creator_full_outfits_remain_closed_at'] == 24
          print('BOUNDED_CANARY_TRIGGER=VALID')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile bounded world producer
        run: python -m compileall -q modal_worker/world_map_final_production.py

      - name: Run exactly one bounded 8-asset final-production canary
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/world_map_final_production.py --limit 8 | tee world-map-final-canary.log

      - name: Verify canary report before artifact banking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('world-map-final-canary/report.json')
          assert p.is_file(), 'missing world canary report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.world_map_final_canary_report.v1'
          assert r['requested_count'] == 8
          assert r['accepted_count'] == 8
          assert r['quarantined_count'] == 0
          assert r['catalog_wide_launch_authorized'] is False
          assets = r['assets']
          assert len(assets) == 8
          assert len({a['asset_id'] for a in assets}) == 8
          assert len({a['sha256'] for a in assets}) == 8
          assert all(a['width'] == 1024 and a['height'] == 768 for a in assets)
          assert all(a['inspection']['accepted'] is True for a in assets)
          print('WORLD_MAP_FINAL_CANARY=PASS_8_OF_8')
          PY

      - name: Upload canary products and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-map-final-canary-${{ github.run_id }}
          path: |
            world-map-preflight-current-head.json
            world-map-final-canary.log
            world-map-final-canary/
          if-no-files-found: warn
          retention-days: 14
