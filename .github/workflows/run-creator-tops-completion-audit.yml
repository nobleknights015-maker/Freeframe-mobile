name: Plushbound Creator Tops Completion Audit

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/creator_tops_completion_audit.py
      - modal_worker/creator_tops_completion_contract.json
      - modal_worker/creator_tops_exception_*.json
      - .github/workflows/run-creator-tops-completion-audit.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: plushbound-creator-tops-completion-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile deterministic Tops completion auditor
        run: python -m py_compile modal_worker/creator_tops_completion_audit.py
      - name: Audit jobs, evidence, artifacts, and exceptions
        run: python modal_worker/creator_tops_completion_audit.py
      - name: Publish concise audit summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('creator-tops-completion-audit.json'))
          print('# Creator Tops completion audit')
          print(f"- Run: `{d['bulk_run_id']}`")
          print(f"- Run status: `{d['bulk_run_status']}` / `{d['bulk_run_conclusion']}`")
          print(f"- Contract-ready styles: **{d['ready_style_count']}/{d['expected_style_count']}**")
          print(f"- Active/queued styles: **{d['active_or_queued_job_count']}**")
          print(f"- Failed styles: **{d['failed_job_count']}**")
          print(f"- Unresolved exceptions: **{len(d['unresolved_exceptions'])}**")
          print(f"- Ready for Full Outfits handoff: **{d['ready_for_handoff']}**")
          PY
      - name: Upload Tops completion audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: creator-tops-completion-audit-${{ github.run_id }}
          path: creator-tops-completion-audit.json
          if-no-files-found: error
          retention-days: 14
