name: Plushbound Gloamfen A5 Final Deterministic Compile

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_gloamfen_a5_final_compile_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  compile-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate exact zero-GPU compile trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('modal_worker/tileset_gloamfen_a5_final_compile_trigger.json').read_text(encoding='utf-8'))
          assert t['schema']=='plushbound.tileset_gloamfen_a5_final_compile_trigger.v1'
          assert t['enabled'] is True
          assert t['mode']=='compile_closed_green_eight_source_bank'
          assert t['region']=='gloamfen'
          assert t['source_count']==8
          assert [t['provider_calls_allowed'],t['gpu_calls_allowed'],t['generation_calls_allowed']]==[0,0,0]
          assert t['catalog_wide_launch_authorized'] is False
          assert t['runtime_import_proof'] is False
          closeout=Path(t['source_closeout_path'])
          assert closeout.is_file()
          c=json.loads(closeout.read_text(encoding='utf-8'))
          assert c['schema']=='plushbound.tileset_regional_a5_source_closeout.v1'
          assert c['status']=='CLOSED_GREEN_8_OF_8'
          assert c['machine_gate']=='PASS_8_OF_8' and c['manual_visual_gate']=='PASS_8_OF_8'
          assert c['accepted_source_ids_protected_from_rerender'] is True
          assert c['source_artifact_run_id']==t['source_artifact_run_id']
          assert c['source_artifact_id']==t['source_artifact_id']
          assert c['source_artifact_sha256']==t['source_artifact_sha256']
          print('GLOAMFEN_FINAL_COMPILE_TRIGGER=VALID_ZERO_GPU')
          PY

      - name: Download exact closed eight-source artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-gloamfen-eight-source-candidate-40718139937
          path: source-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40718139937

      - name: Verify exact source hashes before compile
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          closeout=json.loads(Path('modal_worker/tileset_gloamfen_a5_source_closeout.json').read_text(encoding='utf-8'))
          manifest=Path('source-artifact/accepted-eight-candidate/gloamfen/manifest.json')
          assert manifest.is_file()
          m=json.loads(manifest.read_text(encoding='utf-8'))
          assert m['machine_pass_count']==8 and m['source_count']==8
          source_root=Path('source-artifact/accepted-eight-candidate/gloamfen/raw')
          expected={row['material_key']:row for row in closeout['sources']}
          assert len(expected)==8
          for material,row in expected.items():
              p=source_root/f'{material}-384.png'
              assert p.is_file()
              assert hashlib.sha256(p.read_bytes()).hexdigest()==row['raw_sha256']
          print('GLOAMFEN_CLOSED_SOURCE_HASHES=PASS_8_OF_8')
          PY

      - name: Compile deterministic Engine v1 A5 geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p compiled/gloamfen
          PYTHONPATH=. python modal_worker/tileset_regional_a5_compiler.py \
            --region gloamfen \
            --source-root source-artifact/accepted-eight-candidate/gloamfen/raw \
            --source-closeout modal_worker/tileset_gloamfen_a5_source_closeout.json \
            --output-dir compiled/gloamfen \
            | tee compiled/gloamfen/compiler-stdout.json

      - name: Validate Engine v1 compatibility contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/engine_v1_a5_compatibility_validator.py \
            --sheet compiled/gloamfen/gloamfen_A5.png \
            > compiled/gloamfen/engine-v1-compatibility.json
          python - <<'PY'
          import json
          from pathlib import Path
          compiler=json.loads(Path('compiled/gloamfen/report.json').read_text(encoding='utf-8'))
          engine=json.loads(Path('compiled/gloamfen/engine-v1-compatibility.json').read_text(encoding='utf-8'))
          assert compiler['status']=='PASS_NO_SPEND_DETERMINISTIC_COMPILE_ENGINE_PROFILE'
          assert compiler['sheet_width']==384 and compiler['sheet_height']==768
          assert compiler['tile_size']==48 and compiler['columns']==8 and compiler['rows']==16
          assert compiler['slot_count']==128 and compiler['unique_slot_hashes']==128
          assert [compiler['provider_calls'],compiler['gpu_calls'],compiler['generation_calls']]==[0,0,0]
          assert compiler['runtime_import_proof'] is False and compiler['catalog_wide_launch_authorized'] is False
          assert engine['status']=='PASS_ENGINE_V1_COMPATIBILITY_CONTRACT'
          assert engine['sheet_sha256']==compiler['sheet_sha256']
          assert engine['sheet_width']==384 and engine['sheet_height']==768
          assert engine['slot_count']==128 and engine['unique_slot_hashes']==128
          assert [engine['provider_calls'],engine['gpu_calls'],engine['generation_calls']]==[0,0,0]
          assert engine['runtime_import_proof'] is False
          print('GLOAMFEN_A5_COMPILE=PASS_128_UNIQUE_SLOTS')
          print(f"GLOAMFEN_A5_SHA256={compiler['sheet_sha256']}")
          PY

      - name: Upload compiled A5 and compatibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-final-compiled-${{ github.run_id }}
          path: compiled/gloamfen/
          if-no-files-found: error
          retention-days: 14
