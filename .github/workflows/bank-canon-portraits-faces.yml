name: Bank Canon Portraits And Faces

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/canon_portrait_bank_trigger.json'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: plushbound-canon-portrait-bank
  cancel-in-progress: false

jobs:
  bank:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic banking dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Resolve latest successful portrait evidence runs
        shell: bash
        run: |
          set -euo pipefail
          CHRIS_RUN_ID="$(gh run list --workflow run-canon-portrait-canary.yml --branch freeframe-modal-worker --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          BATCH_RUN_ID="$(gh run list --workflow run-canon-portrait-batch.yml --branch freeframe-modal-worker --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$CHRIS_RUN_ID"
          test -n "$BATCH_RUN_ID"
          echo "CHRIS_RUN_ID=$CHRIS_RUN_ID" >> "$GITHUB_ENV"
          echo "BATCH_RUN_ID=$BATCH_RUN_ID" >> "$GITHUB_ENV"
          echo "chris=$CHRIS_RUN_ID batch=$BATCH_RUN_ID"
      - name: Download exact successful portrait artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p canon-bank-input/chris canon-bank-input/batch
          gh run download "$CHRIS_RUN_ID" --name "canon-portrait-canary-$CHRIS_RUN_ID" --dir canon-bank-input/chris
          gh run download "$BATCH_RUN_ID" --name "canon-portrait-batch-$BATCH_RUN_ID" --dir canon-bank-input/batch
          test -s canon-bank-input/chris/chris_bourn_portrait.png
          for id in penney_nguyen lily ethan; do
            test -s "canon-bank-input/batch/${id}_portrait.png"
          done
      - name: Verify evidence reports remain pending-bank canary outputs
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('canon-bank-input/chris/report.json').read_text())
          b = json.loads(Path('canon-bank-input/batch/report.json').read_text())
          assert c['character_id'] == 'chris_bourn'
          assert c['status'] == 'generated_pending_visual_review'
          assert c['quality_gate']['geometry_pass'] and c['quality_gate']['rgba_pass'] and c['quality_gate']['alpha_present']
          assert b['status'] == 'generated_pending_visual_review'
          assert b['requested'] == b['completed'] == 3
          assert {e['character_id'] for e in b['entries']} == {'penney_nguyen','lily','ethan'}
          for e in b['entries']:
              q=e['quality_gate']
              assert q['geometry_pass'] and q['rgba_pass'] and q['alpha_present']
          PY
      - name: Bank approved portraits and derive faces
        run: python -m modal_worker.bank_canon_portraits_faces
      - name: Validate banked family cardinality and geometry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          ids=('chris_bourn','penney_nguyen','lily','ethan')
          ledger=json.loads(Path('modal_worker/canon_banked/canon_portrait_face_ledger_v1.json').read_text())
          assert ledger['status']=='banked'
          assert ledger['character_count']==4
          assert ledger['portrait_count']==4
          assert ledger['face_count']==4
          assert ledger['new_runtime_assets_banked']==8
          assert ledger['proven_canon_runtime_assets_total']==12
          assert set(ledger['characters'])==set(ids)
          for cid in ids:
              with Image.open(f'modal_worker/canon_banked/portraits/{cid}.png') as im:
                  assert im.size==(288,384) and im.mode=='RGBA'
              with Image.open(f'modal_worker/canon_banked/faces/{cid}.png') as im:
                  assert im.size==(144,144) and im.mode=='RGBA'
          PY
      - name: Commit banked canon runtime assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Plushbound Atlas'
          git config user.email 'actions@users.noreply.github.com'
          git add modal_worker/canon_banked/portraits modal_worker/canon_banked/faces modal_worker/canon_banked/canon_portrait_face_ledger_v1.json
          if git diff --cached --quiet; then
            echo 'No banking changes to commit.'
            exit 0
          fi
          git commit -m 'Bank proven canon portraits and deterministic faces'
          git push origin HEAD:freeframe-modal-worker
      - name: Upload bank ledger evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-portrait-face-bank-${{ github.run_id }}
          path: |
            modal_worker/canon_banked/canon_portrait_face_ledger_v1.json
            modal_worker/canon_banked/portraits/
            modal_worker/canon_banked/faces/
          if-no-files-found: warn
          retention-days: 30
