name: Atlas Four-Lane Generation Matrix Canary

on:
  workflow_dispatch:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/atlas_generation_matrix_canary.py'
      - '.github/workflows/run-atlas-generation-matrix-canary.yml'

permissions:
  contents: read

concurrency:
  group: atlas-generation-matrix-canary
  cancel-in-progress: false

jobs:
  matrix-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install bounded-canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile Atlas matrix canary surface
        run: python -m compileall -q modal_worker
      - name: Run four-lane Atlas production canary
        run: python -m modal_worker.atlas_generation_matrix_canary
      - name: Require all matrix evidence
        shell: bash
        run: |
          test -s atlas-matrix-character_elyndor_pathfinder.png
          test -s atlas-matrix-guardian_elyndor_meadow.png
          test -s atlas-matrix-enemy_elyndor_prowler.png
          test -s atlas-matrix-environment_elyndor_road.png
          test -s atlas-generation-matrix-report.json
      - name: Upload Atlas matrix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-generation-matrix-${{ github.run_id }}
          path: |
            atlas-matrix-*.png
            atlas-generation-matrix-report.json
          if-no-files-found: warn
          retention-days: 7
