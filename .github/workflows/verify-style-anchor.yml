name: Verify Plushbound Style Anchor

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/style_anchor_verify_trigger.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'
      - name: Verify all repository reference images
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('modal_worker/project_references')
          rows=[]
          bad=[]
          for p in sorted(root.glob('*.jpg')):
              b=p.read_bytes()
              try:
                  with Image.open(p) as im:
                      info=(im.format, im.size, im.mode)
                      im.verify()
                  ok=True; err=''
              except Exception as exc:
                  ok=False; info=None; err=f'{type(exc).__name__}: {exc}'
                  bad.append(p.name)
              rows.append({'name':p.name,'bytes':len(b),'soi':b[:2].hex(),'eoi':b[-2:].hex(),'ok':ok,'info':info,'error':err})
          for row in rows:
              print(row)
          print('BAD_REFERENCES',bad)
          if bad:
              raise SystemExit(1)
          print('ALL_PROJECT_REFERENCES_PIL_VERIFY_OK')
          PY
