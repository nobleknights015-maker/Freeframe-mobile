name: Plushbound Creator Brows Batch

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/creator_brows_batch_trigger.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plushbound-creator-brows-batch
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      styles: ${{ steps.plan.outputs.styles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - id: plan
        name: Validate deterministic brow wave
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          d=json.loads(Path('modal_worker/creator_brows_batch_trigger.json').read_text())
          assert d['schema']=='plushbound.creator_brows_batch_trigger.v1'
          styles=[int(x) for x in d['style_indices']]
          assert styles and len(styles)==len(set(styles))
          assert all(1 <= x <= 32 for x in styles)
          assert int(d['style_count'])==len(styles)
          assert int(d['max_parallel']) in (1,2,3,4)
          assert int(d['paid_render_budget'])==0
          assert int(d['paid_extraction_budget'])==0
          assert d['deterministic_only'] is True
          assert d['catalog_wide_launch_authorized'] is False
          assert d['requires_locked_body_qc'] is True
          assert d['phase'] in ('canary','bulk')
          if d['phase']=='canary': assert len(styles) <= 3
          assert int(d['launch_nonce']) >= 1
          print(f"enabled={'true' if d['enabled'] is True else 'false'}")
          print('styles='+json.dumps(styles,separators=(',',':')))
          PY

  produce:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        style_index: ${{ fromJSON(needs.preflight.outputs.styles) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic compiler dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'
      - name: Compile Creator Brows rail
        run: python -m compileall -q modal_worker/creator_brows_batch.py modal_worker/creator_brows_style_catalog.py
      - name: Produce one deterministic brow overlay
        run: PYTHONPATH=modal_worker python modal_worker/creator_brows_batch.py --style-index '${{ matrix.style_index }}'
      - name: Verify Creator Brows evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          style=int('${{ matrix.style_index }}')
          root=Path(f'creator-brows-batch-output/style-{style:03d}')
          report=json.loads((root/'report.json').read_text())
          assert report['schema']=='plushbound.creator_brows_batch.v1'
          assert report['style_index']==style
          assert report['logical_id']==f'creator/brows/{style:03d}'
          assert report['paid_render_count']==0
          assert report['paid_extraction_count']==0
          assert report['deterministic'] is True
          assert report['runtime_tintable'] is True
          assert report['catalog_wide_launch_authorized'] is False
          assert all(report['validation'].values())
          p=root/f'creator-brows-{style:03d}.png'
          with Image.open(p) as im:
              im.load(); assert im.size==(144,192); assert im.mode=='RGBA'
              assert im.getchannel('A').getbbox() is not None
              assert im.getchannel('A').crop((0,144,144,192)).getbbox() is None
          print(f'creator brows style {style:03d} evidence verified')
          PY
      - name: Upload Creator Brows evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-brows-batch-${{ matrix.style_index }}-${{ github.run_id }}
          path: creator-brows-batch-output/style-*/
          if-no-files-found: error
          retention-days: 14
