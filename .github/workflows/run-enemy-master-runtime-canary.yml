name: Run Enemy Master Runtime Canary

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/enemy_master_runtime_canary_trigger.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: enemy-master-runtime-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SOURCE_ARTIFACT_ID: '12563310718'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Download original accepted production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${SOURCE_ARTIFACT_ID}/zip > /tmp/enemy-source.zip
          rm -rf /tmp/enemy-source && mkdir -p /tmp/enemy-source
          unzip -q /tmp/enemy-source.zip -d /tmp/enemy-source
      - name: Verify source bytes and derive two real battlers through deployed BiRefNet
        env:
          PYTHONPATH: modal_worker
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import io
          import json
          from pathlib import Path

          import modal
          from enemy_master_runtime_production import MasterRecord, derive_one, inspect_alpha
          from PIL import Image

          cases = [
              {
                  'asset_id': 'reg/cinderreach/enemy-battle/001',
                  'path': '/tmp/enemy-source/max-production-output/round-0017/shard-2/reg__cinderreach__enemy-battle__001.png',
                  'sha256': '7fab60037758bfdf6fa591839b094f90057eaec4acc7f5530202ad0942f2ea9a',
              },
              {
                  'asset_id': 'reg/cinderreach/enemy-battle/002',
                  'path': '/tmp/enemy-source/max-production-output/round-0017/shard-2/reg__cinderreach__enemy-battle__002.png',
                  'sha256': 'b4a1112920d1cca054973ca6ea966a56cbbc8b7bd3c3075160ab2ec2823e7c6f',
              },
          ]

          extractor = modal.Cls.from_name('freeframe-worker', 'FreeFrameExtractor')()

          def remote_extract(raw: bytes):
              response = extractor.extract.remote({
                  'image_base64': base64.b64encode(raw).decode('ascii')
              })
              png = base64.b64decode(response['image_base64'], validate=True)
              return png, str(response.get('provider')), str(response.get('model'))

          root = Path('enemy-master-runtime-canary')
          root.mkdir(parents=True, exist_ok=True)
          report = {
              'schema': 'plushbound.enemy_master_runtime_canary.v1',
              'source_artifact_id': int('${{ env.SOURCE_ARTIFACT_ID }}'),
              'diffusion_generation_count': 0,
              'assets': [],
          }

          for case in cases:
              raw = Path(case['path']).read_bytes()
              actual_source_sha = hashlib.sha256(raw).hexdigest()
              if actual_source_sha != case['sha256']:
                  raise SystemExit(f"source hash mismatch for {case['asset_id']}: {actual_source_sha}")
              record = MasterRecord(
                  asset_id=case['asset_id'],
                  archive_path='historical-artifact:' + case['path'],
                  sha256=case['sha256'],
                  width=1024,
                  height=768,
                  model='black-forest-labs/FLUX.2-klein-4B',
                  preset='plushbound_enemy',
                  renderer_route='flux2_klein',
              )
              out_png, manifest = derive_one(record, raw, remote_extract)
              out = root / (case['asset_id'].replace('/', '__') + '.png')
              out.write_bytes(out_png)
              with Image.open(io.BytesIO(out_png)) as im:
                  im.load()
                  if im.size != (288, 288) or im.mode != 'RGBA':
                      raise SystemExit(f"invalid output geometry/mode for {case['asset_id']}: {im.size} {im.mode}")
                  alpha = inspect_alpha(im)
                  if not alpha['valid'] or alpha['edge_alpha_fraction'] != 0:
                      raise SystemExit(f"alpha gate failed for {case['asset_id']}: {alpha}")
              manifest['canary_output'] = str(out)
              report['assets'].append(manifest)

          if len(report['assets']) != 2:
              raise SystemExit('canary did not produce exactly two assets')
          (root / 'canary-report.json').write_text(json.dumps(report, indent=2, sort_keys=True) + '\n')
          print(json.dumps({
              'completed': len(report['assets']),
              'provider': report['assets'][0]['extractor_provider'],
              'model': report['assets'][0]['extractor_model'],
              'output_geometry': [288, 288],
              'diffusion_generation_count': 0,
          }, sort_keys=True))
          PY
      - name: Upload canary evidence
        uses: actions/upload-artifact@v4
        with:
          name: enemy-master-runtime-canary-${{ github.run_id }}
          path: enemy-master-runtime-canary/
          if-no-files-found: error
          retention-days: 14
