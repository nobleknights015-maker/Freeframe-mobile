name: Plushbound World Asset Pipeline V2 Zero-GPU Preflight

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_asset_pipeline_v2_preflight_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-asset-pipeline-v2-preflight
  cancel-in-progress: false

jobs:
  v2-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zero-spend validation dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'

      - name: Validate frozen control plane and resolve next region
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee v2-transition.json
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_controller import resolve_state, plan_region
          from modal_worker.world_asset_pipeline_v2_planner import validate_receiver_contract

          trigger = json.loads(Path('modal_worker/world_asset_pipeline_v2_preflight_trigger.json').read_text())
          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          freeze = json.loads(Path('modal_worker/world_asset_pipeline_v2_freeze.json').read_text())
          checkpoint = json.loads(Path('modal_worker/world_asset_pipeline_v2_rebuild_checkpoint.json').read_text())

          assert trigger['schema'] == 'plushbound.world_asset_pipeline_v2_preflight_trigger.v1'
          assert trigger['enabled'] is True
          assert [trigger['provider_calls_allowed'], trigger['gpu_calls_allowed'], trigger['generation_calls_allowed']] == [0, 0, 0]
          assert trigger['catalog_wide_launch_authorized'] is False
          assert freeze['production_frozen'] is True
          assert freeze['paid_remote_execution_allowed'] is False
          assert [freeze['provider_calls_allowed'], freeze['gpu_calls_allowed'], freeze['generation_calls_allowed']] == [0, 0, 0]
          assert state['production_frozen'] is True
          assert state['paid_execution_enabled'] is False
          assert state['active_paid_region'] is None

          receiver = validate_receiver_contract(state_data=state, freeze_data=freeze)
          assert receiver['status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'

          resolved = resolve_state(require_frozen=True)
          next_region = state['next_fresh_region_after_v2_validation']
          assert next_region == checkpoint['next_fresh_region_after_qualification']
          assert next_region not in resolved['closed_region_sheets']
          assert trigger['expected_next_region'] == next_region

          plan = plan_region(next_region)
          assert plan['accepted_source_count'] + plan['selected_generation_count'] == 8
          assert 1 <= plan['selected_generation_count'] <= 8
          assert not set(plan['accepted_ids_excluded']).intersection(plan['selected_generation_ids'])

          try:
              plan_region('silkspire')
          except RuntimeError:
              silkspire_closed_refusal = True
          else:
              raise RuntimeError('closed Silkspire region was still plannable')

          result = {
              'status': 'PASS_ZERO_GPU_NEXT_REGION_TRANSITION',
              'next_region': next_region,
              'accepted_source_count': plan['accepted_source_count'],
              'selected_generation_count': plan['selected_generation_count'],
              'selected_generation_ids': plan['selected_generation_ids'],
              'silkspire_closed_refusal': silkspire_closed_refusal,
              'receiver_contract_status': receiver['status'],
              'provider_calls': 0,
              'gpu_calls': 0,
              'generation_calls': 0,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Compile active V2 modules
        run: |
          python -m compileall -q \
            modal_worker/world_asset_pipeline_v2_controller.py \
            modal_worker/world_asset_pipeline_v2_planner.py \
            modal_worker/world_asset_pipeline_v2_runner.py \
            modal_worker/world_asset_pipeline_v2_acceptance.py \
            modal_worker/world_asset_pipeline_v2_normalizer.py \
            modal_worker/world_asset_pipeline_v2_compiler.py \
            modal_worker/world_asset_pipeline_v2_a5_import_bridge.py

      - name: Prove one-source next-region canary would authorize in shadow mode
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee v2-shadow-next-region.json
          import json
          from copy import deepcopy
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import build_rows, validate_paid_gate

          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          freeze = json.loads(Path('modal_worker/world_asset_pipeline_v2_freeze.json').read_text())
          region = state['next_fresh_region_after_v2_validation']
          all_rows, plan = build_rows(region)
          if not all_rows:
              raise RuntimeError(f'{region}: no generation-eligible rows for canary')
          canary_id = all_rows[0]['asset_id']
          rows, canary_plan = build_rows(region, [canary_id])
          assert len(rows) == 1

          shadow_state = deepcopy(state)
          shadow_state.update({
              'production_frozen': False,
              'paid_execution_enabled': True,
              'active_paid_region': region,
              'catalog_wide_launch_authorized': False,
          })
          shadow_freeze = deepcopy(freeze)
          shadow_freeze.update({
              'production_frozen': False,
              'paid_remote_execution_allowed': True,
              'provider_calls_allowed': 1,
              'gpu_calls_allowed': 1,
              'generation_calls_allowed': 1,
              'catalog_wide_launch_authorized': False,
          })
          gate = validate_paid_gate(region, requested_count=1, state_data=shadow_state, freeze_data=shadow_freeze)
          assert gate['status'] == 'PASS_PAID_GATE'
          assert gate['authorized_call_cap'] == 1
          result = {
              'status': 'PASS_ZERO_SPEND_NEXT_REGION_CANARY_SHADOW',
              'region': region,
              'canary_asset_id': canary_id,
              'accepted_source_count': canary_plan['accepted_source_count'],
              'selected_generation_count': 1,
              'paid_gate_would_open': True,
              'real_production_remained_frozen': True,
              'provider_calls': 0,
              'gpu_calls': 0,
              'generation_calls': 0,
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Validate runner declaration and frozen paid-gate refusal
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee v2-runner-validation.json
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import paid_gate_open
          from modal_worker.world_asset_pipeline_v2_runner import declaration_validation
          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          region = state['next_fresh_region_after_v2_validation']
          r = declaration_validation()
          assert r['status'] == 'PASS_ZERO_GPU_SINGLE_RUNNER_DECLARATION'
          assert r['gpu_candidates'] == ['L4', 'A10G']
          assert r['normalizer_policy'] == 'WORLD_ASSET_PIPELINE_V2'
          assert r['failure_isolated_to_asset_id'] is True
          assert r['exact_requested_count_gate_required'] is True
          try:
              paid_gate_open(region, requested_count=1)
          except RuntimeError:
              refusal = 'PASS'
          else:
              raise RuntimeError('frozen paid gate did not refuse')
          print(json.dumps({**r, 'paid_gate_refusal_while_frozen': refusal}, indent=2, sort_keys=True))
          PY

      - name: Validate deterministic contracts
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_acceptance.py --self-test > v2-acceptance.json
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_normalizer.py > v2-normalizer.json
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_a5_import_bridge.py --self-test > v2-import-bridge.json
          PYTHONPATH=. python - <<'PY' | tee v2-compiler-next-region.json
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_compiler import self_test
          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          r = self_test(state['next_fresh_region_after_v2_validation'])
          assert r['status'] == 'PASS_ZERO_GPU_V2_COMPILER_CONTRACT'
          assert r['sheet_size'] == [384, 768]
          assert r['slot_count'] == 128
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Write bankable preflight summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          transition = json.loads(Path('v2-transition.json').read_text())
          shadow = json.loads(Path('v2-shadow-next-region.json').read_text())
          summary = {
              'schema': 'plushbound.world_asset_pipeline_v2_preflight_report.v2',
              'status': 'PASS_ZERO_GPU_NEXT_REGION_READY',
              'next_region': transition['next_region'],
              'canary_asset_id': shadow['canary_asset_id'],
              'silkspire_closed_refusal': transition['silkspire_closed_refusal'],
              'production_frozen': True,
              'one_source_canary_shadow_authorized': True,
              'provider_calls': 0,
              'gpu_calls': 0,
              'generation_calls': 0,
              'catalog_wide_launch_authorized': False,
              'runtime_import_proof': True,
          }
          Path('world-asset-v2-preflight-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload V2 zero-GPU evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-asset-pipeline-v2-preflight-${{ github.run_id }}
          path: |
            v2-transition.json
            v2-shadow-next-region.json
            v2-runner-validation.json
            v2-acceptance.json
            v2-normalizer.json
            v2-import-bridge.json
            v2-compiler-next-region.json
            world-asset-v2-preflight-summary.json
          if-no-files-found: error
          retention-days: 14
