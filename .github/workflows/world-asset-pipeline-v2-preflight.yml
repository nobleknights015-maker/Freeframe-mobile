name: Plushbound World Asset Pipeline V2 Zero-GPU Preflight

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_asset_pipeline_v2_preflight_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-asset-pipeline-v2-preflight
  cancel-in-progress: false

jobs:
  v2-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zero-spend validation dependencies
        run: |
          python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'

      - name: Validate V2 trigger, hard freeze and receiver proof
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import validate_receiver_contract
          t = json.loads(Path('modal_worker/world_asset_pipeline_v2_preflight_trigger.json').read_text())
          f = json.loads(Path('modal_worker/world_asset_pipeline_v2_freeze.json').read_text())
          s = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())
          assert t['schema'] == 'plushbound.world_asset_pipeline_v2_preflight_trigger.v1'
          assert t['enabled'] is True
          assert t['provider_calls_allowed'] == 0
          assert t['gpu_calls_allowed'] == 0
          assert t['generation_calls_allowed'] == 0
          assert t['catalog_wide_launch_authorized'] is False
          assert t['validate_a5_import_bridge_roundtrip'] is True
          assert t['validate_receiver_runtime_contract'] is True
          assert f['production_frozen'] is True
          assert f['paid_remote_execution_allowed'] is False
          assert [f['provider_calls_allowed'], f['gpu_calls_allowed'], f['generation_calls_allowed']] == [0, 0, 0]
          assert f['runtime_import_proof'] is True
          assert s['production_frozen'] is True
          assert s['paid_execution_enabled'] is False
          assert s['active_paid_region'] is None
          assert s['runtime_import_proof'] is True
          receiver = validate_receiver_contract(state_data=s, freeze_data=f)
          assert receiver['status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'
          assert Path('.github/workflows/world-asset-pipeline-v2-executor.yml').is_file()
          print('WORLD_ASSET_V2_FREEZE_AND_RECEIVER=PASS')
          PY

      - name: Compile V2 and deterministic modules
        run: |
          python -m compileall -q \
            modal_worker/world_asset_pipeline_v2_controller.py \
            modal_worker/world_asset_pipeline_v2_planner.py \
            modal_worker/world_asset_pipeline_v2_runner.py \
            modal_worker/world_asset_pipeline_v2_acceptance.py \
            modal_worker/world_asset_pipeline_v2_normalizer.py \
            modal_worker/world_asset_pipeline_v2_compiler.py \
            modal_worker/world_asset_pipeline_v2_shadow_activation.py \
            modal_worker/world_asset_pipeline_v2_a5_import_bridge.py \
            modal_worker/tileset_source_normalizer.py \
            modal_worker/tileset_regional_a5_compiler.py \
            modal_worker/engine_v1_a5_compatibility_validator.py

      - name: Run V2 controller self-test
        run: |
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_controller.py --self-test | tee v2-self-test.json

      - name: Resolve authoritative V2 state
        run: |
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_controller.py --resolve | tee v2-resolved-state.json

      - name: Prove Gloamfen is protected and Silkspire is cleanly selectable
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_controller.py --plan-region gloamfen | tee v2-plan-gloamfen.json
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_controller.py --plan-region silkspire | tee v2-plan-silkspire.json
          python - <<'PY'
          import json
          from pathlib import Path
          g = json.loads(Path('v2-plan-gloamfen.json').read_text())
          s = json.loads(Path('v2-plan-silkspire.json').read_text())
          assert g['accepted_source_count'] == 8
          assert g['selected_generation_count'] == 0
          assert g['compile_eligible'] is True
          assert len(g['accepted_ids_excluded']) == 8
          assert s['accepted_source_count'] == 0
          assert s['selected_generation_count'] == 8
          assert s['compile_eligible'] is False
          assert len(s['selected_generation_ids']) == 8
          assert [g['provider_calls'], g['gpu_calls'], g['generation_calls']] == [0, 0, 0]
          assert [s['provider_calls'], s['gpu_calls'], s['generation_calls']] == [0, 0, 0]
          print('WORLD_ASSET_V2_PLANNING=PASS')
          PY

      - name: Validate shared planner, receiver and runner declaration
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee v2-shared-worker-validation.json
          import json
          from modal_worker.world_asset_pipeline_v2_planner import validate_rebuild_contract, paid_gate_open, validate_receiver_contract
          from modal_worker.world_asset_pipeline_v2_runner import declaration_validation
          p = validate_rebuild_contract()
          receiver = validate_receiver_contract()
          r = declaration_validation()
          assert p['status'] == 'PASS_ZERO_GPU_SHARED_GENERATOR_PLANNER'
          assert p['runtime_import_proof'] is True
          assert p['receiver_contract_status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'
          assert receiver['status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'
          assert r['status'] == 'PASS_ZERO_GPU_SINGLE_RUNNER_DECLARATION'
          assert r['gpu_candidates'] == ['L4', 'A10G']
          assert r['normalizer_policy'] == 'WORLD_ASSET_PIPELINE_V2'
          assert r['failure_isolated_to_asset_id'] is True
          assert r['batch_art_rejection_does_not_abort_sibling_assets'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          try:
              paid_gate_open('silkspire')
          except RuntimeError:
              paid_gate_refusal = 'PASS'
          else:
              raise RuntimeError('frozen V2 paid gate did not refuse execution')
          result = {**r, 'paid_gate_refusal_while_frozen': paid_gate_refusal, 'runtime_import_proof': True, 'receiver_contract_status': receiver['status']}
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Prove exact Silkspire live canary would authorize in shadow mode
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_shadow_activation.py | tee v2-shadow-activation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('v2-shadow-activation.json').read_text())
          assert r['status'] == 'PASS_ZERO_SPEND_SHADOW_LIVE_CANARY_AUTHORIZATION'
          assert r['region'] == 'silkspire'
          assert r['requested_source_ids'] == ['tileset.silkspire.a5.source.city_stone_paving']
          assert r['selected_generation_count'] == 1
          assert r['paid_gate_would_open'] is True
          assert r['real_production_remained_frozen'] is True
          assert r['runtime_import_proof'] is True
          assert r['receiver_contract_status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          print('WORLD_ASSET_V2_SHADOW_ACTIVATION=PASS')
          PY

      - name: Validate unified per-asset acceptance and exact-eight rollup contract
        run: |
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_acceptance.py --self-test | tee v2-acceptance-self-test.json

      - name: Run unified V2 normalizer self-test
        run: |
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_normalizer.py | tee v2-normalizer-self-test.json

      - name: Rehearse V2 compiler contracts for every unfinished region
        shell: bash
        run: |
          set -euo pipefail
          : > v2-compiler-self-tests.jsonl
          for region in crownweave silkspire gloamfen verdancia tideglass-coast moonpatch-steppe sunspool-desert cinderreach frostlace; do
            PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_compiler.py --region "$region" --self-test >> v2-compiler-self-tests.jsonl
          done
          python - <<'PY'
          import json
          from pathlib import Path
          text = Path('v2-compiler-self-tests.jsonl').read_text()
          decoder = json.JSONDecoder(); idx = 0; rows = []
          while idx < len(text):
              while idx < len(text) and text[idx].isspace(): idx += 1
              if idx >= len(text): break
              obj, idx = decoder.raw_decode(text, idx); rows.append(obj)
          assert len(rows) == 9
          assert all(r['status'] == 'PASS_ZERO_GPU_V2_COMPILER_CONTRACT' for r in rows)
          assert all(r['normalizer_policy'] == 'WORLD_ASSET_PIPELINE_V2' for r in rows)
          assert all([r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0] for r in rows)
          assert all(r['sheet_size'] == [384, 768] for r in rows)
          assert all(r['slot_count'] == 128 for r in rows)
          print('WORLD_ASSET_V2_COMPILER_REHEARSAL=PASS_9_OF_9')
          PY

      - name: Prove deterministic A5 import bridge round trip
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/world_asset_pipeline_v2_a5_import_bridge.py --self-test | tee v2-a5-import-bridge-self-test.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('v2-a5-import-bridge-self-test.json').read_text())
          assert r['status'] == 'PASS_ZERO_GPU_A5_IMPORT_BRIDGE_ROUNDTRIP'
          assert r['profile'] == 'mv_tileset_a5'
          assert r['byte_identity_preserved'] is True
          assert r['slot_count'] == 128
          assert r['unique_slot_hashes'] == 128
          # This module proves the producer-side handoff only; the separate
          # receiver contract below carries the live game-runtime proof.
          assert r['live_importer_present_in_repository'] is False
          assert r['runtime_import_proof'] is False
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          print('WORLD_ASSET_V2_A5_IMPORT_BRIDGE=PASS_PRODUCER_HANDOFF')
          PY

      - name: Validate banked game-side Engine v1 receiver contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY' | tee v2-receiver-contract-validation.json
          import json
          from modal_worker.world_asset_pipeline_v2_planner import validate_receiver_contract
          r = validate_receiver_contract()
          assert r['status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'
          assert r['runtime_import_proof'] is True
          assert r['profile'] == 'mv_tileset_a5'
          assert r['sheet_size'] == [384, 768]
          assert r['tile_size'] == [48, 48]
          assert r['grid'] == [8, 16]
          assert r['slot_count'] == 128
          assert r['pipeline_resume_blocker'] is False
          print(json.dumps(r, indent=2, sort_keys=True))
          PY

      - name: Write bankable V2 preflight summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = {
            'schema': 'plushbound.world_asset_pipeline_v2_preflight_report.v1',
            'status': 'PASS_ZERO_GPU_V2_END_TO_END_RECEIVER_RUNTIME_READY',
            'production_frozen': True,
            'legacy_pipeline_mode': 'READ_ONLY_EVIDENCE',
            'accepted_asset_rerender_refusal': True,
            'individual_asset_acceptance_supported': True,
            'unified_asset_acceptance_path': True,
            'regional_rollup_requires_exact_8': True,
            'failure_isolation_by_asset_id': True,
            'one_region_planning': True,
            'one_shared_generation_path': True,
            'shared_worker_paid_gate_refusal_while_frozen': True,
            'shadow_live_canary_authorization_passed': True,
            'shadow_live_canary_asset_id': 'tileset.silkspire.a5.source.city_stone_paving',
            'unified_v2_normalizer_policy': True,
            'v2_compiler_uses_same_normalizer_policy': True,
            'deterministic_compiler_regions_green': 9,
            'a5_import_bridge_roundtrip_passed': True,
            'a5_import_bridge_preserves_bytes_and_128_slots': True,
            'producer_bridge_itself_is_not_live_runtime': True,
            'game_side_receiver_runtime_contract_passed': True,
            'live_runtime_importer_present_in_receiver_repository': True,
            'provider_calls': 0,
            'gpu_calls': 0,
            'generation_calls': 0,
            'catalog_wide_launch_authorized': False,
            'runtime_import_proof': True,
            'production_executor_installed': Path('.github/workflows/world-asset-pipeline-v2-executor.yml').is_file(),
            'production_executor_paid_job_must_remain_skipped_while_frozen': True,
          }
          Path('world-asset-v2-preflight-summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True))
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Upload V2 zero-GPU evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-asset-pipeline-v2-preflight-${{ github.run_id }}
          path: |
            v2-self-test.json
            v2-resolved-state.json
            v2-plan-gloamfen.json
            v2-plan-silkspire.json
            v2-shared-worker-validation.json
            v2-shadow-activation.json
            v2-acceptance-self-test.json
            v2-normalizer-self-test.json
            v2-compiler-self-tests.jsonl
            v2-a5-import-bridge-self-test.json
            v2-receiver-contract-validation.json
            world-asset-v2-preflight-summary.json
          if-no-files-found: error
          retention-days: 14
