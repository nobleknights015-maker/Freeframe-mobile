name: Retired Plushbound Regional A5 Preflight Guard

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_compiler.py'
      - 'modal_worker/a5_tilesheet_compiler.py'
      - 'approved_art/**'
      - '.github/workflows/tileset-regional-a5-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert-production-route-retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert 384-master derivation path cannot authorize production
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          legacy = Path('modal_worker/tileset_regional_a5_compiler.py').read_text(encoding='utf-8')
          assert 'LEGACY_TEST_ONLY = True' in legacy
          assert 'PRODUCTION_AUTHORIZED = False' in legacy
          assert 'test_fixture_only' in legacy
          print('REGIONAL_A5_384_MASTER_PRODUCTION_PREFLIGHT=RETIRED')
          print('BOUNDED_PRODUCTION_TRIGGER_AUTHORIZED=false')
          PY

      - name: Assert strict approved-art compiler is the authorized handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          strict = Path('modal_worker/a5_tilesheet_compiler.py').read_text(encoding='utf-8')
          for marker in (
              'WORLD_TILE_ASSET_V1',
              'vera-chatgpt-approved',
              'VERA_APPROVED_SOURCE_V1',
              'compile_world_tile_sheet',
              'target_size is forbidden',
          ):
              assert marker in strict, marker
          print('WORLD_TILE_ASSET_V1_APPROVED_HANDOFF=PASS')
          PY
