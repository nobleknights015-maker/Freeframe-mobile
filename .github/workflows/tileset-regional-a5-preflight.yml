name: Plushbound Regional A5 No-Spend Preflights

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_scope_manifest.json'
      - 'modal_worker/tileset_regional_a5_compiler.py'
      - 'modal_worker/tileset_region_sheet_occupancy_manifest.json'
      - 'modal_worker/engine_v1_a5_compatibility_validator.py'
      - 'modal_worker/plushbound_final_asset_lane_audit_2026-10-28.json'
      - 'modal_worker/tileset_elyndor_a5_engine_v1_compatibility.json'
      - 'modal_worker/production_request_builder.py'
      - 'modal_worker/production_inspector.py'
      - 'modal_worker/tileset_source_normalizer.py'
      - '.github/preflight/tileset_regional_a5_preflight.py'
      - '.github/workflows/tileset-regional-a5-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-a5-preflight:
    name: A5 preflight / ${{ matrix.region }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        region:
          - crownweave
          - silkspire
          - gloamfen
          - verdancia
          - tideglass-coast
          - moonpatch-steppe
          - sunspool-desert
          - cinderreach
          - frostlace
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependencies only
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'
      - name: Run zero-spend regional A5 preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p regional-a5-preflight
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_preflight.py --region "${{ matrix.region }}" > "regional-a5-preflight/${{ matrix.region }}.json"
          cat "regional-a5-preflight/${{ matrix.region }}.json"
      - name: Assert bounded green result
        shell: bash
        env:
          REGION: ${{ matrix.region }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          r = json.loads(Path(f'regional-a5-preflight/{region}.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REGION_A5_READY_FOR_EXPLICIT_BOUNDED_TRIGGER'
          assert r['region'] == region and r['sheet_type'] == 'A5'
          assert r['stable_sheet_id'] == f'tileset.{region}.a5'
          assert r['production_skipped'] is True and r['paid_remote_execution_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['source_count'] == 8 and r['source_master_size'] == [384, 384]
          assert r['sheet_geometry'] == [384, 768] and r['tile_geometry'] == [48, 48]
          assert r['grid'] == [8, 16] and r['slot_count'] == 128
          assert r['preflight_authorizes_one_explicit_bounded_region_trigger'] is True
          assert r['automatic_paid_execution_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert r['accepted_assets_immutable'] is True and r['runtime_import_proof'] is False
          assert len(r['request_routes']) == 8
          assert all(v == 'PASS' for v in r['checks'].values())
          print(f'REGIONAL_A5_PREFLIGHT={region}=PASS_NO_SPEND')
          print('GENERATION_CALLS=0')
          PY
      - name: Upload independent regional preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-preflight-${{ matrix.region }}-${{ github.run_id }}
          path: regional-a5-preflight/${{ matrix.region }}.json
          if-no-files-found: error
          retention-days: 14
