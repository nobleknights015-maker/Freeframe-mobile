name: Retired Plushbound Regional A5 Finalize Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired-production-route:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Assert legacy derivation compiler is production-disabled
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('modal_worker/tileset_regional_a5_compiler.py').read_text(encoding='utf-8')
          assert 'LEGACY_TEST_ONLY = True' in text
          assert 'PRODUCTION_AUTHORIZED = False' in text
          assert 'test_fixture_only' in text
          print('LEGACY_REGIONAL_A5_PRODUCTION_FINALIZE=RETIRED')
          print('AUTHORIZED_RUNTIME_COMPILER=modal_worker/a5_tilesheet_compiler.py')
          PY

      - name: Assert immutable WORLD_TILE_ASSET_V1 compiler exists
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('modal_worker/a5_tilesheet_compiler.py').read_text(encoding='utf-8')
          required = [
              'plushbound.world_tile_sheet.v1',
              'WORLD_TILE_ASSET_V1',
              'VERA_APPROVED_SOURCE_V1',
              'target_size is forbidden',
              'covered_by',
              'compile_world_tile_sheet',
          ]
          for marker in required:
              assert marker in text, marker
          print('WORLD_TILE_ASSET_V1_PRODUCTION_COMPILER=AVAILABLE')
          PY
