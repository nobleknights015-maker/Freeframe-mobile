name: FreeFrame Klein L4 Benchmark

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Representative benchmark case
        required: true
        default: penney_modeling_stress
        type: choice
        options:
          - penney_modeling_stress
          - guardian_meadow
          - character_adventurer
          - enemy_forest
          - environment_elyndor
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/benchmark_plan.py'
      - 'modal_worker/klein_l4_benchmark.py'
      - 'modal_worker/test_klein_l4_benchmark.py'
      - 'modal_worker/model_catalog.py'
      - '.github/workflows/run-klein-l4-benchmark.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-klein-l4-benchmark
  cancel-in-progress: false

jobs:
  bounded-klein-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      CASE_ID: ${{ github.event.inputs.case_id || 'penney_modeling_stress' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile benchmark surface
        run: python -m compileall -q modal_worker
      - name: Run exactly one L4 benchmark case
        shell: bash
        run: |
          set -o pipefail
          modal run modal_worker/klein_l4_benchmark.py --case-id "$CASE_ID" | tee klein-l4-benchmark.log
      - name: Upload benchmark product and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klein-l4-benchmark-${{ github.run_id }}
          path: |
            klein-l4-benchmark.log
            klein-l4-output.png
          if-no-files-found: warn
          retention-days: 7
