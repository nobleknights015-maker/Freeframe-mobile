name: Plushbound Specialized NPC MV Max Round

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/mv_sheet_max_trigger.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: plushbound-specialized-npc-mv-max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      round_number: ${{ steps.trigger.outputs.round_number }}
      source_run_id: ${{ steps.trigger.outputs.source_run_id }}
      source_artifacts: ${{ steps.trigger.outputs.source_artifacts }}
      lane_specs: ${{ steps.trigger.outputs.lane_specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - name: Read specialized trigger
        id: trigger
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('modal_worker/mv_sheet_max_trigger.json','r',encoding='utf-8'))
          if not data.get('enabled', False):
              raise SystemExit('specialized NPC MV max trigger is disabled')
          if not data.get('authorized_by_user', False):
              raise SystemExit('specialized production is not authorized')
          round_number=int(data['round'])
          source_run_id=int(data['source_run_id'])
          artifacts=list(data.get('source_artifacts') or [])
          sublanes=int(data.get('sublanes_per_artifact',3))
          if round_number < 1 or source_run_id < 1:
              raise SystemExit('round and source_run_id must be positive')
          if not (1 <= len(artifacts) <= 4) or len(set(artifacts)) != len(artifacts):
              raise SystemExit('1..4 unique source artifacts are required for this max contract')
          if sublanes != 3:
              raise SystemExit('validated specialized max contract requires three sublanes per artifact')
          lanes=data.get('lane_specs')
          if lanes is None:
              lanes=[{'artifact': a, 'sublane': s, 'sublanes': sublanes} for a in artifacts for s in range(sublanes)]
          if not isinstance(lanes,list) or not lanes or len(lanes)>12:
              raise SystemExit('lane_specs must contain 1..12 lanes')
          seen=set()
          normalized=[]
          for raw in lanes:
              artifact=str(raw['artifact'])
              lane=int(raw['sublane'])
              lane_count=int(raw.get('sublanes',sublanes))
              key=(artifact,lane,lane_count)
              if artifact not in artifacts:
                  raise SystemExit(f'lane artifact is outside source_artifacts: {artifact}')
              if lane_count != sublanes or lane < 0 or lane >= sublanes:
                  raise SystemExit(f'invalid lane spec: {key}')
              if key in seen:
                  raise SystemExit(f'duplicate lane spec: {key}')
              seen.add(key)
              normalized.append({'artifact':artifact,'sublane':lane,'sublanes':lane_count})
          print(f'round_number={round_number}')
          print(f'source_run_id={source_run_id}')
          print('source_artifacts='+json.dumps(artifacts,separators=(',',':')))
          print('lane_specs='+json.dumps(normalized,separators=(',',':')))
          PY

  produce:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ROUND_NUMBER: ${{ needs.prepare.outputs.round_number }}
      SOURCE_RUN_ID: ${{ needs.prepare.outputs.source_run_id }}
      SOURCE_ARTIFACTS_JSON: ${{ needs.prepare.outputs.source_artifacts }}
      LANE_SPECS_JSON: ${{ needs.prepare.outputs.lane_specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - name: Download accepted master artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path('master-input')
          root.mkdir(parents=True, exist_ok=True)
          for artifact in json.loads(os.environ['SOURCE_ARTIFACTS_JSON']):
              dest=root/artifact
              dest.mkdir(parents=True, exist_ok=True)
              subprocess.run([
                  'gh','run','download',os.environ['SOURCE_RUN_ID'],
                  '--repo','nobleknights015-maker/Freeframe-mobile',
                  '-n',artifact,'-D',str(dest)
              ],check=True)
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Compile specialized production surface
        run: python -m compileall -q modal_worker
      - name: Run unified identity-preserving NPC MV Max dispatch
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=modal_worker modal run modal_worker/mv_sheet_max_production.py \
            --master-root master-input \
            --lane-specs-json "$LANE_SPECS_JSON" \
            --round-number "$ROUND_NUMBER" \
            --max-parallel 10 | tee specialized-npc-mv-unified.log
      - name: Require specialized batch report and PNG output
        shell: bash
        run: |
          test -n "$(find specialized-output -name batch-report.json -type f -print -quit)" || { echo 'missing specialized batch report' >&2; exit 1; }
          test -n "$(find specialized-output -name '*.png' -type f -print -quit)" || { echo 'missing specialized PNG output' >&2; exit 1; }
      - name: Upload specialized batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialized-npc-mv-round-${{ env.ROUND_NUMBER }}-unified-${{ github.run_id }}
          path: |
            specialized-npc-mv-unified.log
            specialized-output/
          if-no-files-found: warn
          retention-days: 30
