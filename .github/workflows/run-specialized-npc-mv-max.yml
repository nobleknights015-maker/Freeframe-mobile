name: Plushbound Specialized NPC MV Max Round

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/mv_sheet_max_trigger.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: plushbound-specialized-npc-mv-max
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      round_number: ${{ steps.trigger.outputs.round_number }}
      source_run_id: ${{ steps.trigger.outputs.source_run_id }}
      jobs: ${{ steps.trigger.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - name: Read specialized trigger
        id: trigger
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('modal_worker/mv_sheet_max_trigger.json','r',encoding='utf-8'))
          if not data.get('enabled', False):
              raise SystemExit('specialized NPC MV max trigger is disabled')
          if not data.get('authorized_by_user', False):
              raise SystemExit('specialized production is not authorized')
          round_number=int(data['round'])
          source_run_id=int(data['source_run_id'])
          artifacts=list(data.get('source_artifacts') or [])
          sublanes=int(data.get('sublanes_per_artifact',3))
          if round_number < 1 or source_run_id < 1:
              raise SystemExit('round and source_run_id must be positive')
          if len(artifacts) != 4 or len(set(artifacts)) != 4:
              raise SystemExit('exactly four unique source artifacts are required for this max contract')
          if sublanes != 3:
              raise SystemExit('validated specialized max contract requires three sublanes per artifact')
          jobs=[]
          for artifact in artifacts:
              for sublane in range(sublanes):
                  jobs.append({'artifact': artifact, 'sublane': sublane, 'sublanes': sublanes})
          print(f'round_number={round_number}')
          print(f'source_run_id={source_run_id}')
          print('jobs='+json.dumps(jobs,separators=(',',':')))
          PY

  produce:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ROUND_NUMBER: ${{ needs.prepare.outputs.round_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - name: Download accepted master artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: master-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.prepare.outputs.source_run_id }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install production dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Compile specialized production surface
        run: python -m compileall -q modal_worker
      - name: Run identity-preserving NPC MV max stream
        shell: bash
        run: |
          set -euo pipefail
          SAFE_ARTIFACT="$(printf '%s' '${{ matrix.artifact }}' | tr -cs 'A-Za-z0-9._-' '_')"
          LOG="specialized-npc-mv-${SAFE_ARTIFACT}-sublane-${{ matrix.sublane }}.log"
          python -m modal_worker.mv_sheet_max_production \
            --master-dir master-input \
            --round-number "$ROUND_NUMBER" \
            --source-artifact '${{ matrix.artifact }}' \
            --sublane '${{ matrix.sublane }}' \
            --sublanes '${{ matrix.sublanes }}' | tee "$LOG"
      - name: Upload specialized stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specialized-npc-mv-round-${{ env.ROUND_NUMBER }}-${{ strategy.job-index }}-${{ github.run_id }}
          path: |
            specialized-npc-mv-*.log
            specialized-output/
          if-no-files-found: warn
          retention-days: 30
