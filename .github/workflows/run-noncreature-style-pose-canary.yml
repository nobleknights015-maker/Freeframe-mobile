name: FreeFrame Noncreature Style Pose Canary

on:
  workflow_dispatch:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/noncreature_style_pose_canary.py'
      - 'modal_worker/plushbound_style_anchors.py'
      - 'modal_worker/project_references/elyndor_noncreature_style_anchor.jpg'
      - '.github/workflows/run-noncreature-style-pose-canary.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-noncreature-style-pose-canary
  cancel-in-progress: false

jobs:
  confirm-style-pose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install Modal CLI and Pillow
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Verify style anchor ownership and hash
        run: |
          PYTHONPATH=. python - <<'PY'
          from modal_worker.plushbound_style_anchors import get_style_anchor
          anchor=get_style_anchor()
          assert anchor.ownership == 'project_owned'
          assert anchor.sha256 == '91544df958737c23040eac4bb46296355176f62c88a8bb1cec7d4917f55ec340'
          assert len(anchor.load_bytes()) > 10000
          print(anchor.metadata())
          PY
      - name: Compile confirmation canary
        run: python -m compileall -q modal_worker
      - name: Run three-case separated style and pose canary in one L4 app
        run: modal run modal_worker/noncreature_style_pose_canary.py
      - name: Require outputs
        shell: bash
        run: |
          test -s noncreature-style-pose-canary/friendly_quadruped_style_pose.png
          test -s noncreature-style-pose-canary/boss_hexapod_style_pose.png
          test -s noncreature-style-pose-canary/enemy_hexapod_style_pose.png
          test -s noncreature-style-pose-canary/report.json
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: noncreature-style-pose-canary-${{ github.run_id }}
          path: noncreature-style-pose-canary/
          if-no-files-found: error
          retention-days: 7
