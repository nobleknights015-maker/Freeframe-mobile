name: Plushbound Canon Portrait Canary

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/canon_portrait_trigger.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plushbound-canon-portrait-canary
  cancel-in-progress: false

jobs:
  chris-portrait-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install bounded canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile canary
        run: python -m compileall -q modal_worker/canon_portrait_canary.py
      - name: Preflight proven Modal-compatible Chris reference
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, io, json
          from pathlib import Path
          from PIL import Image

          ref = Path('modal_worker/canon_refs/chris_identity_compact.jpg')
          provenance_path = Path('modal_worker/canon_refs/chris_identity_provenance.json')
          assert ref.is_file() and ref.stat().st_size > 0, ref
          assert provenance_path.is_file(), provenance_path
          p = json.loads(provenance_path.read_text(encoding='utf-8'))
          assert p['schema'] == 'plushbound.canon_identity_reference.v1'
          assert p['character_id'] == 'chris_bourn'
          assert p['status'] == 'CANONICAL_CONDITIONING_REFERENCE'
          assert p['catalog_wide_launch_authorized'] is False
          expected = p['reference_payload']
          raw = ref.read_bytes()
          assert len(raw) == expected['bytes'] == 7091, (len(raw), expected['bytes'])
          assert hashlib.sha256(raw).hexdigest() == expected['sha256'] == '362e5050b74f07094f36d27825cdae9dd19b3c18768ff20fd7097e3bd616b165'
          git_blob = hashlib.sha1(f'blob {len(raw)}\0'.encode('ascii') + raw).hexdigest()
          assert git_blob == expected['git_blob_sha'] == '2700e044f35c063cb91d50e830c93bf2fe469f73'
          with Image.open(io.BytesIO(raw)) as im:
              im.load()
              assert im.size == (96, 211), im.size
              assert im.format == 'JPEG', im.format
          print('reference_ok', len(raw), expected['sha256'], git_blob)
          PY
      - name: Run one bounded Chris portrait identity canary
        run: python -m modal_worker.canon_portrait_canary
      - name: Require portrait evidence
        shell: bash
        run: |
          test -s canon-portrait-canary/chris_bourn_portrait_raw.png
          test -s canon-portrait-canary/chris_bourn_portrait.png
          test -s canon-portrait-canary/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path('canon-portrait-canary/report.json').read_text())
          assert report['version'] == 'plushbound-canon-portrait-canary-v6'
          assert report['status'] == 'generated_pending_visual_review'
          assert report['catalog_wide_launch_authorized'] is False
          assert report['quality_gate']['geometry_pass'] is True
          assert report['quality_gate']['rgba_pass'] is True
          assert report['quality_gate']['alpha_present'] is True
          assert report['reference']['sha256'] == '362e5050b74f07094f36d27825cdae9dd19b3c18768ff20fd7097e3bd616b165'
          assert report['reference']['git_blob_sha'] == '2700e044f35c063cb91d50e830c93bf2fe469f73'
          assert report['reference_store']['reference_id'] == report['reference']['sha256']
          assert report['request']['steps'] == 8
          assert report['request']['guidance_scale'] == 1.0
          with Image.open('canon-portrait-canary/chris_bourn_portrait.png') as im:
              assert im.size == (288, 384)
              assert im.mode == 'RGBA'
          PY
      - name: Upload portrait canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-portrait-canary-${{ github.run_id }}
          path: canon-portrait-canary/
          if-no-files-found: warn
          retention-days: 14
