name: Plushbound Canon Portrait Canary

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/canon_portrait_trigger.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plushbound-canon-portrait-canary
  cancel-in-progress: false

jobs:
  chris-portrait-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install bounded canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile canary
        run: python -m compileall -q modal_worker/canon_portrait_canary.py
      - name: Preflight verified Chris conditioning reference before Modal
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, io, json
          from pathlib import Path
          from PIL import Image

          b64_path = Path('modal_worker/canon_refs/chris_identity_hifi_q98.b64')
          provenance_path = Path('modal_worker/canon_refs/chris_identity_hifi_q98_provenance.json')
          p = json.loads(provenance_path.read_text())
          assert p['schema'] == 'plushbound.canon_identity_reference.v2'
          assert p['character_id'] == 'chris_bourn'
          assert p['source']['sha256'] == '34a886f42a476d09649c6584731d043cd658d18395692090109ece0f3bd09104'
          assert p['derivation']['crop_box'] == [156, 80, 356, 520]
          assert p['derivation']['resize'] is False
          encoded = ''.join(b64_path.read_text(encoding='ascii').split())
          raw = base64.b64decode(encoded, validate=True)
          expected = p['reference_payload']
          assert len(raw) == expected['decoded_bytes'], (len(raw), expected['decoded_bytes'])
          assert hashlib.sha256(raw).hexdigest() == expected['sha256']
          with Image.open(io.BytesIO(raw)) as im:
              im.load()
              assert im.size == (200, 440), im.size
              assert im.mode == 'RGB', im.mode
              assert im.format == 'JPEG', im.format
          print('reference_ok', len(raw), expected['sha256'])
          PY
      - name: Run one bounded Chris portrait identity canary
        run: python -m modal_worker.canon_portrait_canary
      - name: Require portrait evidence
        shell: bash
        run: |
          test -s canon-portrait-canary/chris_bourn_portrait_raw.png
          test -s canon-portrait-canary/chris_bourn_portrait.png
          test -s canon-portrait-canary/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          report = json.loads(Path('canon-portrait-canary/report.json').read_text())
          assert report['version'] == 'plushbound-canon-portrait-canary-v3'
          assert report['status'] == 'generated_pending_visual_review'
          assert report['catalog_wide_launch_authorized'] is False
          assert report['quality_gate']['geometry_pass'] is True
          assert report['quality_gate']['rgba_pass'] is True
          assert report['quality_gate']['alpha_present'] is True
          assert report['reference']['sha256'] == 'b13e309de44ab0e6c3d56f31cecb461b2a5dc3a0246516f196d6e3075007a269'
          assert report['request']['steps'] == 8
          assert report['request']['guidance_scale'] == 1.0
          with Image.open('canon-portrait-canary/chris_bourn_portrait.png') as im:
              assert im.size == (288, 384)
              assert im.mode == 'RGBA'
          PY
      - name: Upload portrait canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canon-portrait-canary-${{ github.run_id }}
          path: canon-portrait-canary/
          if-no-files-found: warn
          retention-days: 14
