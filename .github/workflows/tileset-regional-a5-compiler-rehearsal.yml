name: Plushbound Regional A5 Deterministic Compiler Rehearsal

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_compiler.py'
      - 'modal_worker/tileset_source_normalizer.py'
      - 'modal_worker/engine_v1_a5_compatibility_validator.py'
      - 'modal_worker/asset_profiles.py'
      - 'modal_worker/tileset_regional_a5_scope_manifest.json'
      - '.github/workflows/tileset-regional-a5-compiler-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-zero-gpu-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
      REGION: crownweave
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependency only
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'
      - name: Build synthetic wrap-friendly eight-source fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          from PIL import Image
          region = os.environ['REGION']
          scope = json.loads(Path('modal_worker/tileset_regional_a5_scope_manifest.json').read_text(encoding='utf-8'))
          materials = scope['regions'][region]['materials']
          root = Path('synthetic-regional-a5') / region / 'raw'
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          for family, material in enumerate(materials):
              im = Image.new('RGBA', (384, 384), (0, 0, 0, 255))
              px = im.load()
              for y in range(384):
                  ay = 2.0 * math.pi * y / 384.0
                  for x in range(384):
                      ax = 2.0 * math.pi * x / 384.0
                      # Fully periodic, smooth, family-distinct material-like fixture.
                      v1 = math.sin(ax + family * 0.17)
                      v2 = math.cos(ay + family * 0.23)
                      v3 = math.sin(ax + ay * 2.0 + family * 0.31)
                      r = int(max(0, min(255, 92 + family * 7 + 28 * v1 + 11 * v3)))
                      g = int(max(0, min(255, 112 + family * 5 + 25 * v2 + 9 * v3)))
                      b = int(max(0, min(255, 72 + family * 6 + 18 * v1 - 15 * v2)))
                      px[x, y] = (r, g, b, 255)
              p = root / f'{material}-384.png'
              im.save(p, format='PNG')
              raw_hash = hashlib.sha256(p.read_bytes()).hexdigest()
              rows.append({'asset_id': f'tileset.{region}.a5.source.{material}', 'raw_sha256': raw_hash})
          closeout = {
              'schema': 'plushbound.tileset_regional_a5_source_closeout.v1',
              'status': 'CLOSED_GREEN_8_OF_8',
              'region': region,
              'target_sheet_type': 'A5',
              'machine_gate': 'PASS_8_OF_8',
              'manual_visual_gate': 'PASS_8_OF_8',
              'accepted_source_ids_protected_from_rerender': True,
              'catalog_wide_launch_authorized': False,
              'sources': rows,
              'test_fixture_only': True
          }
          Path('synthetic-source-closeout.json').write_text(json.dumps(closeout, indent=2, sort_keys=True), encoding='utf-8')
          print('SYNTHETIC_SOURCE_FIXTURE=8')
          PY
      - name: Exercise actual regional A5 compiler path
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/tileset_regional_a5_compiler.py \
            --region "$REGION" \
            --source-root "synthetic-regional-a5/$REGION/raw" \
            --source-closeout synthetic-source-closeout.json \
            --output-dir "synthetic-regional-a5/$REGION/final" \
            | tee synthetic-compile.log
      - name: Run Engine v1 compatibility validator on synthetic compile
        shell: bash
        run: |
          set -euo pipefail
          SHEET="$(python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          r = json.loads((Path('synthetic-regional-a5') / region / 'final' / 'report.json').read_text(encoding='utf-8'))
          print(r['sheet_path'])
          PY
          )"
          PYTHONPATH=. python modal_worker/engine_v1_a5_compatibility_validator.py --sheet "$SHEET" > synthetic-engine-v1.json
          cat synthetic-engine-v1.json
      - name: Assert full zero-spend deterministic path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          comp = json.loads((Path('synthetic-regional-a5') / region / 'final' / 'report.json').read_text(encoding='utf-8'))
          compat = json.loads(Path('synthetic-engine-v1.json').read_text(encoding='utf-8'))
          assert comp['status'] == 'PASS_NO_SPEND_DETERMINISTIC_COMPILE_ENGINE_PROFILE'
          assert [comp['sheet_width'], comp['sheet_height']] == [384, 768]
          assert comp['tile_size'] == 48 and [comp['columns'], comp['rows']] == [8, 16]
          assert comp['slot_count'] == 128 and comp['unique_slot_hashes'] == 128
          assert [comp['provider_calls'], comp['gpu_calls'], comp['generation_calls']] == [0, 0, 0]
          assert comp['runtime_import_proof'] is False and comp['catalog_wide_launch_authorized'] is False
          assert compat['status'] == 'PASS_ENGINE_V1_COMPATIBILITY_CONTRACT'
          assert [compat['sheet_width'], compat['sheet_height']] == [384, 768]
          assert compat['slot_count'] == 128 and compat['unique_slot_hashes'] == 128
          assert compat['runtime_import_proof'] is False
          assert [compat['provider_calls'], compat['gpu_calls'], compat['generation_calls']] == [0, 0, 0]
          print('REGIONAL_A5_SYNTHETIC_COMPILER_REHEARSAL=PASS_ZERO_GPU')
          PY
      - name: Upload rehearsal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-compiler-rehearsal-${{ github.run_id }}
          path: |
            synthetic-compile.log
            synthetic-engine-v1.json
            synthetic-regional-a5/${{ env.REGION }}/final/
          if-no-files-found: warn
          retention-days: 14
