name: Plushbound Regional A5 Legacy Compiler Rehearsal

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_compiler.py'
      - 'modal_worker/tileset_source_normalizer.py'
      - 'modal_worker/engine_v1_a5_compatibility_validator.py'
      - 'modal_worker/asset_profiles.py'
      - 'modal_worker/tileset_regional_a5_scope_manifest.json'
      - '.github/workflows/tileset-regional-a5-compiler-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-legacy-only:
    strategy:
      fail-fast: false
      matrix:
        region:
          - crownweave
          - silkspire
          - gloamfen
          - verdancia
          - tideglass-coast
          - moonpatch-steppe
          - sunspool-desert
          - cinderreach
          - frostlace
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
      REGION: ${{ matrix.region }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependency only
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Build synthetic legacy fixture only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, math, os
          from pathlib import Path
          from PIL import Image
          region = os.environ['REGION']
          scope = json.loads(Path('modal_worker/tileset_regional_a5_scope_manifest.json').read_text(encoding='utf-8'))
          materials = scope['regions'][region]['materials']
          root = Path('synthetic-regional-a5') / region / 'raw'
          root.mkdir(parents=True, exist_ok=True)
          rows = []
          for family, material in enumerate(materials):
              im = Image.new('RGBA', (384, 384), (0, 0, 0, 255))
              px = im.load()
              for y in range(384):
                  ay = 2.0 * math.pi * y / 384.0
                  for x in range(384):
                      ax = 2.0 * math.pi * x / 384.0
                      r = int(max(0, min(255, 100 + family * 5 + 25 * math.sin(ax))))
                      g = int(max(0, min(255, 115 + family * 4 + 22 * math.cos(ay))))
                      b = int(max(0, min(255, 85 + family * 5 + 18 * math.sin(ax + ay))))
                      px[x, y] = (r, g, b, 255)
              p = root / f'{material}-384.png'
              im.save(p, format='PNG')
              rows.append({'asset_id': f'tileset.{region}.a5.source.{material}', 'raw_sha256': hashlib.sha256(p.read_bytes()).hexdigest()})
          closeout = {
              'schema': 'plushbound.tileset_regional_a5_source_closeout.v1',
              'status': 'CLOSED_GREEN_8_OF_8',
              'region': region,
              'target_sheet_type': 'A5',
              'machine_gate': 'PASS_8_OF_8',
              'manual_visual_gate': 'PASS_8_OF_8',
              'sources': rows,
              'test_fixture_only': True
          }
          Path('synthetic-source-closeout.json').write_text(json.dumps(closeout, indent=2, sort_keys=True), encoding='utf-8')
          PY

      - name: Exercise retired compiler with synthetic fixture
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/tileset_regional_a5_compiler.py \
            --region "$REGION" \
            --source-root "synthetic-regional-a5/$REGION/raw" \
            --source-closeout synthetic-source-closeout.json \
            --output-dir "synthetic-regional-a5/$REGION/final"

      - name: Assert test-only status and production denial
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          comp = json.loads((Path('synthetic-regional-a5') / region / 'final' / 'report.json').read_text(encoding='utf-8'))
          assert comp['status'] == 'PASS_LEGACY_TEST_ONLY'
          assert comp['legacy_test_only'] is True
          assert comp['production_authorized'] is False
          assert [comp['sheet_width'], comp['sheet_height']] == [384, 768]
          assert comp['slot_count'] == 128
          assert [comp['provider_calls'], comp['gpu_calls'], comp['generation_calls']] == [0, 0, 0]
          print(f'REGIONAL_A5_LEGACY_REHEARSAL={region}=PASS_TEST_ONLY')
          print('PRODUCTION_AUTHORIZED=false')
          PY
