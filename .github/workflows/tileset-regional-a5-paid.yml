name: Plushbound Regional A5 One-Region Paid Source Run

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_paid_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-regional-a5-paid
  cancel-in-progress: false

jobs:
  bounded-one-region-source-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read and validate one-region trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_regional_a5_paid_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_regional_a5_paid_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'one_region_a5_source_canary'
          assert isinstance(t['region'], str) and t['region'] and t['region'] != 'elyndor'
          assert isinstance(t['preflight_run_id'], int) and t['preflight_run_id'] > 0
          assert t['preflight_conclusion'] == 'success'
          assert t['asset_cap'] == 8
          assert t['generation_attempts_per_asset_cap'] == 1
          assert t['one_region_only'] is True
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['accepted_assets_immutable'] is True
          assert t['creator_full_outfits_remain_closed_at'] == 24
          with Path('trigger-region.txt').open('w', encoding='utf-8') as f:
              f.write(t['region'])
          print(f"TRIGGER_REGION={t['region']}")
          PY
          echo "REGION=$(cat trigger-region.txt)" >> "$GITHUB_ENV"

      - name: Re-run exact regional no-spend preflight at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_preflight.py --region "$REGION" > regional-a5-preflight-current-head.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('regional-a5-preflight-current-head.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REGION_A5_READY_FOR_EXPLICIT_BOUNDED_TRIGGER'
          assert r['region'] == os.environ['REGION']
          assert r['production_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['preflight_authorizes_one_explicit_bounded_region_trigger'] is True
          assert r['automatic_paid_execution_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_REGIONAL_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install bounded producer dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'

      - name: Compile bounded producer
        run: python -m compileall -q modal_worker/tileset_regional_a5_production.py

      - name: Run exactly one bounded eight-source region
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/tileset_regional_a5_production.py --region "$REGION" | tee regional-a5-paid.log

      - name: Verify source report before QA artifact banking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          p = Path('tileset-regional-a5') / region / 'report.json'
          assert p.is_file(), 'missing regional source report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_regional_a5_source_report.v1'
          assert r['region'] == region and r['target_sheet_type'] == 'A5'
          assert r['requested_count'] == 8 and r['generation_count'] == 8
          assert r['generation_retry_count'] == 0
          assert r['accepted_count'] == 8 and r['quarantined_count'] == 0
          assert r['cross_region_generation_count'] == 0
          assert r['final_a5_generation_count'] == 0
          assert r['manual_visual_qa_required'] is True
          assert r['catalog_wide_launch_authorized'] is False
          assert len(r['assets']) == 8
          assert len({a['asset_id'] for a in r['assets']}) == 8
          assert all(a['generation_attempts'] == 1 for a in r['assets'])
          assert all(a['source_width'] == 384 and a['source_height'] == 384 for a in r['assets'])
          print(f'REGIONAL_A5_SOURCE_MACHINE_GATE={region}=PASS_8_OF_8')
          PY

      - name: Upload regional sources and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-source-${{ env.REGION }}-${{ github.run_id }}
          path: |
            regional-a5-preflight-current-head.json
            regional-a5-paid.log
            tileset-regional-a5/${{ env.REGION }}/
          if-no-files-found: warn
          retention-days: 14
