name: Plushbound Regional A5 One-Region Paid Source Run

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_paid_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-regional-a5-paid
  cancel-in-progress: false

jobs:
  bounded-one-region-source-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic preflight dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Read and validate one-region trigger and staged candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_regional_a5_paid_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_regional_a5_paid_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'one_region_a5_source_canary'
          assert isinstance(t['region'], str) and t['region'] and t['region'] != 'elyndor'
          assert isinstance(t['preflight_run_id'], int) and t['preflight_run_id'] > 0
          assert t['preflight_conclusion'] == 'success'
          assert t['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert t['asset_cap'] == 8
          assert t['generation_attempts_per_asset_cap'] == 1
          assert t['one_region_only'] is True
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['accepted_assets_immutable'] is True
          assert t['creator_full_outfits_remain_closed_at'] == 24

          region = t['region']
          candidate_path = Path(f"modal_worker/tileset_{region.replace('-', '_')}_a5_paid_candidate.json")
          assert candidate_path.is_file(), f'missing staged paid candidate: {candidate_path}'
          c = json.loads(candidate_path.read_text(encoding='utf-8'))
          assert c['schema'] == 'plushbound.tileset_regional_a5_paid_candidate.v1'
          assert c['enabled'] is False, 'candidate must stay disabled; trigger is the only activation surface'
          assert c['region'] == region
          assert c['stable_sheet_id'] == f'tileset.{region}.a5'
          assert c['prompt_contract_version'] == t['prompt_contract_version']
          assert c['asset_cap'] == t['asset_cap'] == 8
          assert c['generation_attempts_per_asset_cap'] == t['generation_attempts_per_asset_cap'] == 1
          assert c['one_region_only'] is True
          assert c['never_stack_paid_runs'] is True
          assert c['accepted_assets_immutable'] is True
          assert c['manual_visual_qa_required'] is True
          assert c['compile_authorized'] is False
          assert c['deterministic_finalize_authorized'] is False
          assert c['catalog_wide_launch_authorized'] is False
          assert c['evidence']['regional_preflight_conclusion'] == 'success'
          assert c['evidence']['deterministic_compiler_rehearsal_conclusion'] == 'success'

          scope = json.loads(Path('modal_worker/tileset_regional_a5_scope_manifest.json').read_text(encoding='utf-8'))
          regional = scope['regions'][region]
          assert regional['status'] == 'PREFLIGHT_PENDING', 'fresh paid route refuses quarantined/repair/closed states'
          assert regional['stable_sheet_id'] == c['stable_sheet_id']
          expected_ids = [f"tileset.{region}.a5.source.{m}" for m in regional['materials']]
          assert c['source_asset_ids'] == expected_ids
          assert len(expected_ids) == 8 and len(set(expected_ids)) == 8
          assert scope['source_contract']['prompt_contract_version'] == t['prompt_contract_version']
          assert scope['spend_gate']['catalog_wide_launch_authorized'] is False
          assert scope['spend_gate']['never_stack_paid_runs'] is True

          Path('trigger-region.txt').write_text(region, encoding='utf-8')
          print(f"TRIGGER_REGION={region}")
          print(f"STAGED_CANDIDATE={candidate_path}=VALID_DISABLED")
          PY
          echo "REGION=$(cat trigger-region.txt)" >> "$GITHUB_ENV"

      - name: Re-run exact regional no-spend preflight at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_preflight.py --region "$REGION" > regional-a5-preflight-current-head.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('regional-a5-preflight-current-head.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REGION_A5_READY_FOR_EXPLICIT_BOUNDED_TRIGGER'
          assert r['region'] == os.environ['REGION']
          assert r['region_state'] == 'PREFLIGHT_PENDING', 'fresh eight-source paid route refuses quarantined/repair states'
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['production_skipped'] is True
          assert r['paid_remote_execution_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['preflight_authorizes_one_explicit_bounded_region_trigger'] is True
          assert r['automatic_paid_execution_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert r['checks']['material_swatch_prompt_static_lint'] == 'PASS'
          assert r['checks']['rendered_prompt_anti_scene_contract'] == 'PASS'
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_REGIONAL_PREFLIGHT=PASS_NO_SPEND_PROMPT_V2')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install bounded producer dependency
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile bounded producer
        run: python -m compileall -q modal_worker/tileset_regional_a5_production.py

      - name: Run exactly one bounded eight-source region
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/tileset_regional_a5_production.py --region "$REGION" | tee regional-a5-paid.log

      - name: Verify source report before QA artifact banking
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          p = Path('tileset-regional-a5') / region / 'report.json'
          assert p.is_file(), 'missing regional source report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_regional_a5_source_report.v1'
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['region'] == region and r['target_sheet_type'] == 'A5'
          assert r['requested_count'] == 8 and r['generation_count'] == 8
          assert r['generation_retry_count'] == 0
          assert r['accepted_count'] == 8 and r['quarantined_count'] == 0
          assert r['cross_region_generation_count'] == 0
          assert r['final_a5_generation_count'] == 0
          assert r['manual_visual_qa_required'] is True
          assert r['catalog_wide_launch_authorized'] is False
          assert len(r['assets']) == 8
          assert len({a['asset_id'] for a in r['assets']}) == 8
          assert all(a['prompt_contract_version'] == 'regional-a5-material-swatch-v2' for a in r['assets'])
          assert all(a['generation_attempts'] == 1 for a in r['assets'])
          assert all(a['source_width'] == 384 and a['source_height'] == 384 for a in r['assets'])
          print(f'REGIONAL_A5_SOURCE_MACHINE_GATE={region}=PASS_8_OF_8')
          print('MANUAL_VISUAL_QA_REQUIRED=true')
          PY

      - name: Upload regional sources and QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-source-${{ env.REGION }}-${{ github.run_id }}
          path: |
            regional-a5-preflight-current-head.json
            regional-a5-paid.log
            tileset-regional-a5/${{ env.REGION }}/
          if-no-files-found: warn
          retention-days: 14
