name: Redeploy Vera Modal Worker

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/deploy_trigger.json'

permissions:
  contents: read

concurrency:
  group: redeploy-vera-modal-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile current production worker
        run: python -m compileall -q modal_worker
      - name: Redeploy Vera production worker
        run: modal deploy --strategy recreate modal_worker/freeframe_worker.py
      - name: Probe deployed production class
        shell: bash
        run: |
          python - <<'PY'
          import modal
          cls = modal.Cls.from_name('freeframe-worker', 'FreeFrameProductionGenerator')
          assert cls is not None
          print('FreeFrameProductionGenerator resolved after redeploy')
          PY
