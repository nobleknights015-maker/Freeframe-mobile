name: Plushbound Regional A5 Seven-Source Targeted Repair

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_remaining_repair_trigger.json'

permissions:
  actions: read
  contents: read

concurrency:
  group: plushbound-regional-a5-paid
  cancel-in-progress: false

jobs:
  remaining-seven-targeted-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate targeted-repair trigger and partial acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_regional_a5_remaining_repair_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_regional_a5_remaining_repair_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'remaining_failed_sources_after_green_probe'
          assert isinstance(t['region'], str) and t['region'] and t['region'] != 'elyndor'
          assert t['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert t['accepted_source_count'] == 1
          assert t['remaining_source_count'] == 7
          assert t['asset_cap'] == 7
          assert t['generation_attempts_per_asset_cap'] == 1
          assert t['accepted_source_ids_immutable'] is True
          assert t['accepted_probe_source_must_not_be_rerendered'] is True
          assert t['one_region_only'] is True
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          p = Path(t['partial_acceptance_path'])
          assert p.is_file(), f'missing partial acceptance evidence: {p}'
          partial = json.loads(p.read_text(encoding='utf-8'))
          assert partial['schema'] == 'plushbound.tileset_regional_a5_partial_acceptance.v1'
          assert partial['status'] == 'PARTIAL_ACCEPTANCE_PROBE_GREEN_1_OF_8'
          assert partial['region'] == t['region']
          assert partial['accepted_source_count'] == 1
          assert len(partial['remaining_failed_source_ids']) == 7
          assert partial['accepted_probe_run_id'] == t['accepted_probe_run_id']
          assert partial['accepted_probe_artifact_name'] == t['accepted_probe_artifact_name']
          Path('repair-region.txt').write_text(t['region'], encoding='utf-8')
          Path('partial-path.txt').write_text(t['partial_acceptance_path'], encoding='utf-8')
          Path('accepted-run-id.txt').write_text(str(t['accepted_probe_run_id']), encoding='utf-8')
          Path('accepted-artifact-name.txt').write_text(t['accepted_probe_artifact_name'], encoding='utf-8')
          print(f"TARGETED_REPAIR_TRIGGER={t['region']}=VALID_1_ACCEPTED_7_REMAINING")
          PY
          echo "REGION=$(cat repair-region.txt)" >> "$GITHUB_ENV"
          echo "PARTIAL_ACCEPTANCE_PATH=$(cat partial-path.txt)" >> "$GITHUB_ENV"
          echo "ACCEPTED_PROBE_RUN_ID=$(cat accepted-run-id.txt)" >> "$GITHUB_ENV"
          echo "ACCEPTED_PROBE_ARTIFACT_NAME=$(cat accepted-artifact-name.txt)" >> "$GITHUB_ENV"

      - name: Validate manually accepted probe evidence
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python modal_worker/tileset_regional_a5_partial_acceptance_validator.py \
            --partial-acceptance "$PARTIAL_ACCEPTANCE_PATH" \
            --region "$REGION" \
            | tee partial-acceptance-validation.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('partial-acceptance-validation.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_PARTIAL_ACCEPTANCE_PROBE_GREEN_1_OF_8'
          assert r['accepted_source_count'] == 1 and r['remaining_repair_source_count'] == 7
          assert r['accepted_source_ids_protected_from_rerender'] is True
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          print('PARTIAL_ACCEPTANCE_VALIDATION=PASS_1_OF_8_LOCKED')
          PY

      - name: Run zero-spend seven-source repair preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_remaining_repair_preflight.py --region "$REGION" > remaining-repair-preflight.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('remaining-repair-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REMAINING_REPAIR_7_READY_FOR_EXPLICIT_TRIGGER'
          assert r['region'] == os.environ['REGION']
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['accepted_source_count'] == 1 and r['remaining_repair_source_count'] == 7
          assert len(r['accepted_source_ids']) == 1 and len(r['remaining_source_ids']) == 7
          assert not set(r['accepted_source_ids']).intersection(r['remaining_source_ids'])
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['production_skipped'] is True and r['paid_remote_execution_skipped'] is True
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert all(v == 'PASS' for v in r['checks'].values())
          print('REMAINING_REPAIR_PREFLIGHT=PASS_NO_SPEND_7')
          PY

      - name: Download exact accepted probe artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ACCEPTED_PROBE_ARTIFACT_NAME }}
          path: accepted-probe-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ACCEPTED_PROBE_RUN_ID }}

      - name: Verify accepted probe artifact hashes before any new generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          partial = json.loads(Path(os.environ['PARTIAL_ACCEPTANCE_PATH']).read_text(encoding='utf-8'))
          row = partial['accepted_sources'][0]
          region = os.environ['REGION']
          material = row['material_key']
          root = Path('accepted-probe-artifact') / 'tileset-regional-a5-prompt-probe' / region / material
          raw = root / f'{material}-384.png'
          norm = root / f'{material}-48.png'
          report = root / 'report.json'
          assert raw.is_file() and norm.is_file() and report.is_file(), 'accepted probe artifact incomplete'
          assert hashlib.sha256(raw.read_bytes()).hexdigest() == row['raw_sha256']
          assert hashlib.sha256(norm.read_bytes()).hexdigest() == row['normalized_sha256']
          pr = json.loads(report.read_text(encoding='utf-8'))
          assert pr['asset_id'] == row['asset_id'] and pr['machine_accepted'] is True
          assert pr['raw_sha256'] == row['raw_sha256'] and pr['normalized_sha256'] == row['normalized_sha256']
          schema = pr.get('schema')
          assert schema in {
              'plushbound.tileset_regional_a5_prompt_probe_report.v1',
              'plushbound.tileset_regional_a5_accepted_probe_adapter.v1',
          }
          if schema == 'plushbound.tileset_regional_a5_accepted_probe_adapter.v1':
              assert pr['source_generation_machine_accepted'] is False
              assert pr['deterministic_renormalization_machine_accepted'] is True
              assert pr['renormalization_is_zero_gpu'] is True
          print(f"ACCEPTED_PROBE_ARTIFACT={row['asset_id']}=HASH_LOCK_PASS")
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install bounded repair runner dependency
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile targeted repair runner
        run: python -m compileall -q modal_worker/tileset_regional_a5_remaining_repair.py

      - name: Generate exactly the seven remaining failed IDs
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 600s \
            modal run modal_worker/tileset_regional_a5_remaining_repair.py --region "$REGION" \
            | tee remaining-repair-paid.log

      - name: Assert seven-source machine gate and accepted-ID exclusion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          partial = json.loads(Path(os.environ['PARTIAL_ACCEPTANCE_PATH']).read_text(encoding='utf-8'))
          p = Path('tileset-regional-a5-targeted-repair') / region / 'report.json'
          assert p.is_file(), 'missing targeted repair report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_regional_a5_remaining_repair_report.v1'
          assert r['region'] == region and r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['requested_count'] == 7 and r['generation_count'] == 7 and r['generation_retry_count'] == 0
          assert r['machine_accepted_count'] == 7 and r['machine_quarantined_count'] == 0
          assert r['accepted_source_ids_excluded'] == sorted(partial['accepted_source_ids'])
          assert not set(r['accepted_source_ids_excluded']).intersection(a['asset_id'] for a in r['assets'])
          assert r['cross_region_generation_count'] == 0 and r['final_a5_generation_count'] == 0
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False and r['manual_visual_qa_required'] is True
          assert r['gpu_candidates'] == ['L4', 'A10G']
          assert r['startup_timeout_seconds'] == 180
          assert r['remote_timeout_seconds'] == 240
          assert len(r['assets']) == 7 and all(a['generation_attempts'] == 1 for a in r['assets'])
          print(f'TARGETED_REPAIR_MACHINE_GATE={region}=PASS_7_OF_7')
          print('ACCEPTED_PROBE_RERENDER_COUNT=0')
          PY

      - name: Assemble combined eight-source QA artifact without compiling A5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps
          region = os.environ['REGION']
          partial = json.loads(Path(os.environ['PARTIAL_ACCEPTANCE_PATH']).read_text(encoding='utf-8'))
          accepted = partial['accepted_sources'][0]
          repair = json.loads((Path('tileset-regional-a5-targeted-repair') / region / 'report.json').read_text(encoding='utf-8'))
          out = Path('tileset-regional-a5-combined') / region
          raw_out = out / 'raw'
          norm_out = out / 'normalized'
          raw_out.mkdir(parents=True, exist_ok=True)
          norm_out.mkdir(parents=True, exist_ok=True)

          material = accepted['material_key']
          accepted_root = Path('accepted-probe-artifact') / 'tileset-regional-a5-prompt-probe' / region / material
          shutil.copy2(accepted_root / f'{material}-384.png', raw_out / f'{material}-384.png')
          shutil.copy2(accepted_root / f'{material}-48.png', norm_out / f'{material}-48.png')
          combined = [{**accepted, 'source_origin': 'accepted_probe', 'manual_visual_status': 'PASS'}]

          repair_root = Path('tileset-regional-a5-targeted-repair') / region
          for row in repair['assets']:
              m = row['material_key']
              shutil.copy2(repair_root / 'raw' / f'{m}-384.png', raw_out / f'{m}-384.png')
              shutil.copy2(repair_root / 'normalized' / f'{m}-48.png', norm_out / f'{m}-48.png')
              combined.append({
                  'asset_id': row['asset_id'],
                  'material_key': m,
                  'raw_sha256': row['raw_sha256'],
                  'normalized_sha256': row['normalized_sha256'],
                  'source_size': [384, 384],
                  'normalized_size': [48, 48],
                  'generation_attempts': 1,
                  'machine_status': 'PASS',
                  'manual_visual_status': 'PENDING',
                  'source_origin': 'targeted_repair'
              })
          assert len(combined) == 8 and len({r['asset_id'] for r in combined}) == 8
          for row in combined:
              m = row['material_key']
              assert hashlib.sha256((raw_out / f'{m}-384.png').read_bytes()).hexdigest() == row['raw_sha256']
              assert hashlib.sha256((norm_out / f'{m}-48.png').read_bytes()).hexdigest() == row['normalized_sha256']

          materials = json.loads(Path('modal_worker/tileset_regional_a5_scope_manifest.json').read_text(encoding='utf-8'))['regions'][region]['materials']
          by_material = {r['material_key']: r for r in combined}
          sheet = Image.new('RGBA', (384 * 4, (384 + 28) * 2), (24,24,24,255))
          draw = ImageDraw.Draw(sheet)
          for index, m in enumerate(materials):
              with Image.open(raw_out / f'{m}-384.png') as im:
                  tile = ImageOps.fit(im.convert('RGBA'), (384,384))
              x = (index % 4) * 384
              y = (index // 4) * (384 + 28)
              sheet.alpha_composite(tile, (x,y))
              draw.text((x+8, y+390), m, fill=(240,240,240,255))
          sheet.save(out / 'contact-sheet.png', format='PNG')
          manifest = {
              'schema': 'plushbound.tileset_regional_a5_combined_repair_sources.v1',
              'status': 'MACHINE_PASS_8_OF_8_MANUAL_1_OF_8_REMAINING_7_PENDING',
              'region': region,
              'target_sheet_type': 'A5',
              'stable_sheet_id': f'tileset.{region}.a5',
              'prompt_contract_version': 'regional-a5-material-swatch-v2',
              'accepted_probe_source_count': 1,
              'targeted_repair_source_count': 7,
              'machine_pass_count': 8,
              'manual_pass_count': 1,
              'manual_pending_count': 7,
              'compile_authorized': False,
              'deterministic_finalize_authorized': False,
              'catalog_wide_launch_authorized': False,
              'runtime_import_proof': False,
              'sources': [by_material[m] for m in materials]
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2, sort_keys=True), encoding='utf-8')
          print('COMBINED_EIGHT_SOURCE_QA_ARTIFACT=READY_MANUAL_7_PENDING')
          print('A5_COMPILE_GENERATION_COUNT=0')
          PY

      - name: Upload combined source QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-combined-repair-${{ env.REGION }}-${{ github.run_id }}
          path: |
            partial-acceptance-validation.json
            remaining-repair-preflight.json
            remaining-repair-paid.log
            tileset-regional-a5-targeted-repair/${{ env.REGION }}/
            tileset-regional-a5-combined/${{ env.REGION }}/
          if-no-files-found: warn
          retention-days: 14
