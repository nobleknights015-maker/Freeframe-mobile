name: Plushbound Guardian Runtime Canary

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/guardian_runtime_trigger.json

permissions:
  contents: read
  actions: read

concurrency:
  group: plushbound-guardian-runtime-canary
  cancel-in-progress: false

jobs:
  guardian-runtime-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Recover accepted Guardian-001 source master
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12550259269/zip > guardian-r1.zip
          mkdir guardian-source
          unzip -q guardian-r1.zip -d guardian-source
          master=$(find guardian-source -type f -name 'guardian-master__guardian-001.png' -print -quit)
          test -n "$master"
          cp "$master" guardian-master__guardian-001.png
          python - <<'PY'
          from PIL import Image
          p='guardian-master__guardian-001.png'
          with Image.open(p) as im:
              im.load()
              assert im.size == (768,768), im.size
              assert im.mode == 'RGB', im.mode
          print('Guardian-001 accepted master recovered: 768x768 RGB')
          PY
      - name: Run semantic extraction plus deterministic derivative canary
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. modal run modal_worker/guardian_runtime_canary.py --master-path guardian-master__guardian-001.png --guardian-id 1 | tee guardian-runtime-canary.log
      - name: Verify frozen Guardian geometry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path('guardian-runtime-canary/guardian-001')
          expected={'overworld':(144,192),'portrait':(288,288),'silhouette':(192,192),'battle-idle':(192,192),'icon':(96,96)}
          report=json.loads((root/'report.json').read_text())
          assert report['derived_count'] == 5, report['derived_count']
          assert report['diffusion_generation_count'] == 0
          for name,size in expected.items():
              with Image.open(root/f'{name}.png') as im:
                  im.load()
                  assert im.size == size, (name, im.size)
                  assert 'A' in im.getbands(), (name, im.getbands())
              assert report['derived'][name]['validation']['valid'], name
          print('Guardian runtime canary geometry/alpha validation OK')
          PY
      - name: Upload Guardian runtime canary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guardian-runtime-canary-${{ github.run_id }}
          path: |
            guardian-runtime-canary.log
            guardian-master__guardian-001.png
            guardian-runtime-canary/guardian-001/
          if-no-files-found: warn
          retention-days: 14
