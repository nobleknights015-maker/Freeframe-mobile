name: Plushbound Gloamfen A5 Seven-of-Eight Acceptance

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_gloamfen_a5_seven_acceptance_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  package-seven-accepted:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate zero-GPU seven-acceptance trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_gloamfen_a5_seven_acceptance_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_gloamfen_a5_seven_acceptance_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'package_five_green_plus_dark_peat_zero_gpu_rescue_with_existing_marsh'
          assert t['region'] == 'gloamfen'
          assert t['accepted_before'] == 1
          assert t['machine_green_from_seven_run'] == 5
          assert t['dark_peat_zero_gpu_rescue'] is True
          assert t['reed_matting_excluded'] is True
          assert t['accepted_after_expected'] == 7
          assert [t['provider_calls_allowed'], t['gpu_calls_allowed'], t['generation_calls_allowed']] == [0,0,0]
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          assert t['catalog_wide_launch_authorized'] is False
          PY

      - name: Download immutable marsh acceptance artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-gloamfen-accepted-probe-40714618651
          path: marsh-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40714618651

      - name: Download exact seven-source repair artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-combined-repair-gloamfen-40715821580
          path: seven-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40715821580

      - name: Verify immutable inputs and rescue dark peat zero GPU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_gloamfen_a5_seven_acceptance_trigger.json').read_text(encoding='utf-8'))
          marsh_root = Path('marsh-artifact/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud')
          assert hashlib.sha256((marsh_root/'marsh_mud-384.png').read_bytes()).hexdigest() == t['marsh_raw_sha256']
          assert hashlib.sha256((marsh_root/'marsh_mud-48.png').read_bytes()).hexdigest() == t['marsh_normalized_sha256']
          repair_root = Path('seven-artifact/tileset-regional-a5-targeted-repair/gloamfen')
          report = json.loads((repair_root/'report.json').read_text(encoding='utf-8'))
          assert report['generation_count'] == 7 and report['generation_retry_count'] == 0
          assert report['machine_accepted_count'] == 5 and report['machine_quarantined_count'] == 2
          assert report['accepted_source_ids_excluded'] == ['tileset.gloamfen.a5.source.marsh_mud']
          rows = {a['material_key']: a for a in report['assets']}
          assert set(rows) == {'boardwalk_timber','damp_moss','dark_peat','drowned_stone','fungal_moss','reed_matting','shallow_silt'}
          for material in t['five_green_materials']:
              row = rows[material]
              assert row['machine_accepted'] is True
              assert hashlib.sha256((repair_root/'raw'/f'{material}-384.png').read_bytes()).hexdigest() == row['raw_sha256']
              assert hashlib.sha256((repair_root/'normalized'/f'{material}-48.png').read_bytes()).hexdigest() == row['normalized_sha256']
          dark = rows['dark_peat']
          assert dark['machine_accepted'] is False and dark['raw_inspection']['accepted'] is True
          assert dark['raw_sha256'] == t['dark_peat_raw_sha256']
          assert dark['normalized_sha256'] == t['dark_peat_old_normalized_sha256']
          reed = rows['reed_matting']
          assert reed['raw_sha256'] == t['reed_matting_raw_sha256']
          assert reed['machine_accepted'] is False
          print('GLOAMFEN_SEVEN_ACCEPTANCE_INPUTS=HASH_LOCK_PASS')
          PY
          mkdir -p rescued
          PYTHONPATH=. python modal_worker/tileset_low_light_readability_rescue.py \
            --source seven-artifact/tileset-regional-a5-targeted-repair/gloamfen/raw/dark_peat-384.png \
            --output rescued/dark_peat-48.png \
            > rescued/dark_peat-rescue-report.json

      - name: Package exact seven accepted sources and exclude reed matting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageOps

          t = json.loads(Path('modal_worker/tileset_gloamfen_a5_seven_acceptance_trigger.json').read_text(encoding='utf-8'))
          review = json.loads(Path('modal_worker/tileset_gloamfen_a5_seven_repair_review.json').read_text(encoding='utf-8'))
          rescue = json.loads(Path('rescued/dark_peat-rescue-report.json').read_text(encoding='utf-8'))
          assert rescue['accepted'] is True
          assert rescue['provider_calls'] == rescue['gpu_calls'] == rescue['generation_calls'] == 0
          assert rescue['final_rgb_stddev'] >= 3.0
          assert rescue['edge_discontinuity'] <= 0.25
          assert rescue['total_contrast_factor'] <= rescue['maximum_total_contrast_factor'] == 2.5

          out = Path('accepted-seven/gloamfen')
          raw_out = out/'raw'; norm_out = out/'normalized'
          raw_out.mkdir(parents=True, exist_ok=True); norm_out.mkdir(parents=True, exist_ok=True)
          marsh = Path('marsh-artifact/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud')
          repair = Path('seven-artifact/tileset-regional-a5-targeted-repair/gloamfen')
          accepted = []

          shutil.copy2(marsh/'marsh_mud-384.png', raw_out/'marsh_mud-384.png')
          shutil.copy2(marsh/'marsh_mud-48.png', norm_out/'marsh_mud-48.png')
          accepted.append({
              'asset_id':'tileset.gloamfen.a5.source.marsh_mud','material_key':'marsh_mud',
              'raw_sha256':t['marsh_raw_sha256'],'normalized_sha256':t['marsh_normalized_sha256'],
              'machine_status':'PASS','manual_visual_status':'PASS','origin':'accepted_probe'
          })

          rr = json.loads((repair/'report.json').read_text(encoding='utf-8'))
          by_material = {a['material_key']:a for a in rr['assets']}
          for material in t['five_green_materials']:
              row = by_material[material]
              manual = review['manual_review'][row['asset_id']]
              assert row['machine_accepted'] is True and manual['manual_visual_status'] == 'PASS'
              shutil.copy2(repair/'raw'/f'{material}-384.png', raw_out/f'{material}-384.png')
              shutil.copy2(repair/'normalized'/f'{material}-48.png', norm_out/f'{material}-48.png')
              accepted.append({
                  'asset_id':row['asset_id'],'material_key':material,
                  'raw_sha256':row['raw_sha256'],'normalized_sha256':row['normalized_sha256'],
                  'machine_status':'PASS','manual_visual_status':'PASS','origin':'seven_source_repair'
              })

          dark = by_material['dark_peat']
          assert review['manual_review'][dark['asset_id']]['manual_visual_status'].startswith('PASS_SEMANTICS')
          shutil.copy2(repair/'raw'/'dark_peat-384.png', raw_out/'dark_peat-384.png')
          shutil.copy2('rescued/dark_peat-48.png', norm_out/'dark_peat-48.png')
          dark_norm_sha = hashlib.sha256((norm_out/'dark_peat-48.png').read_bytes()).hexdigest()
          accepted.append({
              'asset_id':dark['asset_id'],'material_key':'dark_peat',
              'raw_sha256':dark['raw_sha256'],'normalized_sha256':dark_norm_sha,
              'machine_status':'PASS_AFTER_ZERO_GPU_LOW_LIGHT_RESCUE','manual_visual_status':'PASS',
              'origin':'seven_source_repair_plus_zero_gpu_rescue',
              'rescue_report':rescue
          })

          assert len(accepted) == 7 and len({a['asset_id'] for a in accepted}) == 7
          assert all(a['asset_id'] != 'tileset.gloamfen.a5.source.reed_matting' for a in accepted)
          for row in accepted:
              m=row['material_key']
              assert hashlib.sha256((raw_out/f'{m}-384.png').read_bytes()).hexdigest() == row['raw_sha256']
              assert hashlib.sha256((norm_out/f'{m}-48.png').read_bytes()).hexdigest() == row['normalized_sha256']

          order=['marsh_mud','damp_moss','shallow_silt','boardwalk_timber','drowned_stone','fungal_moss','dark_peat']
          cell=384; label=28
          sheet=Image.new('RGBA',(cell*4,(cell+label)*2),(24,24,24,255)); draw=ImageDraw.Draw(sheet)
          for i,m in enumerate(order):
              with Image.open(raw_out/f'{m}-384.png') as im:
                  tile=ImageOps.fit(im.convert('RGBA'),(cell,cell))
              x=(i%4)*cell; y=(i//4)*(cell+label)
              sheet.alpha_composite(tile,(x,y)); draw.text((x+8,y+cell+6),m,fill=(240,240,240,255))
          sheet.save(out/'contact-sheet-seven-accepted.png',format='PNG')

          manifest={
              'schema':'plushbound.tileset_gloamfen_a5_partial_acceptance_7_of_8.v1',
              'status':'PARTIAL_ACCEPTANCE_7_OF_8_REED_MATTING_ONLY_REMAINS',
              'region':'gloamfen','target_sheet_type':'A5','stable_sheet_id':'tileset.gloamfen.a5',
              'accepted_source_count':7,
              'remaining_failed_source_count':1,
              'remaining_failed_source_ids':['tileset.gloamfen.a5.source.reed_matting'],
              'accepted_sources':accepted,
              'provider_calls_this_packaging':0,'gpu_calls_this_packaging':0,'generation_calls_this_packaging':0,
              'accepted_assets_immutable':True,'compile_authorized':False,'deterministic_finalize_authorized':False,
              'catalog_wide_launch_authorized':False,'runtime_import_proof':False
          }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          print('GLOAMFEN_PARTIAL_ACCEPTANCE=PASS_7_OF_8_REED_MATTING_ONLY')
          print(f'DARK_PEAT_RESCUED_NORMALIZED_SHA256={dark_norm_sha}')
          PY

      - name: Upload immutable seven-of-eight acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-seven-accepted-${{ github.run_id }}
          path: |
            accepted-seven/
            rescued/dark_peat-rescue-report.json
          if-no-files-found: error
          retention-days: 14
