name: Plushbound FLUX2 Reference Repair Preflight

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_asset_pipeline_v2_flux2_reference_batch.py'
      - 'modal_worker/world_asset_pipeline_v2_reference_conditioning.json'
      - 'modal_worker/world_asset_pipeline_v2_provenance_repair.json'
      - 'modal_worker/project_references/**'
      - '.github/workflows/flux2-reference-repair-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install zero-spend dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'
      - name: Compile corrected repair controller
        run: |
          python -m py_compile modal_worker/world_asset_pipeline_v2_flux2_reference_batch.py
          python -m py_compile modal_worker/freeframe_flux2_reference_worker.py
      - name: Validate current-chat repair scope with zero generation
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_flux2_reference_batch import (
              build_repair_rows,
              declaration_validation,
          )

          declaration = declaration_validation()
          assert declaration['status'] == 'PASS_ZERO_GPU_CORRECTED_REFERENCE_REPAIR_DECLARATION'
          assert declaration['required_source_art_provenance'] == 'vera-modal-generated'
          assert declaration['reference_sheet_pixels_used_as_runtime_art'] is False
          assert declaration['compile_authorized'] is False
          assert declaration['catalog_wide_launch_authorized'] is False
          repair = json.loads(Path('modal_worker/world_asset_pipeline_v2_provenance_repair.json').read_text())
          for region in ('tideglass-coast', 'crownweave'):
              ids = repair['regions'][region]['source_ids']
              rows, superseded = build_repair_rows(region, ids)
              assert [row['asset_id'] for row in rows] == ids
              assert len(rows) == 8
              if region == 'crownweave':
                  assert superseded == ['tileset.crownweave.a5.source.highland_grass']
              else:
                  assert superseded == []
          print(json.dumps(declaration, sort_keys=True))
          PY
      - name: Write zero-spend receipt
        run: |
          printf '%s\n' '{"schema":"plushbound.flux2_reference_repair_preflight.v1","status":"PASS","regions":["tideglass-coast","crownweave"],"provider_calls":0,"gpu_calls":0,"generation_calls":0,"compile_authorized":false,"catalog_wide_launch_authorized":false,"required_source_art_provenance":"vera-modal-generated","reference_sheet_pixels_used_as_runtime_art":false}' > flux2-reference-repair-preflight.json
      - uses: actions/upload-artifact@v4
        with:
          name: plushbound-flux2-reference-repair-preflight-${{ github.run_id }}
          path: flux2-reference-repair-preflight.json
          if-no-files-found: error
          retention-days: 14
