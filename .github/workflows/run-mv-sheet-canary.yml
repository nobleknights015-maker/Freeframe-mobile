name: FreeFrame MV Sheet Canary

on:
  workflow_dispatch:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/mv_sheet_canary.py'
      - 'modal_worker/asset_profiles.py'
      - 'modal_worker/asset_packager.py'
      - 'modal_worker/image_normalizer.py'
      - 'modal_worker/png_compositor.py'
      - 'modal_worker/production_factory.py'
      - '.github/workflows/run-mv-sheet-canary.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-mv-sheet-canary
  cancel-in-progress: false

jobs:
  editor-sheet-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile sheet path
        run: python -m compileall -q modal_worker
      - name: Run bounded 12-frame editor sheet canary
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=modal_worker modal run modal_worker/mv_sheet_canary.py | tee mv-sheet-canary.log
      - name: Verify exact editor PNG geometry
        shell: bash
        run: |
          PYTHONPATH=modal_worker python - <<'PY'
          from PIL import Image
          path = '$plushbound_sheet_canary.png'
          with Image.open(path) as im:
              im.load()
              assert im.format == 'PNG', im.format
              assert im.size == (144, 192), im.size
              assert 'A' in im.getbands(), im.getbands()
          print('editor sheet geometry OK: 144x192 RGBA PNG')
          PY
      - name: Upload editor sheet canary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mv-sheet-canary-${{ github.run_id }}
          path: |
            mv-sheet-canary.log
            $plushbound_sheet_canary.png
          if-no-files-found: warn
          retention-days: 7
