name: Plushbound Creator Full Outfits Batch

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/creator_full_outfits_batch_trigger.json
      - modal_worker/creator_clothing_handoff.json
      - modal_worker/creator_full_outfits_canary_completion_contract.json
      - .github/workflows/run-creator-full-outfits-batch.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: plushbound-creator-full-outfits-batch
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
      styles: ${{ steps.plan.outputs.styles }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install no-spend preflight dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.6,<2' 'pillow>=10.4,<12'
      - name: Compile Full Outfits path without production
        run: python -m compileall -q modal_worker/creator_full_outfits_batch_v2.py modal_worker/creator_full_outfits_style_catalog.py modal_worker/creator_tops_batch.py modal_worker/creator_bottoms_batch.py modal_worker/creator_full_outfits_canary_completion_audit.py
      - name: Verify locked outfit geometry without production
        run: |
          python - <<'PY'
          from modal_worker.creator_full_outfits_batch_v2 import _locked_outfit_mask
          m=_locked_outfit_mask()
          assert m.size==(144,192) and m.getbbox() is not None
          for row in range(4):
            cells=[]
            for col in range(3):
              a=m.crop((col*48,row*48,(col+1)*48,(row+1)*48)); b=a.getbbox()
              assert b is not None and b[1]>=4 and b[3]<=46
              cells.append(a.tobytes())
            assert len(set(cells))>1, 'locked outfit movement phases collapsed'
          print('locked top+bottom outfit mask contract verified')
          PY
      - name: Exercise extraction and compiler without production
        run: |
          python - <<'PY'
          import base64, io
          from PIL import Image, ImageDraw
          from modal_worker.creator_full_outfits_batch_v2 import _border_white_extract, _locked_outfit_mask, _compile_sheet, _opaque_texture
          from modal_worker.creator_full_outfits_style_catalog import get_style
          src=Image.new('RGB',(128,160),'white'); d=ImageDraw.Draw(src)
          d.rounded_rectangle((34,18,94,70),radius=8,fill=(76,92,126)); d.rectangle((44,82,84,146),fill=(116,76,92))
          buf=io.BytesIO(); src.save(buf,format='PNG')
          piece=_border_white_extract(base64.b64encode(buf.getvalue()).decode('ascii'))
          assert piece.mode=='RGBA' and piece.getchannel('A').getbbox() is not None
          assert _opaque_texture(piece).getchannel('A').getextrema()==(255,255)
          pieces={name:piece.copy() for name in ('down','left','right','up')}
          sheet,geometry=_compile_sheet(get_style(1),pieces)
          assert sheet.size==(144,192) and sheet.mode=='RGBA'
          assert len(geometry['cells'])==12
          assert geometry['mask_contract']=='creator_tops_union_creator_bottoms_v1'
          assert geometry['texture_fill_backend']=='opaque_mean_fabric_v1'
          assert sheet.getchannel('A').tobytes()==_locked_outfit_mask().tobytes()
          visible=sheet.convert('RGB'); alpha=sheet.getchannel('A'); bright=0; total=0
          for rgb,a in zip(visible.getdata(),alpha.getdata()):
            if a:
              total+=1
              if min(rgb)>=240: bright+=1
          assert total and bright/total < 0.02, 'white-background texture leaked into locked outfit geometry'
          print('deterministic extraction + opaque texture fill + locked compiler smoke test verified')
          PY
      - id: plan
        name: Validate bounded Creator Full Outfits primary-track wave
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess
          from pathlib import Path
          from modal_worker.creator_full_outfits_style_catalog import snapshot
          d=json.loads(Path('modal_worker/creator_full_outfits_batch_trigger.json').read_text())
          h=json.loads(Path('modal_worker/creator_clothing_handoff.json').read_text())
          cc=json.loads(Path('modal_worker/creator_full_outfits_canary_completion_contract.json').read_text())
          cat=snapshot(); allowed=set(int(x) for x in cat['selected_ids']); styles=[int(x) for x in d['style_indices']]
          assert d['schema']=='plushbound.creator_full_outfits_batch_trigger.v1'
          assert h['schema']=='plushbound.creator_clothing_handoff.v1'
          assert cc['schema']=='plushbound.creator_full_outfits_canary_completion_contract.v1'
          assert int(h['tops_bulk_run_id'])==40541409733
          assert h['tops_bulk_complete'] is True
          assert int(h['tops_ready_style_count'])>=55
          assert h['full_outfits_primary_track'] is True
          assert h['tops_required_for_full_outfits'] is False
          assert h['full_outfits_canary_authorized'] is True
          assert h['bottoms_deferred'] is True
          assert styles and len(styles)==len(set(styles)) and set(styles)<=allowed
          assert int(d['style_count'])==len(styles)
          assert int(d['max_paid_renders'])==len(styles)*5
          assert int(d['max_paid_extractions'])==0
          assert int(d['max_parallel'])==2
          assert d['source_art_required'] is True
          assert d['deterministic_finalization_required'] is True
          assert d['requires_locked_body_qc'] is True
          assert d['requires_tops_handoff_gate'] is False
          assert d['requires_one_shot_launch_commit'] is True
          assert d['catalog_wide_launch_authorized'] is False
          assert d['phase'] in ('canary','bulk')
          if d['phase']=='canary':
              assert styles==[1,49,95]
              assert cc['expected_style_indices']==[1,49,95]
              assert cc.get('production_run_id') is None, 'canary contract already points at a production run; reconcile before launching again'
          nonce=int(d['launch_nonce']); assert nonce>=1
          expected_launch_message=f"Launch Creator Full Outfits {d['phase']} nonce {nonce}"
          if d['enabled'] is True:
            assert d.get('authorized_launch_commit_message')==expected_launch_message, 'refusing Full Outfits spend without exact one-shot launch message authorization'
            actual_commit_message=subprocess.check_output(['git','log','-1','--pretty=%B'],text=True).strip()
            assert actual_commit_message==expected_launch_message, 'refusing Full Outfits spend from a later or unrelated push; launch commit message mismatch'
          else:
            assert d.get('authorized_launch_commit_message') is None, 'disabled Full Outfits trigger must not retain a launch authorization message'
          print(f"enabled={'true' if d['enabled'] is True else 'false'}")
          print('styles='+json.dumps(styles,separators=(',',':')))
          print('optional_tops_exceptions='+json.dumps(h.get('tops_optional_exceptions_remaining',[]),separators=(',',':')))
          PY

  produce:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        style_index: ${{ fromJSON(needs.preflight.outputs.styles) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID missing' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET missing' >&2; exit 1; }
      - name: Install bounded production dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.6,<2' 'pillow>=10.4,<12'
      - name: Compile Creator Full Outfits runner
        run: python -m compileall -q modal_worker/creator_full_outfits_batch_v2.py modal_worker/creator_full_outfits_style_catalog.py modal_worker/creator_tops_batch.py modal_worker/creator_bottoms_batch.py
      - name: Produce one Creator Full Outfit
        shell: bash
        run: |
          set -euo pipefail
          STYLE='${{ matrix.style_index }}'
          LOG="creator-full-outfits-batch-${STYLE}.log"
          sleep $((STYLE % 2 * 10))
          for attempt in 1 2 3 4; do
            set +e
            timeout --signal=TERM --kill-after=2m 35m env PYTHONPATH=. modal run modal_worker/creator_full_outfits_batch_v2.py --style-index "$STYLE" >"$LOG.tmp" 2>&1
            code=$?
            set -e
            cat "$LOG.tmp" >> "$LOG"
            if [ "$code" -eq 0 ]; then rm -f "$LOG.tmp"; exit 0; fi
            if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
              echo 'Creator Full Outfits watchdog stopped a hung Modal invocation; refusing automatic paid retry.' | tee -a "$LOG"
              rm -f "$LOG.tmp"; exit "$code"
            fi
            if ! grep -Fq 'App create rate limit exceeded' "$LOG.tmp"; then
              echo 'Non-prelaunch failure; refusing automatic paid retry.' | tee -a "$LOG"
              rm -f "$LOG.tmp"; exit "$code"
            fi
            rm -f "$LOG.tmp"
            if [ "$attempt" -lt 4 ]; then sleep $((attempt * 20)); fi
          done
          exit 1
      - name: Verify Creator Full Outfits evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          style=int('${{ matrix.style_index }}'); root=Path(f'creator-full-outfits-batch-output/style-{style:03d}')
          report=json.loads((root/'report.json').read_text())
          assert report['schema']=='plushbound.creator_full_outfits_batch.v1'
          assert report['style_index']==style and report['logical_id']==f'creator/full-outfits/{style:03d}'
          assert report['paid_render_count']==5 and report['paid_extraction_count']==0
          assert report['extraction_backend']=='deterministic_border_connected_white_v1'
          assert report['texture_fill_backend']=='opaque_mean_fabric_v1'
          assert report['source_art_persisted_before_extraction'] is True
          assert report['generated_alpha_used_for_texture_cleanup_only'] is True
          assert report['compiler_owns_final_geometry'] is True
          assert report['generated_alpha_discarded_for_final_geometry'] is True
          assert report['catalog_wide_launch_authorized'] is False
          assert report['geometry']['mask_contract']=='creator_tops_union_creator_bottoms_v1'
          assert report['geometry']['texture_fill_backend']=='opaque_mean_fabric_v1'
          raw=root/'sources'/'raw'; assert all((raw/f'{name}.png').exists() for name in ('reference','down','left','right','up'))
          p=root/f'creator-full-outfit-{style:03d}.png'
          with Image.open(p) as im:
            im.load(); assert im.size==(144,192) and im.mode=='RGBA'
            alpha=im.getchannel('A'); assert alpha.getbbox() is not None
            for row in range(4):
              cells=[]
              for col in range(3):
                a=alpha.crop((col*48,row*48,(col+1)*48,(col+1)*48)); b=a.getbbox()
                assert b is not None
                cells.append(a.tobytes())
              assert len(set(cells))>1, 'movement phases must preserve motion geometry'
          print(f'creator full outfit {style:03d} evidence verified')
          PY
      - name: Upload Creator Full Outfits evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creator-full-outfits-batch-${{ matrix.style_index }}-${{ github.run_id }}
          path: |
            creator-full-outfits-batch-${{ matrix.style_index }}.log
            creator-full-outfits-batch-output/style-*/
          if-no-files-found: error
          retention-days: 14
