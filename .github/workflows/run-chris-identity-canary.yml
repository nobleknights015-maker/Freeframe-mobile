name: Chris Canonical Identity Canary

on:
  workflow_dispatch:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/chris_identity_canary.py'
      - 'modal_worker/chris_identity_canary_trigger.json'
      - 'modal_worker/project_references/chris_proven_reference.jpg'
      - '.github/workflows/run-chris-identity-canary.yml'

permissions:
  contents: read

concurrency:
  group: chris-canonical-identity-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile identity canary surface
        run: python -m compileall -q modal_worker
      - name: Verify canonical reference exists
        run: test -s modal_worker/project_references/chris_proven_reference.jpg
      - name: Run Chris canonical identity canary
        run: python -m modal_worker.chris_identity_canary
      - name: Upload Chris identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chris-identity-canary-${{ github.run_id }}
          path: chris-identity-canary/
          if-no-files-found: warn
          retention-days: 14
