name: Chris Canonical Portrait Identity Canary

on:
  workflow_dispatch:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/chris_portrait_canary.py'
      - 'modal_worker/chris_identity_canary_trigger.json'
      - 'modal_worker/project_references/chris_proven_reference.jpg'
      - '.github/workflows/run-chris-identity-canary.yml'

permissions:
  contents: read

concurrency:
  group: chris-canonical-portrait-identity-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install bounded canary dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile identity canary surface
        run: python -m compileall -q modal_worker
      - name: Preflight canonical reference before Modal
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import io
          from pathlib import Path
          from PIL import Image
          p = Path('modal_worker/project_references/chris_proven_reference.jpg')
          assert p.is_file() and p.stat().st_size > 1024
          raw = p.read_bytes()
          with Image.open(io.BytesIO(raw)) as im:
              im.verify()
          with Image.open(io.BytesIO(raw)) as im:
              assert im.width >= 96 and im.height >= 160
              print(im.format, im.size, im.mode)
          PY
      - name: Run one bounded Chris 288x384 portrait canary
        run: python -m modal_worker.chris_portrait_canary
      - name: Require portrait evidence
        shell: bash
        run: |
          test -s chris-portrait-canary/chris-bourn-portrait.png
          test -s chris-portrait-canary/chris-proven-reference.jpg
          test -s chris-portrait-canary/report.json
      - name: Upload Chris portrait identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chris-portrait-canary-${{ github.run_id }}
          path: chris-portrait-canary/
          if-no-files-found: warn
          retention-days: 14
