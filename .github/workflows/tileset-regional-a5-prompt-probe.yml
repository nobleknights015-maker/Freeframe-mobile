name: Plushbound Regional A5 One-Source Prompt Repair Probe

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_prompt_probe_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-regional-a5-paid
  cancel-in-progress: false

jobs:
  one-source-prompt-repair-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic preflight dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate one-source repair trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_regional_a5_prompt_probe_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_regional_a5_prompt_probe_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'one_source_prompt_repair_probe'
          assert isinstance(t['region'], str) and t['region'] and t['region'] != 'elyndor'
          assert isinstance(t['asset_id'], str) and t['asset_id'].startswith(f"tileset.{t['region']}.a5.source.")
          assert isinstance(t['preflight_run_id'], int) and t['preflight_run_id'] > 0
          assert t['preflight_conclusion'] == 'success'
          assert t['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert t['asset_cap'] == 1
          assert t['generation_attempts_per_asset_cap'] == 1
          assert t['one_region_only'] is True
          assert t['one_source_only'] is True
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          assert t['accepted_assets_immutable'] is True
          assert t['creator_full_outfits_remain_closed_at'] == 24
          q = Path(t['quarantine_path'])
          assert q.is_file(), f'missing quarantine evidence: {q}'
          quarantine = json.loads(q.read_text(encoding='utf-8'))
          assert quarantine['schema'] == 'plushbound.tileset_regional_a5_source_quarantine.v1'
          assert quarantine['region'] == t['region']
          assert quarantine['status'] == 'QUARANTINED_MANUAL_VISUAL_FAIL_0_OF_8_ACCEPTED'
          assert quarantine['accepted_source_count'] == 0
          assert quarantine['source_run_id'] == t['prior_failed_source_run_id']
          assert t['asset_id'] in quarantine['rerender_authority']['failed_source_ids']
          Path('probe-region.txt').write_text(t['region'], encoding='utf-8')
          Path('probe-asset-id.txt').write_text(t['asset_id'], encoding='utf-8')
          print(f"PROMPT_PROBE_TRIGGER={t['region']}:{t['asset_id']}=VALID")
          PY
          echo "REGION=$(cat probe-region.txt)" >> "$GITHUB_ENV"
          echo "ASSET_ID=$(cat probe-asset-id.txt)" >> "$GITHUB_ENV"

      - name: Re-run repaired regional preflight at current HEAD
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_preflight.py --region "$REGION" > prompt-probe-preflight.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path('prompt-probe-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REGION_A5_READY_FOR_EXPLICIT_BOUNDED_TRIGGER'
          assert r['region'] == os.environ['REGION']
          assert r['region_state'] == 'QUARANTINED_PROMPT_REPAIR_REQUIRED'
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['production_skipped'] is True and r['paid_remote_execution_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['catalog_wide_launch_authorized'] is False
          assert r['checks']['material_swatch_prompt_static_lint'] == 'PASS'
          assert r['checks']['rendered_prompt_anti_scene_contract'] == 'PASS'
          assert r['checks']['quarantine_evidence_bound'] == 'PASS'
          assert all(v == 'PASS' for v in r['checks'].values())
          routes = {row['asset_id']: row for row in r['request_routes']}
          assert os.environ['ASSET_ID'] in routes
          print('PROMPT_REPAIR_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install probe runner dependency
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile one-source probe runner
        run: python -m compileall -q modal_worker/tileset_regional_a5_prompt_probe.py

      - name: Run exactly one repaired source probe
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 480s \
            modal run modal_worker/tileset_regional_a5_prompt_probe.py --region "$REGION" --asset-id "$ASSET_ID" \
            | tee prompt-probe-paid.log

      - name: Assert one-source machine gate and no expansion
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          region = os.environ['REGION']
          asset_id = os.environ['ASSET_ID']
          material = asset_id.rsplit('.', 1)[-1]
          p = Path('tileset-regional-a5-prompt-probe') / region / material / 'report.json'
          assert p.is_file(), f'missing probe report: {p}'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_regional_a5_prompt_probe_report.v1'
          assert r['status'] == 'MACHINE_PASS_MANUAL_VISUAL_REQUIRED'
          assert r['region'] == region and r['asset_id'] == asset_id
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['generation_count'] == 1 and r['generation_retry_count'] == 0
          assert r['cross_region_generation_count'] == 0 and r['final_a5_generation_count'] == 0
          assert r['generation_attempts'] == 1
          assert r['machine_accepted'] is True and r['manual_visual_qa_required'] is True
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert r['source_size'] == [384, 384] and r['normalized_size'] == [48, 48]
          assert r['prior_failed_manual_visual_status'] == 'FAIL'
          assert r['raw_sha256'] != r['prior_failed_raw_sha256']
          print(f'PROMPT_REPAIR_PROBE_MACHINE_GATE={asset_id}=PASS_1_OF_1')
          print('MANUAL_VISUAL_QA_REQUIRED=true')
          print('COMPILE_AUTHORIZED=false')
          PY

      - name: Upload exact one-source probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-prompt-probe-${{ env.REGION }}-${{ github.run_id }}
          path: |
            prompt-probe-preflight.json
            prompt-probe-paid.log
            tileset-regional-a5-prompt-probe/${{ env.REGION }}/
          if-no-files-found: warn
          retention-days: 14
