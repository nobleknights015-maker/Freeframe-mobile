name: Deploy FreeFrame Modal Worker

on:
  workflow_dispatch:
    inputs:
      run_gpu_smoke_test:
        description: 'Generate one 512x512 FreeFrame smoke-test image after deploy'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: freeframe-modal-worker-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out isolated cloud worker branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile isolated worker before deployment
        run: python -m compileall -q modal_worker

      - name: Deploy isolated worker
        run: modal deploy --strategy recreate modal_worker/freeframe_worker.py

      - name: Run one controlled L4 GPU smoke test
        if: ${{ inputs.run_gpu_smoke_test }}
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://nobleknights015-maker--freeframe-worker-generate-image.us-east.modal.run'
          request='{"prompt":"original cozy fantasy JRPG meadow, small plush guardian beside wildflowers, clean game concept art, no text","negative_prompt":"text, watermark, malformed anatomy, extra limbs","width":512,"height":512,"steps":4,"guidance_scale":0.0,"seed":1842}'
          modal curl -sS -X POST "$endpoint" -H 'Content-Type: application/json' -d "$request" > freeframe-smoke-response.json
          python - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          payload = json.loads(Path('freeframe-smoke-response.json').read_text())
          raw = base64.b64decode(payload['image_base64'], validate=True)
          assert payload['mime_type'] == 'image/png'
          assert payload['width'] == 512 and payload['height'] == 512
          assert hashlib.sha256(raw).hexdigest() == payload['sha256']
          Path('freeframe-smoke.png').write_bytes(raw)
          summary = {k: payload[k] for k in ('model','seed','width','height','bytes','sha256','elapsed_seconds')}
          Path('freeframe-smoke-summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload GPU smoke-test result
        if: ${{ inputs.run_gpu_smoke_test }}
        uses: actions/upload-artifact@v4
        with:
          name: freeframe-first-gpu-smoke
          path: |
            freeframe-smoke.png
            freeframe-smoke-summary.json
          if-no-files-found: error
          retention-days: 7
