name: Build FreeFrame Rework APK

on:
  workflow_dispatch:
  push:
    branches: [freeframe-rework]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'freeframe_rework/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264"

      - name: Fetch pinned Local Diffusion engine host
        run: |
          git clone https://github.com/rmatif/Local-Diffusion.git app
          cd app
          git checkout 184b7f92cf2f810e7d5eb4b04b190a5da829005f

      - name: Replace upstream app layer with FreeFrame shell
        run: |
          rm -rf app/lib
          cp -R freeframe_rework/lib app/lib
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="local_diffusion"', 'android:label="FreeFrame"')
          text = text.replace('android:label="Local Diffusion"', 'android:label="FreeFrame"')
          if 'android:largeHeap=' not in text:
              text = text.replace('android:requestLegacyExternalStorage="true"', 'android:requestLegacyExternalStorage="true"\n        android:largeHeap="true"')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze FreeFrame shell
        working-directory: app
        run: flutter analyze lib

      - name: Build rework APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk FreeFrame-Rework-Dev.apk

      - name: Upload developer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFrame-Rework-Dev-APK
          path: FreeFrame-Rework-Dev.apk
          if-no-files-found: error
