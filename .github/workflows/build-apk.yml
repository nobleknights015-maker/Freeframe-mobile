name: Build FreeFrame Rework APK

on:
  workflow_dispatch:
  push:
    branches: [freeframe-rework]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'freeframe_rework/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264"

      - name: Fetch pinned Local Diffusion engine host
        run: |
          git clone https://github.com/rmatif/Local-Diffusion.git app
          cd app
          git checkout 184b7f92cf2f810e7d5eb4b04b190a5da829005f

      - name: Overlay FreeFrame app layer
        run: |
          cp freeframe_rework/lib/main.dart app/lib/main.dart
          mkdir -p app/lib/src
          cp -R freeframe_rework/lib/src/. app/lib/src/
          rm -rf app/test
          cp -R freeframe_rework/test app/test
          python3 freeframe_rework/engine_patch.py
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="local_diffusion"', 'android:label="FreeFrame"')
          text = text.replace('android:label="Local Diffusion"', 'android:label="FreeFrame"')
          if 'android:largeHeap=' not in text:
              text = text.replace('android:requestLegacyExternalStorage="true"', 'android:requestLegacyExternalStorage="true"\n        android:largeHeap="true"')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Verify shared native session patch
        run: |
          grep -q "case 'freeframeTxt2Img':" app/lib/img2img_processor.dart
          grep -q "Future<void> generateTextToImage" app/lib/img2img_processor.dart
          grep -q "Img2ImgProcessor" app/lib/src/model_session.dart
          grep -q "restoreDefaultModel" app/lib/src/model_session.dart
          grep -q "pickReference" app/lib/src/chat_screen.dart

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: FreeFrame regression cycle 1
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: FreeFrame regression cycle 2
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: FreeFrame regression cycle 3
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: Build rework APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk FreeFrame-Rework-Test.apk

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFrame-Rework-Test-APK
          path: FreeFrame-Rework-Test.apk
          if-no-files-found: error

  moto-g-sim:
    name: Moto G 4GB Android smoke test
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: FreeFrame-Rework-Test-APK
          path: sim-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Moto G class Android 15 / 4GB simulation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: |
            set -euo pipefail
            APK="sim-apk/FreeFrame-Rework-Test.apk"
            adb install -r "$APK"
            PACKAGE=$(aapt dump badging "$APK" | sed -n "s/package: name='\([^']*\)'.*/\1/p")
            echo "Testing package: $PACKAGE"

            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 4
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null

            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET

            tree = ET.parse('window.xml')
            nodes = list(tree.getroot().iter('node'))

            def center(node):
                b = node.attrib.get('bounds', '')
                m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', b)
                if not m:
                    raise SystemExit(f'No bounds for node: {node.attrib}')
                x1,y1,x2,y2 = map(int, m.groups())
                return (x1+x2)//2, (y1+y2)//2

            prompt = next((n for n in nodes if 'Describe what you want' in n.attrib.get('text','')), None)
            if prompt is None:
                prompt = next((n for n in nodes if n.attrib.get('class','').endswith('EditText')), None)
            if prompt is None:
                raise SystemExit('Prompt field not found in Android UI hierarchy')
            x,y = center(prompt)
            subprocess.run(['adb','shell','input','tap',str(x),str(y)], check=True)
            PY

            sleep 2
            adb shell dumpsys input_method > input_method.txt
            if ! grep -Eq 'mInputShown=true|isInputViewShown=true|mShowRequested=true' input_method.txt; then
              echo 'Keyboard did not become visible after tapping prompt field.'
              cat input_method.txt
              exit 1
            fi

            adb shell input text 'FreeFrameKeyboardTest'
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            grep -q 'FreeFrameKeyboardTest' window.xml || {
              echo 'Typed text was not retained in the prompt field.'
              exit 1
            }

            adb shell input keyevent 4
            sleep 1
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null

            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            tree = ET.parse('window.xml')
            nodes = list(tree.getroot().iter('node'))
            attach = next((n for n in nodes if n.attrib.get('content-desc') == 'Attach reference'), None)
            if attach is None:
                raise SystemExit('Attach reference button not found')
            b = attach.attrib['bounds']
            m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', b)
            x1,y1,x2,y2 = map(int, m.groups())
            subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)], check=True)
            PY

            sleep 2
            FOCUS=$(adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 1 || true)
            echo "Picker focus: $FOCUS"
            if echo "$FOCUS" | grep -q "$PACKAGE"; then
              echo 'Reference picker did not leave FreeFrame.'
              exit 1
            fi

            adb shell input keyevent 4
            sleep 1
            adb shell am send-trim-memory "$PACKAGE" RUNNING_LOW || true
            adb shell am send-trim-memory "$PACKAGE" MODERATE || true
            sleep 1

            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml window.xml >/dev/null
            python3 - <<'PY'
            import re, subprocess, xml.etree.ElementTree as ET
            tree = ET.parse('window.xml')
            nodes = list(tree.getroot().iter('node'))
            attach = next((n for n in nodes if n.attrib.get('content-desc') == 'Attach reference'), None)
            if attach is None:
                raise SystemExit('Attach reference button disappeared after memory trim')
            m = re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', attach.attrib['bounds'])
            x1,y1,x2,y2 = map(int, m.groups())
            subprocess.run(['adb','shell','input','tap',str((x1+x2)//2),str((y1+y2)//2)], check=True)
            PY
            sleep 2

            if ! adb shell pidof "$PACKAGE" >/dev/null; then
              echo 'FreeFrame process died after low-memory picker test.'
              exit 1
            fi
            echo 'Moto G class smoke test passed.'
