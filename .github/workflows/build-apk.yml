name: Build FreeFrame Rework APK

on:
  workflow_dispatch:
  push:
    branches: [freeframe-rework]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'freeframe_rework/**'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264"

      - name: Fetch pinned Local Diffusion engine host
        run: |
          git clone https://github.com/rmatif/Local-Diffusion.git app
          cd app
          git checkout 184b7f92cf2f810e7d5eb4b04b190a5da829005f

      - name: Overlay FreeFrame app layer
        run: |
          cp freeframe_rework/lib/main.dart app/lib/main.dart
          mkdir -p app/lib/src
          cp -R freeframe_rework/lib/src/. app/lib/src/
          rm -rf app/test
          cp -R freeframe_rework/test app/test
          python3 freeframe_rework/engine_patch.py
          python3 freeframe_rework/low_memory_384_patch.py
          python3 freeframe_rework/hybrid_cloud_patch.py
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="local_diffusion"', 'android:label="FreeFrame"')
          text = text.replace('android:label="Local Diffusion"', 'android:label="FreeFrame"')
          if 'android:largeHeap=' not in text:
              text = text.replace('android:requestLegacyExternalStorage="true"', 'android:requestLegacyExternalStorage="true"\n        android:largeHeap="true"')
          manifest.write_text(text, encoding='utf-8')
          PY

      - name: Verify shared native session patch
        run: |
          grep -q "case 'freeframeTxt2Img':" app/lib/img2img_processor.dart
          grep -q "Future<void> generateTextToImage" app/lib/img2img_processor.dart
          grep -q "Img2ImgProcessor" app/lib/src/model_session.dart
          grep -q "restoreDefaultModel" app/lib/src/model_session.dart
          grep -q "pickReference" app/lib/src/chat_screen.dart
          grep -q "width: 320" app/lib/src/chat_screen.dart
          grep -q "height: 320" app/lib/src/chat_screen.dart
          grep -q "this.width = 320" app/lib/src/model_session.dart
          grep -q "this.height = 320" app/lib/src/model_session.dart
          grep -q "this.steps = 12" app/lib/src/model_session.dart
          grep -q "maxSide: 320" app/lib/src/image_input.dart
          grep -q "useFlashAttention: true" app/lib/src/model_session.dart
          grep -q "CloudGateway" app/lib/src/chat_screen.dart
          grep -q "SegmentedButton<bool>" app/lib/src/chat_screen.dart
          grep -q "FREEFRAME_CLOUD_URL" app/lib/src/cloud_gateway.dart

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: FreeFrame regression cycle 1
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: FreeFrame regression cycle 2
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: FreeFrame regression cycle 3
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/src lib/img2img_processor.dart lib/ffi_bindings.dart lib/stable_diffusion_service.dart lib/sd_image.dart test
          flutter test

      - name: Build rework APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: cp app/build/app/outputs/flutter-apk/app-release.apk FreeFrame-Rework-Test.apk

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFrame-Rework-Test-APK
          path: FreeFrame-Rework-Test.apk
          if-no-files-found: error

  moto-g-sim:
    name: Moto G 4GB Android smoke test
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: FreeFrame-Rework-Test-APK
          path: sim-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Moto G class Android 15 / 4GB simulation
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 4096
          script: sh freeframe_rework/moto_g_smoke.sh

  moto-g-boosted-sim:
    name: Moto G boosted 12GB headroom comparison
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: FreeFrame-Rework-Test-APK
          path: sim-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 / 12GB headroom comparison
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          ram-size: 12288M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 12288
          script: |
            echo 'This is a generous upper-bound comparison for RAM Boost behavior; it is not a Motorola firmware-level emulation.'
            sh freeframe_rework/moto_g_smoke.sh
