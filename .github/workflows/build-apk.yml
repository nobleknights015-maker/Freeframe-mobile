name: Build FreeFrame Mobile APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'freeframe/**'
      - 'README.md'

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout FreeFrame repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable
          cache: true

      - name: Install required Android NDK with retry
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          rm -rf "$ANDROID_HOME/ndk/26.3.11579264"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          ok=0
          for attempt in 1 2 3; do
            echo "NDK install attempt $attempt"
            if "$SDKMANAGER" "ndk;26.3.11579264"; then
              ok=1
              break
            fi
            rm -rf "$ANDROID_HOME/ndk/26.3.11579264" "$HOME/.android/cache"
            sleep 15
          done
          if [ "$ok" -ne 1 ]; then
            echo "Failed to install Android NDK after retries"
            exit 1
          fi

      - name: Fetch Local Diffusion engine
        run: |
          git clone --depth 1 https://github.com/rmatif/Local-Diffusion.git app

      - name: Apply FreeFrame branding
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('app/android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text = text.replace('android:label="local_diffusion"', 'android:label="FreeFrame Mobile"')
          text = text.replace('android:label="Local Diffusion"', 'android:label="FreeFrame Mobile"')
          manifest.write_text(text, encoding='utf-8')

          pubspec = Path('app/pubspec.yaml')
          p = pubspec.read_text(encoding='utf-8')
          p = p.replace('description: "A new Flutter project."', 'description: "FreeFrame Mobile - local on-device image generation."')
          pubspec.write_text(p, encoding='utf-8')
          PY

      - name: Apply FreeFrame stability fixes
        run: python3 freeframe/patch_mobile.py

      - name: Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Rename APK
        run: |
          cp app/build/app/outputs/flutter-apk/app-release.apk FreeFrame-Mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeFrame-Mobile-APK
          path: FreeFrame-Mobile.apk
          if-no-files-found: error
