name: Plushbound Gloamfen A5 Attempt 4 Zero-GPU Renormalization

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_gloamfen_a5_attempt4_renormalize_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  renormalize-exact-attempt4-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate exact zero-GPU rescue trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_gloamfen_a5_attempt4_renormalize_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_gloamfen_a5_attempt4_renormalize_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'deterministic_renormalize_existing_source_zero_gpu'
          assert t['region'] == 'gloamfen'
          assert t['asset_id'] == 'tileset.gloamfen.a5.source.marsh_mud'
          assert t['source_run_id'] == 40713292000
          assert t['source_artifact_id'] == 12827271245
          assert t['source_artifact_sha256'] == '5f85c0b186aed404c77d5610a2ebe0aec4293c692f3b0afc06ce713a03c7d74b'
          assert t['raw_sha256'] == '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          assert t['old_normalized_sha256'] == '497ecba2b8fca5d346e0179ed7c1096783d23b997ad37b67ee9d4fb6c1c2b875'
          assert t['provider_calls_allowed'] == 0
          assert t['gpu_calls_allowed'] == 0
          assert t['generation_calls_allowed'] == 0
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          assert t['remaining_seven_generation_authorized'] is False
          assert t['catalog_wide_launch_authorized'] is False
          print('GLOAMFEN_ATTEMPT4_RENORMALIZE_TRIGGER=VALID_ZERO_GPU')
          PY

      - name: Download exact attempt 4 artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-prompt-probe-gloamfen-40713292000
          path: attempt4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40713292000

      - name: Verify exact source and re-normalize with current deterministic rule
        shell: bash
        run: |
          set -euo pipefail
          RAW='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/marsh_mud-384.png'
          OLD='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/marsh_mud-48.png'
          OLD_REPORT='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/report.json'
          test -f "$RAW" && test -f "$OLD" && test -f "$OLD_REPORT"
          test "$(sha256sum "$RAW" | awk '{print $1}')" = '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          test "$(sha256sum "$OLD" | awk '{print $1}')" = '497ecba2b8fca5d346e0179ed7c1096783d23b997ad37b67ee9d4fb6c1c2b875'
          mkdir -p rescued
          PYTHONPATH=. python modal_worker/tileset_source_normalizer.py \
            --source "$RAW" \
            --output rescued/marsh_mud-48.png \
            > rescued/normalizer-report.json
          cp "$RAW" rescued/marsh_mud-384.png
          cp "$OLD_REPORT" rescued/attempt4-original-report.json

      - name: Assert rescued tile preserves locked quality gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path('rescued/normalizer-report.json')
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['accepted'] is True
          assert r['input_size'] == [384, 384]
          assert r['output_size'] == [48, 48]
          assert r['output_mode'] == 'RGBA'
          assert r['source_rgb_stddev'] >= r['readability_rescue_min_source_rgb_stddev']
          assert r['readability_rescue_applied'] is True
          assert 1.0 < r['readability_contrast_factor'] <= r['readability_rescue_max_contrast'] <= 2.0
          assert r['rgb_stddev'] >= r['minimum_rgb_stddev'] == 3.0
          assert r['edge_discontinuity'] <= r['maximum_edge_discontinuity'] == 0.25
          raw = Path('rescued/marsh_mud-384.png').read_bytes()
          tile = Path('rescued/marsh_mud-48.png').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          evidence = {
              'schema': 'plushbound.tileset_gloamfen_a5_attempt4_renormalization_report.v1',
              'status': 'PASS_ZERO_GPU_MACHINE_GATE_MANUAL_VISUAL_REQUIRED',
              'region': 'gloamfen',
              'asset_id': 'tileset.gloamfen.a5.source.marsh_mud',
              'source_run_id': 40713292000,
              'source_artifact_id': 12827271245,
              'raw_sha256': hashlib.sha256(raw).hexdigest(),
              'rescued_normalized_sha256': hashlib.sha256(tile).hexdigest(),
              'provider_calls': 0,
              'gpu_calls': 0,
              'generation_calls': 0,
              'compile_authorized': False,
              'deterministic_finalize_authorized': False,
              'remaining_seven_generation_authorized': False,
              'catalog_wide_launch_authorized': False,
              'manual_visual_qa_required': True,
              'normalizer': r,
          }
          Path('rescued/renormalization-report.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          print('GLOAMFEN_ATTEMPT4_RENORMALIZATION=PASS_ZERO_GPU_MACHINE_GATE')
          print(f"RESCUED_NORMALIZED_SHA256={evidence['rescued_normalized_sha256']}")
          PY

      - name: Upload exact zero-GPU rescued evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-attempt4-renormalized-${{ github.run_id }}
          path: |
            modal_worker/tileset_gloamfen_a5_attempt4_renormalize_trigger.json
            rescued/
          if-no-files-found: error
          retention-days: 14
