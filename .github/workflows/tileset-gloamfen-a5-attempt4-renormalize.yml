name: Plushbound Gloamfen A5 Attempt 4 Zero-GPU Renormalization

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_gloamfen_a5_attempt4_renormalize_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  renormalize-exact-attempt4-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate exact zero-GPU rescue trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t = json.loads(Path('modal_worker/tileset_gloamfen_a5_attempt4_renormalize_trigger.json').read_text(encoding='utf-8'))
          assert t['schema'] == 'plushbound.tileset_gloamfen_a5_attempt4_renormalize_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'deterministic_renormalize_existing_source_zero_gpu'
          assert t['region'] == 'gloamfen'
          assert t['asset_id'] == 'tileset.gloamfen.a5.source.marsh_mud'
          assert t['source_run_id'] == 40713292000
          assert t['source_artifact_id'] == 12827271245
          assert t['source_artifact_sha256'] == '5f85c0b186aed404c77d5610a2ebe0aec4293c692f3b0afc06ce713a03c7d74b'
          assert t['raw_sha256'] == '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          assert t['old_normalized_sha256'] == '497ecba2b8fca5d346e0179ed7c1096783d23b997ad37b67ee9d4fb6c1c2b875'
          assert t['provider_calls_allowed'] == 0
          assert t['gpu_calls_allowed'] == 0
          assert t['generation_calls_allowed'] == 0
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          assert t['remaining_seven_generation_authorized'] is False
          assert t['catalog_wide_launch_authorized'] is False
          print('GLOAMFEN_ATTEMPT4_RENORMALIZE_TRIGGER=VALID_ZERO_GPU')
          PY

      - name: Download exact attempt 4 artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-prompt-probe-gloamfen-40713292000
          path: attempt4
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40713292000

      - name: Verify exact source and re-normalize with current deterministic rule
        shell: bash
        run: |
          set -euo pipefail
          RAW='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/marsh_mud-384.png'
          OLD='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/marsh_mud-48.png'
          OLD_REPORT='attempt4/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud/report.json'
          test -f "$RAW" && test -f "$OLD" && test -f "$OLD_REPORT"
          test "$(sha256sum "$RAW" | awk '{print $1}')" = '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          test "$(sha256sum "$OLD" | awk '{print $1}')" = '497ecba2b8fca5d346e0179ed7c1096783d23b997ad37b67ee9d4fb6c1c2b875'
          mkdir -p rescued
          PYTHONPATH=. python modal_worker/tileset_source_normalizer.py \
            --source "$RAW" \
            --output rescued/marsh_mud-48.png \
            > rescued/normalizer-report.json
          cp "$RAW" rescued/marsh_mud-384.png
          cp "$OLD_REPORT" rescued/attempt4-original-report.json

      - name: Assert rescued tile and build accepted-probe adapter
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path

          norm = json.loads(Path('rescued/normalizer-report.json').read_text(encoding='utf-8'))
          assert norm['accepted'] is True
          assert norm['input_size'] == [384, 384]
          assert norm['output_size'] == [48, 48]
          assert norm['output_mode'] == 'RGBA'
          assert norm['source_rgb_stddev'] >= norm['readability_rescue_min_source_rgb_stddev']
          assert norm['readability_rescue_applied'] is True
          assert 1.0 < norm['readability_contrast_factor'] <= norm['readability_rescue_max_contrast'] <= 2.0
          assert norm['rgb_stddev'] >= norm['minimum_rgb_stddev'] == 3.0
          assert norm['edge_discontinuity'] <= norm['maximum_edge_discontinuity'] == 0.25

          raw_path = Path('rescued/marsh_mud-384.png')
          tile_path = Path('rescued/marsh_mud-48.png')
          raw = raw_path.read_bytes()
          tile = tile_path.read_bytes()
          raw_sha = hashlib.sha256(raw).hexdigest()
          tile_sha = hashlib.sha256(tile).hexdigest()
          assert raw_sha == '8df77a999da3abfccb1a56b25693cdec10e4f4a658b2ce9fea1aff62e8a12877'
          assert tile_sha == 'bb121e2ca2e9b835882dab5ce3c0aee423f3aa7fea42fe65b49bc341e7222401'

          evidence = {
              'schema': 'plushbound.tileset_gloamfen_a5_attempt4_renormalization_report.v1',
              'status': 'PASS_ZERO_GPU_MACHINE_GATE_MANUAL_VISUAL_REQUIRED',
              'region': 'gloamfen',
              'asset_id': 'tileset.gloamfen.a5.source.marsh_mud',
              'source_run_id': 40713292000,
              'source_artifact_id': 12827271245,
              'raw_sha256': raw_sha,
              'rescued_normalized_sha256': tile_sha,
              'provider_calls': 0,
              'gpu_calls': 0,
              'generation_calls': 0,
              'compile_authorized': False,
              'deterministic_finalize_authorized': False,
              'remaining_seven_generation_authorized': False,
              'catalog_wide_launch_authorized': False,
              'manual_visual_qa_required': True,
              'normalizer': norm,
          }
          Path('rescued/renormalization-report.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')

          root = Path('accepted-probe/tileset-regional-a5-prompt-probe/gloamfen/marsh_mud')
          root.mkdir(parents=True, exist_ok=True)
          shutil.copy2(raw_path, root / 'marsh_mud-384.png')
          shutil.copy2(tile_path, root / 'marsh_mud-48.png')
          adapter = {
              'schema': 'plushbound.tileset_regional_a5_accepted_probe_adapter.v1',
              'status': 'MACHINE_PASS_MANUAL_VISUAL_REQUIRED_AFTER_ZERO_GPU_RENORMALIZATION',
              'asset_id': 'tileset.gloamfen.a5.source.marsh_mud',
              'region': 'gloamfen',
              'material_key': 'marsh_mud',
              'target_sheet_type': 'A5',
              'stable_sheet_id': 'tileset.gloamfen.a5',
              'prompt_contract_version': 'regional-a5-material-swatch-v2',
              'generation_attempts': 1,
              'source_size': [384, 384],
              'normalized_size': [48, 48],
              'raw_sha256': raw_sha,
              'normalized_sha256': tile_sha,
              'machine_accepted': True,
              'source_generation_machine_accepted': False,
              'deterministic_renormalization_machine_accepted': True,
              'manual_visual_qa_required': True,
              'source_generation_run_id': 40713292000,
              'source_generation_artifact_id': 12827271245,
              'renormalization_is_zero_gpu': True,
              'normalizer_metrics': norm,
              'compile_authorized': False,
              'deterministic_finalize_authorized': False,
              'catalog_wide_launch_authorized': False,
              'runtime_import_proof': False,
          }
          (root / 'report.json').write_text(json.dumps(adapter, indent=2, sort_keys=True), encoding='utf-8')
          evidence_root = Path('accepted-probe/evidence')
          evidence_root.mkdir(parents=True, exist_ok=True)
          shutil.copy2('rescued/normalizer-report.json', evidence_root / 'normalizer-report.json')
          shutil.copy2('rescued/renormalization-report.json', evidence_root / 'renormalization-report.json')
          shutil.copy2('rescued/attempt4-original-report.json', evidence_root / 'attempt4-original-report.json')
          print('GLOAMFEN_ACCEPTED_PROBE_ADAPTER=PASS_ZERO_GPU')
          print(f'ACCEPTED_RAW_SHA256={raw_sha}')
          print(f'ACCEPTED_NORMALIZED_SHA256={tile_sha}')
          PY

      - name: Upload strict accepted-probe adapter
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-accepted-probe-${{ github.run_id }}
          path: accepted-probe/
          if-no-files-found: error
          retention-days: 14
