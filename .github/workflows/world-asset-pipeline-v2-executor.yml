name: Plushbound World Asset Pipeline V2 Executor

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_asset_pipeline_v2_run_trigger.json'
      - 'modal_worker/world_asset_pipeline_v2_reference_runner.py'
      - 'modal_worker/world_asset_pipeline_v2_reference_conditioning.json'
      - 'modal_worker/project_references/**'
      - '.github/workflows/world-asset-pipeline-v2-executor.yml'

permissions:
  contents: read

concurrency:
  group: plushbound-world-asset-pipeline-v2-paid-executor
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    outputs:
      execute: ${{ steps.gate.outputs.execute }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install zero-spend validation dependencies
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'

      - name: Validate exact reference-aware V2 execution gate before credentials
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          from pathlib import Path

          from modal_worker.world_asset_pipeline_v2_planner import build_rows, paid_gate_open, validate_receiver_contract
          from modal_worker.world_asset_pipeline_v2_reference_runner import declaration_validation

          trigger = json.loads(Path('modal_worker/world_asset_pipeline_v2_run_trigger.json').read_text())
          freeze = json.loads(Path('modal_worker/world_asset_pipeline_v2_freeze.json').read_text())
          state = json.loads(Path('modal_worker/world_asset_pipeline_v2_state.json').read_text())

          assert trigger['schema'] == 'plushbound.world_asset_pipeline_v2_run_trigger.v1'
          assert trigger['mode'] == 'selected_ids_one_region'
          assert trigger['generation_attempts_per_requested_id_cap'] == 1
          assert trigger['one_region_only'] is True
          assert trigger['accepted_ids_must_be_excluded'] is True
          assert trigger['manual_visual_qa_required'] is True
          assert trigger['compile_authorized'] is False
          assert trigger['catalog_wide_launch_authorized'] is False
          assert trigger['runtime_import_proof'] is True
          assert state['catalog_wide_launch_authorized'] is False
          assert state['runtime_import_proof'] is True
          assert freeze['catalog_wide_launch_authorized'] is False
          assert freeze['runtime_import_proof'] is True
          assert freeze['accepted_assets_immutable'] is True
          assert freeze['missing_local_artifact_is_not_rerender_authority'] is True
          receiver = validate_receiver_contract(state_data=state, freeze_data=freeze)
          assert receiver['status'] == 'PASS_ENGINE_V1_RECEIVER_RUNTIME_CONTRACT'

          declaration = declaration_validation()
          assert declaration['status'] == 'PASS_ZERO_GPU_REFERENCE_AWARE_RUNNER_DECLARATION'
          assert declaration['failure_isolated_to_asset_id'] is True
          assert declaration['batch_art_rejection_does_not_abort_sibling_assets'] is True
          assert declaration['exact_requested_count_gate_required'] is True
          assert declaration['reference_sheet_pixels_used_as_runtime_art'] is False
          assert declaration['required_source_art_provenance'] == 'vera-modal-generated'

          execute = False
          if trigger['enabled']:
              region = trigger['region']
              ids = trigger['requested_source_ids']
              assert isinstance(region, str) and region
              assert isinstance(ids, list) and 1 <= len(ids) <= 8
              assert len(ids) == len(set(ids))
              rows, plan = build_rows(region, ids)
              assert [row['asset_id'] for row in rows] == ids
              assert not set(ids).intersection(plan['accepted_ids_excluded'])
              paid_gate_open(region, requested_count=len(ids))
              execute = True
          else:
              assert trigger['region'] is None
              assert trigger['requested_source_ids'] == []
              assert freeze['production_frozen'] is True
              assert freeze['paid_remote_execution_allowed'] is False
              assert state['production_frozen'] is True
              assert state['paid_execution_enabled'] is False
              assert state['active_paid_region'] is None

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f"execute={'true' if execute else 'false'}\n")
          print('WORLD_ASSET_V2_EXECUTOR_PREFLIGHT=' + ('AUTHORIZED' if execute else 'PASS_DISABLED_ZERO_SPEND'))
          PY

      - name: Record preflight evidence
        shell: bash
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import validate_receiver_contract
          from modal_worker.world_asset_pipeline_v2_reference_runner import declaration_validation
          receiver = validate_receiver_contract()
          declaration = declaration_validation()
          report = {
            'schema': 'plushbound.world_asset_pipeline_v2_executor_preflight.v2',
            'status': 'PASS',
            'credentials_exposed': False,
            'provider_calls': 0,
            'gpu_calls': 0,
            'generation_calls': 0,
            'compile_authorized': False,
            'catalog_wide_launch_authorized': False,
            'runtime_import_proof': True,
            'receiver_contract_status': receiver['status'],
            'reference_runner_status': declaration['status'],
            'reference_sheet_pixels_used_as_runtime_art': False,
            'required_source_art_provenance': 'vera-modal-generated',
          }
          Path('world-asset-v2-executor-preflight.json').write_text(json.dumps(report, sort_keys=True))
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-asset-v2-executor-preflight-${{ github.run_id }}
          path: world-asset-v2-executor-preflight.json
          if-no-files-found: error
          retention-days: 14

  execute:
    needs: preflight
    if: needs.preflight.outputs.execute == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local execution dependencies without credentials
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12' 'modal>=1.5,<2'

      - name: Revalidate scope immediately before paid execution
        id: paid_scope
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          import os
          from pathlib import Path
          from modal_worker.world_asset_pipeline_v2_planner import build_rows, paid_gate_open, validate_receiver_contract
          from modal_worker.world_asset_pipeline_v2_reference_runner import declaration_validation

          trigger = json.loads(Path('modal_worker/world_asset_pipeline_v2_run_trigger.json').read_text())
          assert trigger['enabled'] is True
          assert trigger['runtime_import_proof'] is True
          validate_receiver_contract()
          declaration = declaration_validation()
          assert declaration['status'] == 'PASS_ZERO_GPU_REFERENCE_AWARE_RUNNER_DECLARATION'
          region = trigger['region']
          ids = trigger['requested_source_ids']
          rows, plan = build_rows(region, ids)
          assert [row['asset_id'] for row in rows] == ids
          assert not set(ids).intersection(plan['accepted_ids_excluded'])
          paid_gate_open(region, requested_count=len(rows))

          out = Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a', encoding='utf-8') as fh:
              fh.write(f"region={region}\n")
              fh.write('ids_json=' + json.dumps(ids, separators=(',', ':')) + '\n')
          print(f'WORLD_ASSET_V2_PAID_SCOPE=PASS:{region}:{len(ids)}')
          PY

      - name: Deploy current Vera production worker
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          modal deploy --strategy recreate modal_worker/freeframe_worker.py

      - name: Run one bounded reference-aware V2 generation request
        shell: bash
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          REGION: ${{ steps.paid_scope.outputs.region }}
          IDS_JSON: ${{ steps.paid_scope.outputs.ids_json }}
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"
          test -n "${MODAL_TOKEN_SECRET:-}"
          timeout --signal=TERM --kill-after=30s 900s \
            env PYTHONPATH=. python -u modal_worker/world_asset_pipeline_v2_reference_runner.py \
              --region "$REGION" \
              --request-ids-json "$IDS_JSON"

      - name: Upload per-asset V2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-asset-v2-results-${{ github.run_id }}
          path: world-asset-pipeline-v2-output/
          if-no-files-found: warn
          retention-days: 14
