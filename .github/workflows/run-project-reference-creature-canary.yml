name: FreeFrame Project-Reference Creature Canary

on:
  workflow_dispatch:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/project_references/**'
      - 'modal_worker/plushbound_project_references.py'
      - 'modal_worker/project_reference_creature_canary.py'
      - 'modal_worker/creature_world_policy.py'
      - 'modal_worker/guardian_composition_policy.py'
      - 'modal_worker/production_presets.py'
      - 'modal_worker/production_request_builder.py'
      - 'modal_worker/production_style_policy.py'
      - 'modal_worker/style_profiles.py'
      - '.github/workflows/run-project-reference-creature-canary.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-project-reference-creature-canary
  cancel-in-progress: false

jobs:
  project-reference-creature-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile reference canary surface
        run: python -m compileall -q modal_worker
      - name: Verify project-owned reference hashes before GPU use
        run: |
          PYTHONPATH=. python - <<'PY'
          from modal_worker.plushbound_project_references import REFERENCES, get_project_reference
          assert set(REFERENCES) == {
              'guardian_friendly', 'guardian_corrupt', 'guardian_boss', 'enemy_creature'
          }
          for family in REFERENCES:
              ref = get_project_reference(family)
              assert ref.ownership == 'project_owned'
              assert ref.purpose == 'visual_conditioning_only'
              print(family, ref.sha256)
          PY
      - name: Run four-case project-reference canary in one L4 app
        run: modal run modal_worker/project_reference_creature_canary.py
      - name: Require all reference-conditioned outputs
        shell: bash
        run: |
          test -s project-reference-creature-canary/guardian_friendly_reference.png
          test -s project-reference-creature-canary/guardian_corrupt_reference.png
          test -s project-reference-creature-canary/guardian_boss_reference.png
          test -s project-reference-creature-canary/enemy_creature_reference.png
          test -s project-reference-creature-canary/report.json
      - name: Upload project-reference canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-reference-creature-canary-${{ github.run_id }}
          path: project-reference-creature-canary/
          if-no-files-found: warn
          retention-days: 7
