name: Vera Tideglass dry_sand Recovery V4

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - '.github/workflows/vera-tideglass-dry-sand-recovery-v4.yml'

permissions:
  contents: read

concurrency:
  group: plushbound-vera-tideglass-dry-sand-recovery-v4
  cancel-in-progress: false

jobs:
  dry-sand-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded production dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'

      - name: Zero-spend dry_sand recovery preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib
          from pathlib import Path
          from PIL import Image
          from modal_worker.world_asset_pipeline_v2_flux2_reference_batch import build_repair_rows,declaration_validation
          material='dry_sand'
          anchor=Path('modal_worker/project_references/tideglass_correction_round/dry_sand_reference_anchor_256.jpg')
          sheet_sha='ec305b5631fb47bc7c26af7d91d2b24e8a03e9ba399de22fc53b90a6e1c64566'
          anchor_sha=hashlib.sha256(anchor.read_bytes()).hexdigest(); assert anchor_sha != sheet_sha
          with Image.open(anchor) as im:
              im.load(); assert im.size==(256,256); assert im.format=='JPEG'
          asset='tileset.tideglass-coast.a5.source.dry_sand'
          rows,superseded=build_repair_rows('tideglass-coast',[asset])
          assert len(rows)==1 and rows[0]['asset_id']==asset and superseded==[]
          d=declaration_validation(); assert d['status']=='PASS_ZERO_GPU_CORRECTED_REFERENCE_REPAIR_DECLARATION'
          assert d['required_source_art_provenance']=='vera-modal-generated'
          assert d['reference_sheet_pixels_used_as_runtime_art'] is False
          assert d['compile_authorized'] is False and d['catalog_wide_launch_authorized'] is False
          print('DRY_SAND_RECOVERY_PREFLIGHT=PASS')
          PY

      - name: Deploy dedicated Vera FLUX2 reference worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MODAL_TOKEN_ID:-}"; test -n "${MODAL_TOKEN_SECRET:-}"
          modal deploy --strategy recreate modal_worker/freeframe_flux2_reference_worker.py

      - name: Generate dry_sand only through Vera with extended watchdog
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          cfg_path=Path('modal_worker/world_asset_pipeline_v2_reference_conditioning.json')
          auth_path=Path('modal_worker/world_asset_pipeline_v2_paid_authorization.json')
          original=cfg_path.read_text(encoding='utf-8')
          anchor_path='modal_worker/project_references/tideglass_correction_round/dry_sand_reference_anchor_256.jpg'
          anchor_sha=hashlib.sha256(Path(anchor_path).read_bytes()).hexdigest()
          sheet_sha='ec305b5631fb47bc7c26af7d91d2b24e8a03e9ba399de22fc53b90a6e1c64566'
          try:
              cfg=json.loads(original); reg=cfg['regions']['tideglass-coast']
              reg['anchor_path']=anchor_path; reg['anchor_sha256']=anchor_sha
              reg['reference_role']='material_specific_correction_visual_authority_only'
              reg['source_reference_hashes']={'correction_material':'dry_sand','correction_reference_sheet_sha256':sheet_sha,'correction_anchor_sha256':anchor_sha}
              cfg_path.write_text(json.dumps(cfg,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              auth={'schema':'plushbound.world_asset_pipeline_v2_paid_authorization.v1','enabled':True,'region':'tideglass-coast','provider_calls_allowed':1,'gpu_calls_allowed':1,'generation_calls_allowed':1,'reference_aware_runner_required':True,'required_source_art_provenance':'vera-modal-generated','reference_sheet_pixels_used_as_runtime_art':False,'manual_visual_qa_required':True,'compile_authorized':False,'catalog_wide_launch_authorized':False,'validated_reference_preflight_run_id':40789252831,'purpose':'Isolated dry_sand timeout recovery only.'}
              auth_path.write_text(json.dumps(auth,indent=2,sort_keys=True)+'\n',encoding='utf-8')
              subprocess.run(['python','-u','modal_worker/world_asset_pipeline_v2_flux2_reference_batch.py','--region','tideglass-coast','--request-ids-json','["tileset.tideglass-coast.a5.source.dry_sand"]'],check=True,timeout=1500)
          finally:
              cfg_path.write_text(original,encoding='utf-8')
          PY

      - name: Verify dry_sand receipt and Vera provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('world-asset-pipeline-v2-output/tideglass-coast')
          report=json.loads((root/'batch-report.json').read_text())
          assert report['requested_count']==1 and report['generation_count']==1 and report['generation_retry_count']==0
          assert report['source_art_provenance']=='vera-modal-generated'
          assert report['reference_sheet_pixels_used_as_runtime_art'] is False
          assert report['compile_authorized'] is False and report['catalog_wide_launch_authorized'] is False
          row=report['outputs'][0]
          assert row['asset_id']=='tileset.tideglass-coast.a5.source.dry_sand'
          assert row['source_generation_proof']['producer']=='vera-modal'
          if row['machine_gate']=='PASS':
              raw=Path(row['raw_path']).read_bytes(); assert hashlib.sha256(raw).hexdigest()==row['raw_sha256']
          print(json.dumps({'asset_id':row['asset_id'],'machine_gate':row['machine_gate'],'execution_outcome':row['execution_outcome'],'gpu_seconds':row.get('gpu_seconds',0),'compile_authorized':False},sort_keys=True))
          PY

      - name: Upload dry_sand recovery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-tideglass-dry-sand-recovery-v4-${{ github.run_id }}
          path: world-asset-pipeline-v2-output/tideglass-coast/
          if-no-files-found: warn
          retention-days: 14
