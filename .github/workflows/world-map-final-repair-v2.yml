name: Plushbound World Maps Targeted Repair V2

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_map_final_repair_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-map-final-paid-canary
  cancel-in-progress: false

jobs:
  targeted-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run no-spend gate at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/world_map_final_preflight.py > world-map-repair-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('world-map-repair-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND'
          assert r['production_skipped'] is True
          assert r['generation_calls'] == 0
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Validate manual QA quarantine and repair trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('modal_worker/world_map_final_canary_manual_qa.json').read_text(encoding='utf-8'))
          trigger = json.loads(Path('modal_worker/world_map_final_repair_trigger.json').read_text(encoding='utf-8'))
          assert qa['source_run_id'] == 40619802387
          assert qa['manual_visual_gate'] == 'QUARANTINE_6_OF_8'
          assert qa['scaling_authorized'] is False
          accepted = {a['asset_id'] for a in qa['accepted_and_banked']}
          quarantined = {a['asset_id'] for a in qa['quarantined_for_targeted_repair']}
          assert len(accepted) == 2
          assert len(quarantined) == 6
          assert accepted.isdisjoint(quarantined)
          assert trigger['schema'] == 'plushbound.world_map_final_repair_trigger.v1'
          assert trigger['enabled'] is True
          assert trigger['mode'] == 'targeted_repair_v2'
          assert trigger['asset_cap'] == 6
          assert set(trigger['asset_ids']) == quarantined
          assert trigger['preserve_accepted_asset_ids'] is True
          assert trigger['never_stack_paid_runs'] is True
          assert trigger['catalog_wide_launch_authorized'] is False
          assert trigger['creator_full_outfits_remain_closed_at'] == 24
          print('TARGETED_REPAIR_TRIGGER=VALID_6_ONLY')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile targeted repair producer
        run: python -m compileall -q modal_worker/world_map_final_production.py

      - name: Run only the six quarantined world assets
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/world_map_final_production.py --mode repair-v2 --limit 6 | tee world-map-final-repair-v2.log

      - name: Verify repair report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('world-map-final-repair-v2/report.json')
          assert p.is_file(), 'missing targeted repair report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.world_map_final_bounded_wave_report.v1'
          assert r['wave_mode'] == 'repair-v2'
          assert r['requested_count'] == 6
          assert r['accepted_count'] == 6
          assert r['quarantined_count'] == 0
          assert r['catalog_wide_launch_authorized'] is False
          assets = r['assets']
          assert len(assets) == 6
          assert len({a['asset_id'] for a in assets}) == 6
          assert len({a['sha256'] for a in assets}) == 6
          assert all(a['region'] not in {'gloamfen', 'sunspool-desert'} for a in assets)
          assert all(a['width'] == 1024 and a['height'] == 768 for a in assets)
          assert all(a['inspection']['accepted'] is True for a in assets)
          print('WORLD_MAP_TARGETED_REPAIR=PASS_6_OF_6_DETERMINISTIC')
          PY

      - name: Upload repair products and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-map-final-repair-v2-${{ github.run_id }}
          path: |
            world-map-repair-preflight.json
            world-map-final-repair-v2.log
            world-map-final-repair-v2/
          if-no-files-found: warn
          retention-days: 14
