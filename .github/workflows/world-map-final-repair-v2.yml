name: Plushbound World Maps Two-Region Baseline Completion

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_map_final_repair_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-map-final-paid-canary
  cancel-in-progress: false

jobs:
  baseline-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run no-spend gate at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/world_map_final_preflight.py > world-map-baseline-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('world-map-baseline-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND'
          assert r['production_skipped'] is True
          assert r['paid_remote_execution_skipped'] is True
          assert r['generation_calls'] == 0
          assert r['gpu_calls'] == 0
          assert r['provider_calls'] == 0
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Validate 8-of-8 closeout and exact two-region trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          closeout = json.loads(Path('modal_worker/world_map_final_canary_closeout.json').read_text(encoding='utf-8'))
          trigger = json.loads(Path('modal_worker/world_map_final_repair_trigger.json').read_text(encoding='utf-8'))
          assert closeout['status'] == 'CANARY_CLOSED_PASS_8_OF_8'
          assert closeout['manual_visual_gate'] == 'PASS_8_OF_8'
          assert closeout['accepted_count'] == 8
          assert closeout['quarantined_count'] == 0
          assert closeout['protected_from_rerender'] is True
          protected = {a['asset_id'] for a in closeout['accepted_assets']}
          remaining = set(closeout['remaining_canonical_region_baseline'])
          assert len(protected) == 8
          assert remaining == {
              'world.cinderreach.environment_master',
              'world.frostlace.environment_master',
          }
          assert protected.isdisjoint(remaining)
          assert trigger['schema'] == 'plushbound.world_map_final_repair_trigger.v1'
          assert trigger['enabled'] is True
          assert trigger['mode'] == 'baseline_completion_two_regions'
          assert trigger['asset_cap'] == 2
          assert set(trigger['asset_ids']) == remaining
          assert set(trigger['accepted_asset_ids_not_to_regenerate']) == protected
          assert trigger['preflight_run_id'] == 40622878364
          assert trigger['preflight_conclusion'] == 'success'
          assert trigger['never_stack_paid_runs'] is True
          assert trigger['catalog_wide_launch_authorized'] is False
          assert trigger['creator_full_outfits_remain_closed_at'] == 24
          print('WORLD_BASELINE_TRIGGER=VALID_EXACT_2')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile exact two-region producer
        run: python -m compileall -q modal_worker/world_map_final_baseline_completion.py

      - name: Run only Cinderreach and Frostlace baseline masters
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/world_map_final_baseline_completion.py | tee world-map-baseline-completion.log

      - name: Verify baseline completion report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('world-map-baseline-completion/report.json')
          assert p.is_file(), 'missing baseline completion report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.world_map_baseline_completion_report.v1'
          assert r['version'] == 'plushbound-world-map-baseline-completion-v1'
          assert r['wave_mode'] == 'baseline-completion'
          assert r['requested_count'] == 2
          assert r['accepted_count'] == 2
          assert r['quarantined_count'] == 0
          assert r['catalog_wide_launch_authorized'] is False
          assets = r['assets']
          assert {a['asset_id'] for a in assets} == {
              'world.cinderreach.environment_master',
              'world.frostlace.environment_master',
          }
          assert len({a['sha256'] for a in assets}) == 2
          assert all(a['width'] == 1024 and a['height'] == 768 for a in assets)
          assert all(a['inspection']['accepted'] is True for a in assets)
          print('WORLD_BASELINE_COMPLETION=PASS_2_OF_2_DETERMINISTIC')
          PY

      - name: Upload baseline completion products and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-map-baseline-completion-${{ github.run_id }}
          path: |
            world-map-baseline-preflight.json
            world-map-baseline-completion.log
            world-map-baseline-completion/
          if-no-files-found: warn
          retention-days: 14
