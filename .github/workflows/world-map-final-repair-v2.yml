name: Plushbound Tileset Source Straw Repair

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_map_final_repair_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-tileset-source-paid-canary
  cancel-in-progress: false

jobs:
  tileset-straw-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic preflight dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Re-run tileset source no-spend gate at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_source_canary_preflight.py > tileset-straw-repair-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('tileset-straw-repair-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_SOURCE_CANARY_NOT_TRIGGERED'
          assert r['production_skipped'] is True
          assert r['paid_remote_execution_skipped'] is True
          assert r['provider_calls'] == 0 and r['gpu_calls'] == 0 and r['generation_calls'] == 0
          assert r['source_count'] == 8
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_TILESET_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Validate seven-source bank and exact straw repair trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('modal_worker/tileset_source_canary_manual_qa.json').read_text(encoding='utf-8'))
          t = json.loads(Path('modal_worker/world_map_final_repair_trigger.json').read_text(encoding='utf-8'))
          assert qa['source_run_id'] == 40625079420
          assert qa['source_artifact_id'] == 12788983716
          assert qa['machine_gate'] == 'PASS_7_OF_8_ONE_NORMALIZATION_QUARANTINE'
          assert qa['manual_visual_gate'] == 'PASS_7_OF_8_ONE_TARGETED_REPAIR'
          assert len(qa['accepted_and_banked']) == 7
          failed = qa['quarantined_for_targeted_repair']['asset_id']
          assert failed == 'tileset.elyndor.a5.source.straw_thatch'
          assert t['schema'] == 'plushbound.tileset_source_repair_trigger.v1'
          assert t['enabled'] is True
          assert t['mode'] == 'elyndor_a5_straw_thatch_repair'
          assert t['asset_cap'] == 1 and t['generation_cap'] == 1 and t['retry_generation_cap'] == 0
          assert t['asset_ids'] == [failed]
          assert t['preserve_accepted_source_ids'] is True
          assert t['source_canary_run_id'] == 40625079420
          assert t['source_canary_artifact_id'] == 12788983716
          assert t['full_A5_expansion_authorized'] is False
          assert t['cross_region_expansion_authorized'] is False
          assert t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['creator_full_outfits_remain_closed_at'] == 24
          print('TILESET_STRAW_REPAIR_TRIGGER=VALID_EXACT_1')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile one-asset repair producer
        run: python -m compileall -q modal_worker/tileset_source_straw_repair.py

      - name: Run only quarantined straw-thatch source
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/tileset_source_straw_repair.py | tee tileset-source-straw-repair.log

      - name: Verify targeted repair report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tileset-source-straw-repair/report.json')
          assert p.is_file(), 'missing targeted straw repair report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_source_targeted_repair_report.v1'
          assert r['version'] == 'plushbound-tileset-source-straw-repair-v1'
          assert r['asset_id'] == 'tileset.elyndor.a5.source.straw_thatch'
          assert r['generation_count'] == 1 and r['generation_retry_count'] == 0
          assert r['raw_inspection']['accepted'] is True
          assert r['normalizer_accepted'] is True
          assert r['accepted'] is True and r['quarantined'] is False
          assert r['rgb_stddev'] >= r['minimum_rgb_stddev']
          assert r['edge_discontinuity'] <= r['maximum_edge_discontinuity']
          assert r['full_A5_expansion_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          print('TILESET_STRAW_REPAIR=PASS_1_OF_1_DETERMINISTIC')
          PY

      - name: Upload repair product and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-tileset-source-straw-repair-${{ github.run_id }}
          path: |
            tileset-straw-repair-preflight.json
            tileset-source-straw-repair.log
            tileset-source-straw-repair/
          if-no-files-found: warn
          retention-days: 14
