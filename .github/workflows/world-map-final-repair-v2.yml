name: Plushbound World Maps Targeted Repair V5

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/world_map_final_repair_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-world-map-final-paid-canary
  cancel-in-progress: false

jobs:
  targeted-repair-v5:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Re-run no-spend gate at current HEAD
        env:
          PLUSHBOUND_PRODUCTION_ENABLED: '0'
          PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/world_map_final_preflight.py > world-map-repair-v5-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('world-map-repair-v5-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND'
          assert r['production_skipped'] is True
          assert r['generation_calls'] == 0
          assert all(v == 'PASS' for v in r['checks'].values())
          print('CURRENT_HEAD_PREFLIGHT=PASS_NO_SPEND')
          PY

      - name: Validate V4 manual QA and V5 trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          qa = json.loads(Path('modal_worker/world_map_final_repair_v4_manual_qa.json').read_text(encoding='utf-8'))
          trigger = json.loads(Path('modal_worker/world_map_final_repair_trigger.json').read_text(encoding='utf-8'))
          assert qa['source_run_id'] == 40621975556
          assert qa['source_artifact_id'] == 12787423689
          assert qa['machine_gate'] == 'PASS_2_OF_2'
          assert qa['manual_visual_gate'] == 'QUARANTINE_1_OF_2'
          assert qa['scaling_authorized'] is False
          accepted = set(qa['logical_canary_state_after_v4']['accepted_asset_ids'])
          quarantine = set(qa['logical_canary_state_after_v4']['repair_v5_asset_ids'])
          assert len(accepted) == 7
          assert quarantine == {'world.silkspire.environment_master'}
          assert accepted.isdisjoint(quarantine)
          assert trigger['schema'] == 'plushbound.world_map_final_repair_trigger.v1'
          assert trigger['enabled'] is True
          assert trigger['mode'] == 'targeted_repair_v5'
          assert trigger['asset_cap'] == 1
          assert set(trigger['asset_ids']) == quarantine
          assert trigger['preserve_accepted_asset_ids'] is True
          assert trigger['never_stack_paid_runs'] is True
          assert trigger['catalog_wide_launch_authorized'] is False
          assert trigger['creator_full_outfits_remain_closed_at'] == 24
          print('TARGETED_REPAIR_V5_TRIGGER=VALID_1_ONLY')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile Silkspire V5 producer
        run: python -m compileall -q modal_worker/world_map_final_silkspire_repair_v5.py

      - name: Run only the final Silkspire repair
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/world_map_final_silkspire_repair_v5.py | tee world-map-final-repair-v5.log

      - name: Verify Repair V5 report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('world-map-final-repair-v5/report.json')
          assert p.is_file(), 'missing Repair V5 report'
          r = json.loads(p.read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.world_map_final_silkspire_repair_v5_report.v1'
          assert r['version'] == 'plushbound-world-map-final-repair-v5-silkspire-distant-structure'
          assert r['wave_mode'] == 'repair-v5'
          assert r['requested_count'] == 1
          assert r['accepted_count'] == 1
          assert r['quarantined_count'] == 0
          assert r['catalog_wide_launch_authorized'] is False
          a = r['asset']
          assert a['asset_id'] == 'world.silkspire.environment_master'
          assert a['width'] == 1024 and a['height'] == 768
          assert a['inspection']['accepted'] is True
          print('WORLD_MAP_TARGETED_REPAIR_V5=PASS_1_OF_1_DETERMINISTIC')
          PY

      - name: Upload Repair V5 products and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-world-map-final-repair-v5-${{ github.run_id }}
          path: |
            world-map-repair-v5-preflight.json
            world-map-final-repair-v5.log
            world-map-final-repair-v5/
          if-no-files-found: warn
          retention-days: 14
