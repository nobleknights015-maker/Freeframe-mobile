name: Plushbound Silkspire A5 Paid Candidate Preflight

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_silkspire_a5_paid_candidate.json'
      - '.github/workflows/tileset-silkspire-a5-paid-candidate-preflight.yml'

permissions:
  contents: read

jobs:
  validate-disabled-silkspire-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
      REGION: silkspire
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic dependency only
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'
      - name: Validate disabled candidate against locked scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('modal_worker/tileset_silkspire_a5_paid_candidate.json').read_text(encoding='utf-8'))
          s = json.loads(Path('modal_worker/tileset_regional_a5_scope_manifest.json').read_text(encoding='utf-8'))
          assert c['schema'] == 'plushbound.tileset_regional_a5_paid_candidate.v1'
          assert c['enabled'] is False
          assert c['region'] == 'silkspire'
          assert c['stable_sheet_id'] == 'tileset.silkspire.a5'
          assert c['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert c['asset_cap'] == 8
          assert c['generation_attempts_per_asset_cap'] == 1
          assert c['one_region_only'] is True
          assert c['never_stack_paid_runs'] is True
          assert c['manual_visual_qa_required'] is True
          assert c['compile_authorized'] is False
          assert c['deterministic_finalize_authorized'] is False
          assert c['catalog_wide_launch_authorized'] is False
          r = s['regions']['silkspire']
          assert r['status'] == 'PREFLIGHT_PENDING'
          assert r['stable_sheet_id'] == c['stable_sheet_id']
          expected = [f"tileset.silkspire.a5.source.{m}" for m in r['materials']]
          assert c['source_asset_ids'] == expected
          assert len(expected) == 8 and len(set(expected)) == 8
          assert s['source_contract']['prompt_contract_version'] == c['prompt_contract_version']
          assert s['spend_gate']['catalog_wide_launch_authorized'] is False
          assert s['spend_gate']['never_stack_paid_runs'] is True
          print('SILKSPIRE_CANDIDATE_SCOPE=PASS_DISABLED')
          PY
      - name: Re-run current-head regional no-spend preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_preflight.py --region "$REGION" > silkspire-current-head-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('silkspire-current-head-preflight.json').read_text(encoding='utf-8'))
          assert r['status'] == 'PASS_NO_SPEND_REGION_A5_READY_FOR_EXPLICIT_BOUNDED_TRIGGER'
          assert r['region'] == 'silkspire'
          assert r['region_state'] == 'PREFLIGHT_PENDING'
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['production_skipped'] is True
          assert r['paid_remote_execution_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['automatic_paid_execution_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert r['checks']['material_swatch_prompt_static_lint'] == 'PASS'
          assert r['checks']['rendered_prompt_anti_scene_contract'] == 'PASS'
          assert all(v == 'PASS' for v in r['checks'].values())
          print('SILKSPIRE_PAID_CANDIDATE=READY_DISABLED_NO_SPEND')
          PY
      - name: Upload no-spend candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-silkspire-paid-candidate-${{ github.run_id }}
          path: silkspire-current-head-preflight.json
          if-no-files-found: warn
          retention-days: 14
