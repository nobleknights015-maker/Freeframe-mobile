name: Vera Creature Conditioning Smoke

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/creature_smoke_trigger.json'

permissions:
  contents: read

concurrency:
  group: vera-creature-conditioning-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install smoke dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Compile smoke surface
        run: python -m compileall -q modal_worker
      - name: Run two-image creature smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m modal_worker.creature_smoke_direct | tee creature-smoke.log
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vera-creature-smoke-${{ github.run_id }}
          path: |
            creature-smoke.log
            creature-smoke-output/
          if-no-files-found: warn
          retention-days: 14
