name: Plushbound Regional A5 Final One-Source Repair

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_regional_a5_single_remaining_repair_trigger.json'

permissions:
  contents: read
  actions: read

concurrency:
  group: plushbound-regional-a5-paid
  cancel-in-progress: false

jobs:
  final-one-source-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate final one-source trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('modal_worker/tileset_regional_a5_single_remaining_repair_trigger.json').read_text(encoding='utf-8'))
          assert t['schema']=='plushbound.tileset_regional_a5_single_remaining_repair_trigger.v1'
          assert t['enabled'] is True
          assert t['mode']=='final_one_source_after_7_of_8_accepted'
          assert t['region']=='gloamfen'
          assert t['asset_id']=='tileset.gloamfen.a5.source.reed_matting'
          assert t['accepted_source_count']==7 and t['remaining_source_count']==1
          assert t['asset_cap']==1 and t['generation_attempts_per_asset_cap']==1
          assert t['accepted_source_ids_immutable'] is True
          assert t['one_region_only'] is True and t['never_stack_paid_runs'] is True
          assert t['catalog_wide_launch_authorized'] is False
          assert t['compile_authorized'] is False and t['deterministic_finalize_authorized'] is False
          p=Path(t['partial_acceptance_path'])
          assert p.is_file()
          partial=json.loads(p.read_text(encoding='utf-8'))
          assert partial['schema']=='plushbound.tileset_regional_a5_partial_acceptance_7_of_8.v1'
          assert partial['status']=='PARTIAL_ACCEPTANCE_7_OF_8_REED_MATTING_ONLY_REMAINS'
          assert partial['accepted_source_count']==7 and partial['remaining_failed_source_count']==1
          assert partial['remaining_failed_source_ids']==[t['asset_id']]
          Path('single-region.txt').write_text(t['region'],encoding='utf-8')
          Path('accepted-run.txt').write_text(str(t['accepted_seven_run_id']),encoding='utf-8')
          Path('accepted-name.txt').write_text(t['accepted_seven_artifact_name'],encoding='utf-8')
          print('FINAL_ONE_SOURCE_TRIGGER=VALID_REED_MATTING_ONLY')
          PY
          echo "REGION=$(cat single-region.txt)" >> "$GITHUB_ENV"
          echo "ACCEPTED_SEVEN_RUN_ID=$(cat accepted-run.txt)" >> "$GITHUB_ENV"
          echo "ACCEPTED_SEVEN_ARTIFACT_NAME=$(cat accepted-name.txt)" >> "$GITHUB_ENV"

      - name: Download exact seven-accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ACCEPTED_SEVEN_ARTIFACT_NAME }}
          path: accepted-seven-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ACCEPTED_SEVEN_RUN_ID }}

      - name: Verify seven accepted IDs and reed exclusion before GPU
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          t=json.loads(Path('modal_worker/tileset_regional_a5_single_remaining_repair_trigger.json').read_text(encoding='utf-8'))
          manifest=Path('accepted-seven-artifact/accepted-seven/gloamfen/manifest.json')
          assert manifest.is_file()
          m=json.loads(manifest.read_text(encoding='utf-8'))
          assert m['status']=='PARTIAL_ACCEPTANCE_7_OF_8_REED_MATTING_ONLY_REMAINS'
          assert m['accepted_source_count']==7 and m['remaining_failed_source_count']==1
          assert m['remaining_failed_source_ids']==[t['asset_id']]
          accepted={row['asset_id']:row for row in m['accepted_sources']}
          assert len(accepted)==7 and t['asset_id'] not in accepted
          root=Path('accepted-seven-artifact/accepted-seven/gloamfen')
          for row in accepted.values():
              mat=row['material_key']
              assert hashlib.sha256((root/'raw'/f'{mat}-384.png').read_bytes()).hexdigest()==row['raw_sha256']
              assert hashlib.sha256((root/'normalized'/f'{mat}-48.png').read_bytes()).hexdigest()==row['normalized_sha256']
          print('ACCEPTED_SEVEN_HASH_LOCK=PASS_REED_EXCLUDED')
          PY

      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }

      - name: Install Modal dependency
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'

      - name: Compile final one-source runner
        run: python -m compileall -q modal_worker/tileset_regional_a5_single_remaining_repair.py

      - name: Generate exactly reed matting once
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 480s \
            modal run modal_worker/tileset_regional_a5_single_remaining_repair.py --region "$REGION" \
            | tee single-remaining-paid.log

      - name: Assert machine gate and no accepted rerender
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('tileset-regional-a5-single-remaining-repair/gloamfen/reed_matting/report.json')
          assert p.is_file()
          r=json.loads(p.read_text(encoding='utf-8'))
          assert r['schema']=='plushbound.tileset_regional_a5_single_remaining_repair_report.v1'
          assert r['asset_id']=='tileset.gloamfen.a5.source.reed_matting'
          assert r['generation_count']==1 and r['generation_retry_count']==0 and r['generation_attempts']==1
          assert len(r['accepted_source_ids_excluded'])==7 and r['asset_id'] not in r['accepted_source_ids_excluded']
          assert r['machine_accepted'] is True
          assert r['cross_region_generation_count']==0 and r['final_a5_generation_count']==0
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False and r['runtime_import_proof'] is False
          print('FINAL_ONE_SOURCE_MACHINE_GATE=PASS_REED_MATTING_MANUAL_QA_REQUIRED')
          PY

      - name: Upload final one-source QA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-final-one-source-${{ github.run_id }}
          path: |
            single-remaining-paid.log
            tileset-regional-a5-single-remaining-repair/gloamfen/
          if-no-files-found: warn
          retention-days: 14
