name: FreeFrame Klein 32-Asset Rehearsal

on:
  workflow_dispatch:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/klein_rehearsal_32.py'
      - '.github/workflows/run-klein-rehearsal-32.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-klein-rehearsal-32
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile rehearsal surface
        run: python -m compileall -q modal_worker
      - name: Run bounded 32-asset Klein rehearsal
        shell: bash
        run: |
          set -o pipefail
          modal run modal_worker/klein_rehearsal_32.py | tee klein-rehearsal-32.log
      - name: Upload rehearsal products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: klein-rehearsal-32-${{ github.run_id }}
          path: |
            klein-rehearsal-32.log
            klein-rehearsal-32/
          if-no-files-found: warn
          retention-days: 7
