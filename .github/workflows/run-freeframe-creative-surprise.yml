name: Start FreeFrame Creative Surprise Test

on:
  workflow_dispatch:
    inputs:
      start_creative_surprise:
        description: 'START bounded one-image creative capability test'
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - '.github/freeframe/creative-surprise-trigger.txt'

permissions:
  contents: read

concurrency:
  group: freeframe-creative-surprise-v1
  cancel-in-progress: true

jobs:
  creative-surprise:
    if: ${{ github.event_name == 'push' || inputs.start_creative_surprise }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out isolated cloud worker branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Deploy current isolated worker
        run: modal deploy --strategy recreate modal_worker/freeframe_worker.py
      - name: Generate bounded adult non-explicit creative sample
        shell: bash
        run: |
          set -euo pipefail
          python -u - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          import modal

          request = {
              'prompt': (
                  'Plushbound Legends style, warm handcrafted fantasy JRPG, painterly anime-inspired game art, '
                  'clearly adult woman age 25, elegant violet and black fantasy lingerie-inspired outfit, thigh-high stockings, '
                  'tasteful exposed skin, playful confident expression, sitting casually on the edge of a luxurious fantasy inn bed, '
                  'warm candlelight, soft nighttime atmosphere, slightly tousled hair, sophisticated pin-up composition, '
                  'non-explicit sensual boudoir mood, normal anatomy, natural hands, one person only, polished illustration'
              ),
              'negative_prompt': (
                  'minor, child, teen, explicit nudity, exposed nipples, exposed genitals, sex act, pornographic, '
                  'extra limbs, extra fingers, malformed hands, duplicate person, multiple views, split panel, text, watermark'
              ),
              'width': 768,
              'height': 1024,
              'steps': 28,
              'guidance_scale': 6.0,
              'seed': 110625,
          }

          out = Path('freeframe-creative-surprise'); out.mkdir(exist_ok=True)
          generator = modal.Cls.from_name('freeframe-worker', 'FreeFrameGenerator')()
          result = generator.generate.remote(request)
          raw = base64.b64decode(result['image_base64'], validate=True)
          assert hashlib.sha256(raw).hexdigest() == result['sha256']
          (out / 'penney-surprise.png').write_bytes(raw)
          manifest = {
              'bounded': True,
              'count': 1,
              'full_batch_authorized': False,
              'content_class': 'adult_non_explicit',
              'result': {
                  'sha256': result['sha256'],
                  'width': result['width'],
                  'height': result['height'],
                  'seed': result['seed'],
                  'model': result['model'],
                  'elapsed_seconds': result['elapsed_seconds'],
                  'generation_spec': result['generation_spec'],
              },
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print('[creative] bounded one-image generation complete', flush=True)
          PY
      - name: Upload creative surprise artifact
        uses: actions/upload-artifact@v4
        with:
          name: freeframe-creative-surprise
          path: freeframe-creative-surprise/
          if-no-files-found: error
          retention-days: 7
