name: FreeFrame Living-Fabric Creature Canary
on:
  workflow_dispatch:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/creature_world_policy.py'
      - 'modal_worker/guardian_composition_policy.py'
      - 'modal_worker/production_presets.py'
      - 'modal_worker/production_request_builder.py'
      - 'modal_worker/production_style_policy.py'
      - 'modal_worker/style_profiles.py'
      - 'modal_worker/creature_style_canary.py'
      - '.github/workflows/run-creature-style-canary.yml'
permissions:
  contents: read
concurrency:
  group: freeframe-living-fabric-creature-canary
  cancel-in-progress: false
jobs:
  creature-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Compile canary surface
        run: python -m compileall -q modal_worker
      - name: Run four-case living-fabric canary in one L4 app
        run: modal run modal_worker/creature_style_canary.py
      - name: Require all canary outputs
        shell: bash
        run: |
          test -s creature-style-canary/guardian_friendly.png
          test -s creature-style-canary/guardian_corrupt.png
          test -s creature-style-canary/guardian_boss.png
          test -s creature-style-canary/enemy_creature.png
          test -s creature-style-canary/report.json
      - name: Upload living-fabric canary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-fabric-creature-canary-${{ github.run_id }}
          path: creature-style-canary/
          if-no-files-found: warn
          retention-days: 7
