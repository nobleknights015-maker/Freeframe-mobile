name: FreeFrame Current Klein Extraction Smoke

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/current_extraction_smoke.py'
      - '.github/workflows/run-current-extraction-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: freeframe-current-klein-extraction-smoke-v2
  cancel-in-progress: true

jobs:
  extraction-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      GH_TOKEN: ${{ github.token }}
      REHEARSAL_ARTIFACT_ID: '12510563985'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2'
      - name: Download successful Klein rehearsal artifact
        shell: bash
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${REHEARSAL_ARTIFACT_ID}/zip" > rehearsal.zip
          unzip -q rehearsal.zip -d rehearsal
          test -f rehearsal/klein-rehearsal-32/plushbound_character-01.png
          test -f rehearsal/klein-rehearsal-32/plushbound_guardian-01.png
          test -f rehearsal/klein-rehearsal-32/plushbound_enemy-01.png
      - name: Run current subject extraction smoke
        shell: bash
        run: |
          set -o pipefail
          modal run modal_worker/current_extraction_smoke.py \
            --character-path rehearsal/klein-rehearsal-32/plushbound_character-01.png \
            --guardian-path rehearsal/klein-rehearsal-32/plushbound_guardian-01.png \
            --enemy-path rehearsal/klein-rehearsal-32/plushbound_enemy-01.png \
            | tee current-extraction-smoke.log
      - name: Upload extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: current-klein-extraction-smoke-${{ github.run_id }}
          path: |
            current-extraction-smoke.log
            current-extraction-smoke/
          if-no-files-found: warn
          retention-days: 7
