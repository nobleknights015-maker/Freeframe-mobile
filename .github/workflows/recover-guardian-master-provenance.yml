name: Recover Guardian Master Provenance

on:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - modal_worker/guardian_recovery_trigger.json

permissions:
  contents: write
  actions: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
          fetch-depth: 0
      - name: Resolve accepted Guardian master runs and artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path

          repo = os.environ['REPO']
          workflow_id = 394862409

          def gh(path):
              raw = subprocess.check_output(['gh', 'api', path], text=True)
              return json.loads(raw)

          all_runs = gh(f'repos/{repo}/actions/workflows/{workflow_id}/runs?branch=freeframe-modal-worker&per_page=100').get('workflow_runs', [])
          by_number = {int(r['run_number']): r for r in all_runs if r.get('name') == 'Plushbound Max Production Round'}

          # Historical numbering is anchored by verified master Round16 = workflow run_number17.
          # R1 used initial run_number1 plus a resume run_number2; R2=3; R3=4.
          round_numbers = {'round1': [1, 2], 'round2': [3], 'round3': [4]}
          expected_ranges = {'round1': '001-032', 'round2': '033-064', 'round3': '065-096'}
          result = {
              'schema': 'plushbound.guardian_master_recovery.v2',
              'source_workflow_id': workflow_id,
              'source_workflow': 'run-max-production-round.yml',
              'guardian_shard': 1,
              'items_per_round': 32,
              'expected_guardians': 96,
              'rounds': {},
          }

          for label, numbers in round_numbers.items():
              entries = []
              guardian_artifacts = []
              for num in numbers:
                  run = by_number.get(num)
                  if not run:
                      continue
                  arts = gh(f"repos/{repo}/actions/runs/{run['id']}/artifacts?per_page=100").get('artifacts', [])
                  live_guardian = [a for a in arts if ('shard-1' in a.get('name','').lower() or 'shard1' in a.get('name','').lower()) and not a.get('expired')]
                  entries.append({
                      'run_id': run['id'],
                      'run_number': run.get('run_number'),
                      'head_sha': run.get('head_sha'),
                      'display_title': run.get('display_title'),
                      'status': run.get('status'),
                      'conclusion': run.get('conclusion'),
                      'created_at': run.get('created_at'),
                      'artifacts': [
                          {'id': a['id'], 'name': a['name'], 'size_in_bytes': a.get('size_in_bytes'), 'expired': a.get('expired', False)}
                          for a in arts
                      ],
                  })
                  guardian_artifacts.extend([
                      {'id': a['id'], 'name': a['name'], 'size_in_bytes': a.get('size_in_bytes'), 'run_id': run['id'], 'run_number': num}
                      for a in live_guardian
                  ])
              if not guardian_artifacts:
                  raise SystemExit(f'No live Guardian shard artifact found for {label} workflow run numbers {numbers}')
              result['rounds'][label] = {
                  'guardian_ids': expected_ranges[label],
                  'candidate_runs': entries,
                  'guardian_artifacts': guardian_artifacts,
              }

          Path('modal_worker/guardian_recovery_index.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY
      - name: Commit provenance index
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modal_worker/guardian_recovery_index.json
          if git diff --cached --quiet; then
            echo 'No provenance change.'
            exit 0
          fi
          git commit -m 'Recover Guardian master artifact provenance'
          git pull --rebase origin freeframe-modal-worker
          git push origin HEAD:freeframe-modal-worker
