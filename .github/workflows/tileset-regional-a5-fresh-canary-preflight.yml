name: Plushbound Regional A5 Fresh Canary Preflight

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - '.github/preflight/tileset_regional_a5_fresh_canary_preflight.py'
      - '.github/workflows/tileset-regional-a5-fresh-canary-preflight.yml'
      - 'modal_worker/tileset_regional_a5_scope_manifest.json'
      - 'modal_worker/tileset_regional_a5_semantic_readiness_2026-10-28.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  silkspire-one-source-zero-spend-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    env:
      PLUSHBOUND_PRODUCTION_ENABLED: '0'
      PLUSHBOUND_PAID_REMOTE_ENABLED: '0'
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run exact fresh-canary preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python .github/preflight/tileset_regional_a5_fresh_canary_preflight.py \
            --region silkspire \
            --material pale_masonry \
            > fresh-canary-preflight.json
          cat fresh-canary-preflight.json

      - name: Assert zero-spend one-source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('fresh-canary-preflight.json').read_text(encoding='utf-8'))
          assert r['schema'] == 'plushbound.tileset_regional_a5_fresh_canary_preflight.v1'
          assert r['status'] == 'PASS_NO_SPEND_FRESH_CANARY_READY_FOR_EXPLICIT_TRIGGER'
          assert r['region'] == 'silkspire'
          assert r['material_key'] == 'pale_masonry'
          assert r['asset_id'] == 'tileset.silkspire.a5.source.pale_masonry'
          assert r['risk'] == 'low' and r['priority'] == 1
          assert r['prompt_contract_version'] == 'regional-a5-material-swatch-v2'
          assert r['asset_cap'] == 1 and r['generation_attempts_per_asset_cap'] == 1
          assert r['one_region_only'] is True and r['one_source_only'] is True
          assert r['manual_visual_qa_required_before_any_continuation'] is True
          assert r['automatic_remaining_seven_authorized'] is False
          assert r['compile_authorized'] is False and r['deterministic_finalize_authorized'] is False
          assert r['catalog_wide_launch_authorized'] is False
          assert r['production_skipped'] is True and r['paid_remote_execution_skipped'] is True
          assert [r['provider_calls'], r['gpu_calls'], r['generation_calls']] == [0, 0, 0]
          assert r['runtime_import_proof'] is False
          assert all(v == 'PASS' for v in r['checks'].values())
          print('FRESH_CANARY_PREFLIGHT=PASS_ZERO_SPEND')
          PY

      - name: Upload preflight evidence
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-fresh-canary-preflight-${{ github.run_id }}
          path: fresh-canary-preflight.json
          if-no-files-found: error
          retention-days: 14
