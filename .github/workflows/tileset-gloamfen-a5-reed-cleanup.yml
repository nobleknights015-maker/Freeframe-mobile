name: Plushbound Gloamfen A5 Final Reed Zero-GPU Cleanup

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/tileset_gloamfen_a5_reed_cleanup_trigger.json'

permissions:
  contents: read
  actions: read

jobs:
  clean-and-package-eight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deterministic image dependency
        run: python -m pip install --disable-pip-version-check 'pillow>=10.4,<12'

      - name: Validate exact zero-GPU cleanup trigger
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          t=json.loads(Path('modal_worker/tileset_gloamfen_a5_reed_cleanup_trigger.json').read_text(encoding='utf-8'))
          assert t['schema']=='plushbound.tileset_gloamfen_a5_reed_cleanup_trigger.v1'
          assert t['enabled'] is True
          assert t['mode']=='deterministic_cleanup_final_reed_and_package_eight'
          assert t['region']=='gloamfen'
          assert t['asset_id']=='tileset.gloamfen.a5.source.reed_matting'
          assert t['accepted_before']==7 and t['accepted_after_expected']==8
          assert t['crop_margin']==48
          assert [t['provider_calls_allowed'],t['gpu_calls_allowed'],t['generation_calls_allowed']]==[0,0,0]
          assert t['compile_authorized'] is False
          assert t['deterministic_finalize_authorized'] is False
          assert t['catalog_wide_launch_authorized'] is False
          print('GLOAMFEN_REED_CLEANUP_TRIGGER=VALID_ZERO_GPU')
          PY

      - name: Download exact seven-accepted artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-gloamfen-seven-accepted-40716970854
          path: accepted-seven-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40716970854

      - name: Download exact final reed artifact
        uses: actions/download-artifact@v4
        with:
          name: plushbound-a5-gloamfen-final-one-source-40717513377
          path: reed-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 40717513377

      - name: Verify immutable input hashes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          t=json.loads(Path('modal_worker/tileset_gloamfen_a5_reed_cleanup_trigger.json').read_text(encoding='utf-8'))
          seven=Path('accepted-seven-artifact/accepted-seven/gloamfen/manifest.json')
          assert seven.is_file()
          m=json.loads(seven.read_text(encoding='utf-8'))
          assert m['status']=='PARTIAL_ACCEPTANCE_7_OF_8_REED_MATTING_ONLY_REMAINS'
          assert m['accepted_source_count']==7 and m['remaining_failed_source_ids']==[t['asset_id']]
          reed_root=Path('reed-artifact/tileset-regional-a5-single-remaining-repair/gloamfen/reed_matting')
          raw=reed_root/'reed_matting-384.png'; norm=reed_root/'reed_matting-48.png'; report=reed_root/'report.json'
          assert raw.is_file() and norm.is_file() and report.is_file()
          assert hashlib.sha256(raw.read_bytes()).hexdigest()==t['reed_raw_sha256']
          assert hashlib.sha256(norm.read_bytes()).hexdigest()==t['reed_old_normalized_sha256']
          r=json.loads(report.read_text(encoding='utf-8'))
          assert r['machine_accepted'] is True
          assert r['raw_sha256']==t['reed_raw_sha256'] and r['normalized_sha256']==t['reed_old_normalized_sha256']
          assert len(r['accepted_source_ids_excluded'])==7
          assert t['asset_id'] not in r['accepted_source_ids_excluded']
          print('GLOAMFEN_REED_CLEANUP_INPUTS=HASH_LOCK_PASS')
          PY

      - name: Remove reed perimeter deterministically and normalize
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cleaned
          PYTHONPATH=. python modal_worker/tileset_reed_border_cleanup.py \
            --source reed-artifact/tileset-regional-a5-single-remaining-repair/gloamfen/reed_matting/reed_matting-384.png \
            --rebuilt-output cleaned/reed_matting-384.png \
            --normalized-output cleaned/reed_matting-48.png \
            > cleaned/cleanup-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('cleaned/cleanup-report.json').read_text(encoding='utf-8'))
          assert r['accepted'] is True
          assert r['crop_margin']==48
          assert r['inner_size']==[288,288]
          assert r['rebuilt_size']==[384,384] and r['normalized_size']==[48,48]
          assert r['rgb_stddev']>=r['minimum_rgb_stddev']==3.0
          assert r['edge_discontinuity']<=r['maximum_edge_discontinuity']==0.25
          assert [r['provider_calls'],r['gpu_calls'],r['generation_calls']]==[0,0,0]
          print('GLOAMFEN_REED_CLEANUP=MACHINE_PASS_MANUAL_VISUAL_REQUIRED')
          print(f"CLEANED_RAW_SHA256={r['rebuilt_sha256']}")
          print(f"CLEANED_NORMALIZED_SHA256={r['normalized_sha256']}")
          PY

      - name: Package full eight-source candidate without compiling A5
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          from PIL import Image,ImageDraw,ImageOps
          seven_root=Path('accepted-seven-artifact/accepted-seven/gloamfen')
          seven=json.loads((seven_root/'manifest.json').read_text(encoding='utf-8'))
          cleanup=json.loads(Path('cleaned/cleanup-report.json').read_text(encoding='utf-8'))
          out=Path('accepted-eight-candidate/gloamfen'); raw_out=out/'raw'; norm_out=out/'normalized'
          raw_out.mkdir(parents=True,exist_ok=True); norm_out.mkdir(parents=True,exist_ok=True)
          sources=[]
          for row in seven['accepted_sources']:
              m=row['material_key']
              shutil.copy2(seven_root/'raw'/f'{m}-384.png',raw_out/f'{m}-384.png')
              shutil.copy2(seven_root/'normalized'/f'{m}-48.png',norm_out/f'{m}-48.png')
              assert hashlib.sha256((raw_out/f'{m}-384.png').read_bytes()).hexdigest()==row['raw_sha256']
              assert hashlib.sha256((norm_out/f'{m}-48.png').read_bytes()).hexdigest()==row['normalized_sha256']
              sources.append(row)
          shutil.copy2('cleaned/reed_matting-384.png',raw_out/'reed_matting-384.png')
          shutil.copy2('cleaned/reed_matting-48.png',norm_out/'reed_matting-48.png')
          sources.append({
              'asset_id':'tileset.gloamfen.a5.source.reed_matting',
              'material_key':'reed_matting',
              'raw_sha256':cleanup['rebuilt_sha256'],
              'normalized_sha256':cleanup['normalized_sha256'],
              'machine_status':'PASS_AFTER_ZERO_GPU_BORDER_CLEANUP',
              'manual_visual_status':'PENDING',
              'origin':'single_repair_plus_zero_gpu_border_cleanup',
              'cleanup_report':cleanup,
          })
          assert len(sources)==8 and len({s['asset_id'] for s in sources})==8
          order=['marsh_mud','damp_moss','shallow_silt','reed_matting','boardwalk_timber','drowned_stone','fungal_moss','dark_peat']
          by={s['material_key']:s for s in sources}
          assert set(by)==set(order)
          cell=384; label=28
          sheet=Image.new('RGBA',(cell*4,(cell+label)*2),(24,24,24,255)); draw=ImageDraw.Draw(sheet)
          for i,m in enumerate(order):
              with Image.open(raw_out/f'{m}-384.png') as im:
                  tile=ImageOps.fit(im.convert('RGBA'),(cell,cell))
              x=(i%4)*cell; y=(i//4)*(cell+label)
              sheet.alpha_composite(tile,(x,y)); draw.text((x+8,y+cell+6),m,fill=(240,240,240,255))
          sheet.save(out/'contact-sheet-eight-candidate.png',format='PNG')
          manifest={
              'schema':'plushbound.tileset_gloamfen_a5_eight_source_candidate.v1',
              'status':'MACHINE_PASS_8_OF_8_MANUAL_7_OF_8_REED_PENDING',
              'region':'gloamfen','target_sheet_type':'A5','stable_sheet_id':'tileset.gloamfen.a5',
              'source_count':8,'machine_pass_count':8,'manual_pass_count':7,'manual_pending_count':1,
              'accepted_assets_immutable':True,'compile_authorized':False,'deterministic_finalize_authorized':False,
              'catalog_wide_launch_authorized':False,'runtime_import_proof':False,
              'provider_calls_this_packaging':0,'gpu_calls_this_packaging':0,'generation_calls_this_packaging':0,
              'sources':[by[m] for m in order],
          }
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True),encoding='utf-8')
          print('GLOAMFEN_EIGHT_SOURCE_CANDIDATE=READY_REED_MANUAL_QA_PENDING')
          PY

      - name: Upload full eight-source candidate
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-a5-gloamfen-eight-source-candidate-${{ github.run_id }}
          path: |
            accepted-eight-candidate/
            cleaned/cleanup-report.json
          if-no-files-found: error
          retention-days: 14
