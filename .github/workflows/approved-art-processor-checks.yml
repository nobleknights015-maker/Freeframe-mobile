name: Approved Plushbound Art Processor Checks

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/approved_art_processor.py'
      - 'approved_art/**'
      - '.github/workflows/process-approved-plushbound-art.yml'
      - '.github/workflows/approved-art-processor-checks.yml'
  pull_request:
    paths:
      - 'modal_worker/approved_art_processor.py'
      - 'approved_art/**'
      - '.github/workflows/process-approved-plushbound-art.yml'
      - '.github/workflows/approved-art-processor-checks.yml'

permissions:
  contents: read

jobs:
  safe-lane:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install import dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile approved-art processor
        run: python -m py_compile modal_worker/approved_art_processor.py
      - name: Enforce no-generation and no-GPU contract
        run: |
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          text = Path('modal_worker/approved_art_processor.py').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/process-approved-plushbound-art.yml').read_text(encoding='utf-8')
          manifest = json.loads(Path('approved_art/rounds/next_round.json').read_text(encoding='utf-8'))
          forbidden = ['FLUX.2', 'klein-4B', 'diffusers', 'text_to_image', 'image_to_image', 'gpu=']
          for token in forbidden:
              assert token not in text, f'Forbidden generation/GPU token in approved processor: {token}'
          assert 'modal_worker/freeframe_worker.py' not in workflow
          assert 'modal deploy' not in workflow
          assert manifest['provenance'] == 'vera-chatgpt-approved'
          assert manifest['generator_calls_allowed'] is False
          assert manifest['gpu_allowed'] is False
          print('APPROVED_ART_SAFE_LANE=PASS')
          PY
