name: FreeFrame Creature Reference A-B Canary

on:
  workflow_dispatch:
  push:
    branches: [freeframe-modal-worker]
    paths:
      - 'modal_worker/creature_reference_ab_canary.py'
      - '.github/workflows/run-creature-reference-ab-canary.yml'

permissions:
  contents: read

concurrency:
  group: freeframe-creature-reference-ab-canary
  cancel-in-progress: false

jobs:
  creature-reference-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID"
          test -n "$MODAL_TOKEN_SECRET"
      - name: Install Modal CLI
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12'
      - name: Compile diagnostic
        run: python -m compileall -q modal_worker/creature_reference_ab_canary.py modal_worker/creature_pose_guides.py modal_worker/creature_world_policy.py
      - name: Run three-case pose-only diagnostic in one L4 app
        run: modal run modal_worker/creature_reference_ab_canary.py
      - name: Require outputs
        shell: bash
        run: |
          test -s creature-reference-ab-canary/friendly_quadruped_pose_only.png
          test -s creature-reference-ab-canary/boss_hexapod_pose_only.png
          test -s creature-reference-ab-canary/enemy_hexapod_pose_only.png
          test -s creature-reference-ab-canary/report.json
      - name: Upload diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: creature-reference-ab-canary-${{ github.run_id }}
          path: creature-reference-ab-canary/
          if-no-files-found: error
          retention-days: 7
