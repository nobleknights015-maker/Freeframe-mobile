name: Plushbound Max Production Round

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/max_mode_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-max-production
  cancel-in-progress: false

jobs:
  produce:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Compile production surface
        run: python -m compileall -q modal_worker
      - name: Read max-mode trigger
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          data=json.load(open('modal_worker/max_mode_trigger.json','r',encoding='utf-8'))
          if not data.get('enabled', False):
              raise SystemExit('max mode trigger is disabled')
          round_number=int(data['round'])
          if round_number < 1:
              raise SystemExit('round must be at least 1')
          print(f'ROUND_NUMBER={round_number}')
          PY
      - name: Run Vera max-mode shard
        shell: bash
        run: |
          set -euo pipefail
          modal run modal_worker/max_production_round.py --shard '${{ matrix.shard }}' --round-number "$ROUND_NUMBER" | tee "max-production-shard-${{ matrix.shard }}.log"
      - name: Upload production shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-max-round-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: |
            max-production-shard-${{ matrix.shard }}.log
            max-production-output/
          if-no-files-found: warn
          retention-days: 30
