name: Plushbound Max Production Round

on:
  push:
    branches:
      - freeframe-modal-worker
    paths:
      - 'modal_worker/max_mode_trigger.json'

permissions:
  contents: read

concurrency:
  group: plushbound-max-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      round_number: ${{ steps.trigger.outputs.round_number }}
      jobs: ${{ steps.trigger.outputs.jobs }}
      sublanes_per_shard: ${{ steps.trigger.outputs.sublanes_per_shard }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - name: Read max-mode trigger
        id: trigger
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          data=json.load(open('modal_worker/max_mode_trigger.json','r',encoding='utf-8'))
          if not data.get('enabled', False):
              raise SystemExit('max mode trigger is disabled')
          round_number=int(data['round'])
          if round_number < 1:
              raise SystemExit('round must be at least 1')
          shards=data.get('shards',[0,1,2,3])
          if not isinstance(shards,list) or not shards:
              raise SystemExit('shards must be a non-empty list')
          shards=[int(x) for x in shards]
          if any(x not in (0,1,2,3) for x in shards) or len(shards)!=len(set(shards)):
              raise SystemExit('shards must contain unique values from 0..3')
          sublanes=int(data.get('sublanes_per_shard',1))
          if sublanes < 1 or sublanes > 4:
              raise SystemExit('sublanes_per_shard must be between 1 and 4')
          jobs=[{'shard': shard, 'sublane': sublane} for shard in shards for sublane in range(sublanes)]
          print(f'round_number={round_number}')
          print(f'sublanes_per_shard={sublanes}')
          print('jobs='+json.dumps(jobs,separators=(',',':')))
          PY

  produce:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.jobs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      ROUND_NUMBER: ${{ needs.prepare.outputs.round_number }}
      SUBLANES_PER_SHARD: ${{ needs.prepare.outputs.sublanes_per_shard }}
    steps:
      - name: Check out production branch
        uses: actions/checkout@v4
        with:
          ref: freeframe-modal-worker
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require Modal credentials
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || { echo 'MODAL_TOKEN_ID secret is not configured.' >&2; exit 1; }
          test -n "$MODAL_TOKEN_SECRET" || { echo 'MODAL_TOKEN_SECRET secret is not configured.' >&2; exit 1; }
      - name: Install runner dependencies
        run: python -m pip install --disable-pip-version-check 'modal>=1.5,<2' 'pillow>=10.4,<12' 'numpy>=1.26,<2'
      - name: Compile production surface
        run: python -m compileall -q modal_worker
      - name: Run Vera max-mode stream
        shell: bash
        run: |
          set -euo pipefail
          LOG="max-production-shard-${{ matrix.shard }}-sublane-${{ matrix.sublane }}.log"
          if [ "$SUBLANES_PER_SHARD" -gt 1 ]; then
            python -m modal_worker.max_production_turbo \
              --shard '${{ matrix.shard }}' \
              --round-number "$ROUND_NUMBER" \
              --sublane '${{ matrix.sublane }}' | tee "$LOG"
          else
            python -m modal_worker.max_production_direct \
              --shard '${{ matrix.shard }}' \
              --round-number "$ROUND_NUMBER" | tee "$LOG"
          fi
      - name: Upload production stream
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plushbound-max-round-${{ env.ROUND_NUMBER }}-shard-${{ matrix.shard }}-sublane-${{ matrix.sublane }}-${{ github.run_id }}
          path: |
            max-production-shard-${{ matrix.shard }}-sublane-${{ matrix.sublane }}.log
            max-production-output/
          if-no-files-found: warn
          retention-days: 30
